<!DOCTYPE html>
<html lang="hi">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-44P15THF26"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-44P15THF26');

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jaipuri Kurtis – Sainiwalaa</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{ --primary:#0f172a; --accent:#ff9900; --bg:#f8fafc; --card:#ffffff; }
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins}
body{background:var(--bg); color:#333; overflow-x:hidden;}

#main-header{
  background:#000;color:#fff;display:flex;justify-content:space-between;
  align-items:center;padding:14px 22px;position:sticky;top:0;z-index:1001;
}
.menu-toggle{display:none;flex-direction:column;gap:5px;cursor:pointer;}
.menu-toggle span{width:25px;height:3px;background:var(--accent);}
#menu{display:flex;gap:20px;}
#menu a{color:#fff;text-decoration:none;font-weight:600;font-size:14px;}

.hero-banner{
  background:linear-gradient(45deg,#4b0f14,#7a1f26);
  color:#fff;padding:35px 15px;text-align:center;
}
.hero-banner h1{font-size:26px;color:#f6d27c;}
.hero-banner p{font-size:14px;opacity:.9;}

.products-grid{
  max-width:1200px;margin:20px auto;padding:0 10px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:15px;
}
.card{
  background:#fff;border-radius:12px;overflow:hidden;
  box-shadow:0 4px 10px rgba(0,0,0,.06);
  display:flex;flex-direction:column;text-align:center;
}

/* ✅ IMAGE FIT FIX */
.card img{
  width:100%;
  height:280px;
  object-fit:contain;
  background:#fff;
  padding:8px;
}

.card-info{
  padding:12px;flex-grow:1;
  display:flex;flex-direction:column;justify-content:space-between;
}
.card-info h3{font-size:13px;height:36px;overflow:hidden;}
.price{font-size:16px;font-weight:700;color:#2e7d32;margin-bottom:10px;}
.buy-btn{
  background:var(--accent);color:#000;text-decoration:none;
  padding:8px;border-radius:6px;font-weight:700;font-size:13px;
}

#sw-footer{
  background:#050b1a;color:#fff;padding:40px 15px;margin-top:50px;
  border-top:3px solid var(--accent);
}
#sw-marquee{text-align:center;margin-bottom:20px;}
#sw-inner{
  max-width:1200px;margin:auto;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:35px;
}
#sw-bottom{text-align:center;margin-top:20px;font-size:12px;opacity:.5;}

@media(max-width:768px){
  .menu-toggle{display:flex;}
  #menu{
    position:fixed;top:0;right:-100%;width:75%;height:100vh;
    background:#111;flex-direction:column;padding:80px 30px;
    transition:.4s;
  }
  #menu.active{right:0;}
  .products-grid{grid-template-columns:repeat(2,1fr);}
  .card img{height:210px;}
}
</style>
</head>

<body>

<header id="main-header">
  <div style="font-weight:700;font-size:18px;cursor:pointer" onclick="location.href='index.html'">SAINIWALAA</div>
  <div class="menu-toggle" id="mobile-menu-btn"><span></span><span></span><span></span></div>
  <nav id="menu"></nav>
</header>

<div class="hero-banner">
  <h1>Jaipuri Kurtis-Saree Collection</h1>
  <p>Authentic Ethnic Wear from Jaipur</p>
</div>

<div class="products-grid" id="product-box">
  <p style="grid-column:1/-1;text-align:center;padding:40px;">Loading Kurtis…</p>
</div>

<footer id="sw-footer">
  <div id="sw-marquee"></div>
  <div id="sw-inner">
    <div id="f-left"></div>
    <div id="f-center"></div>
    <div id="f-right"></div>
  </div>
  <div id="sw-bottom"></div>
</footer>

<script>
const menuBtn=document.getElementById('mobile-menu-btn');
const navMenu=document.getElementById('menu');
menuBtn.onclick=()=>navMenu.classList.toggle('active');

const H_API="https://script.google.com/macros/s/AKfycbxajNF_583kuHsHZuky-oolW6vumnUtdy6t3OU_Rj94C5aYe8RDxO-qPhHR-0hixzjxuA/exec";
const K_API="https://script.google.com/macros/s/AKfycbxBa6NpqTYj48z7Q2rrLfpMDii8D558sdUgG58Frq5ong-2yA-VSMCCzBzygQtV2Sa7/exec";
const F_API="https://script.google.com/macros/s/AKfycbwjpcQVkdSR_eXf5b9fWusK9JMqKBW9sP3Zz5rds4AxvcILAwICp9k89hMQNZ9rN1L1/exec";

/* HEADER */
fetch(H_API).then(r=>r.json()).then(d=>{
  d.menu.forEach(m=>menu.innerHTML+=`<a href="${m.link}">${m.text}</a>`);
});

/* PRODUCTS – SAFE FAST LOAD */
setTimeout(()=>{
fetch(K_API)
.then(r=>r.json())
.then(data=>{
  const box=document.getElementById('product-box');
  box.innerHTML="";
  data.forEach(p=>{
    box.innerHTML+=`
    <div class="card">
      <img src="${p.IMAGELINK||p.IMAGE||''}" loading="lazy"
      onerror="this.src='https://via.placeholder.com/300x400?text=Sainiwalaa'">
      <div class="card-info">
        <h3>${p.NAME||''}</h3>
        <div class="price">₹${p.PRICE||0}</div>
        <a class="buy-btn" href="${p.LINK||'#'}" target="_blank">Buy Now</a>
      </div>
    </div>`;
  });
})
.catch(()=>{
  document.getElementById('product-box').innerHTML=
  "<p style='grid-column:1/-1;text-align:center;'>Server slow hai, thodi der baad try karein</p>";
});
},200);

/* FOOTER */
fetch(F_API).then(r=>r.json()).then(d=>{
  if(!d.footer)return;
  d.footer.forEach(i=>{
    let box=i.POSITION==="LEFT"?f-left:i.POSITION==="CENTER"?f-center:i.POSITION==="RIGHT"?f-right:i.POSITION==="BOTTOM"?sw-bottom:sw-marquee;
    if(i.TYPE==="MARQUEE")box.innerHTML=`<span>${i.TEXT}</span>`;
    if(i.TYPE==="TEXT")box.innerHTML+=`<p>${i.TEXT}</p>`;
  });
});
</script>

</body>
</html>
