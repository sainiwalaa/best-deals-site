<!DOCTYPE html>
<html lang="hi">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-44P15THF26"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-44P15THF26');
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jaipuri Kurtis – Sainiwalaa</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{ --primary:#0f172a; --accent:#ff9900; --bg:#f8fafc; --card:#ffffff; }
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins}
body{background:var(--bg); color:#333; overflow-x:hidden;}

#main-header{
background:#000;color:#fff;display:flex;justify-content:space-between;
align-items:center;padding:14px 22px;position:sticky;top:0;z-index:1001;
}
.menu-toggle{display:none;flex-direction:column;gap:5px;cursor:pointer;}
.menu-toggle span{width:25px;height:3px;background:var(--accent);}
#menu{display:flex;gap:20px;}
#menu a{color:#fff;text-decoration:none;font-weight:600;font-size:14px;}

.hero-banner{
background:linear-gradient(45deg,#4b0f14,#7a1f26);
color:#fff;padding:35px 15px;text-align:center;
}
.hero-banner h1{font-size:26px;color:#f6d27c;}
.hero-banner p{font-size:14px;opacity:.9;}

.products-grid{
max-width:1200px;margin:20px auto;padding:0 10px;
display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
gap:15px;
}
.card{
background:#fff;border-radius:12px;overflow:hidden;
box-shadow:0 4px 10px rgba(0,0,0,.06);
display:flex;flex-direction:column;text-align:center;
}

/* IMAGE FIT */
.card img{
width:100%;
height:280px;
object-fit:contain;
background:#fff;
padding:8px;
}

.card-info{
padding:12px;flex-grow:1;
display:flex;flex-direction:column;justify-content:space-between;
}
.card-info h3{font-size:13px;height:36px;overflow:hidden;}
.price{font-size:16px;font-weight:700;color:#2e7d32;margin-bottom:10px;}
.buy-btn{
background:var(--accent);color:#000;text-decoration:none;
padding:8px;border-radius:6px;font-weight:700;font-size:13px;
}

/* FOOTER SAME AS INDEX */
#sw-footer{
background:#050b1a;color:#fff;padding:50px 20px 30px;
margin-top:50px;border-top:4px solid var(--accent);
}
#sw-marquee{
overflow:hidden;white-space:nowrap;padding-bottom:20px;
border-bottom:1px solid rgba(255,255,255,0.1);margin-bottom:30px;
}
#sw-marquee span{
display:inline-block;
animation:scroll-text 20s linear infinite;
color:var(--accent);font-weight:700;
}
@keyframes scroll-text{
from{transform:translateX(100%)}
to{transform:translateX(-100%)}
}
#sw-inner{
max-width:1200px;margin:auto;
display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:40px;
}
.sw-links-container a{
display:block;margin:10px 0;color:#fff;text-decoration:none;font-size:14px;
}
.sw-social-container{
display:flex;gap:10px;margin-top:15px;flex-wrap:wrap;
}
.sw-social-container a{
border:1px solid var(--accent);
padding:5px 15px;border-radius:8px;
color:var(--accent)!important;text-decoration:none;font-size:13px;
}
#sw-bottom{
text-align:center;margin-top:40px;padding-top:20px;
border-top:1px solid rgba(255,255,255,0.1);
opacity:.5;font-size:12px;
}

@media(max-width:768px){
.menu-toggle{display:flex;}
#menu{
position:fixed;top:0;right:-100%;width:75%;height:100vh;
background:#111;flex-direction:column;padding:80px 30px;
transition:.4s;
}
#menu.active{right:0;}
.products-grid{grid-template-columns:repeat(2,1fr);}
.card img{height:210px;}
}
</style>
</head>

<body>

<header id="main-header">
<div style="font-weight:700;font-size:18px;cursor:pointer" onclick="location.href='index.html'">SAINIWALAA</div>
<div class="menu-toggle" id="mobile-menu-btn"><span></span><span></span><span></span></div>
<nav id="menu"></nav>
</header>

<div class="hero-banner">
<h1>Jaipuri Kurtis-Saree Collection</h1>
<p>Authentic Ethnic Wear from Jaipur</p>
</div>

<div class="products-grid" id="product-box">
<p style="grid-column:1/-1;text-align:center;padding:40px;">Loading Kurtis…</p>
</div>

<footer id="sw-footer">
<div id="sw-marquee"></div>
<div id="sw-inner">
<div id="f-left"></div>
<div id="f-center"></div>
<div id="f-right"></div>
</div>
<div id="sw-bottom"></div>
</footer>

<script>
const menuBtn=document.getElementById('mobile-menu-btn');
const navMenu=document.getElementById('menu');
menuBtn.onclick=()=>navMenu.classList.toggle('active');

const H_API="https://script.google.com/macros/s/AKfycbxajNF_583kuHsHZuky-oolW6vumnUtdy6t3OU_Rj94C5aYe8RDxO-qPhHR-0hixzjxuA/exec";
const K_API="https://script.google.com/macros/s/AKfycbxBa6NpqTYj48z7Q2rrLfpMDii8D558sdUgG58Frq5ong-2yA-VSMCCzBzygQtV2Sa7/exec";
const F_API="https://script.google.com/macros/s/AKfycbwjpcQVkdSR_eXf5b9fWusK9JMqKBW9sP3Zz5rds4AxvcILAwICp9k89hMQNZ9rN1L1/exec";

/* HEADER */
fetch(H_API).then(r=>r.json()).then(d=>{
d.menu.forEach(m=>{
document.getElementById('menu').innerHTML+=`<a href="${m.link}">${m.text}</a>`;
});
});

/* PRODUCTS */
setTimeout(()=>{
fetch(K_API)
.then(r=>r.json())
.then(data=>{
const box=document.getElementById('product-box');
box.innerHTML="";
data.forEach(p=>{
box.innerHTML+=`
<div class="card">
<img src="${p.IMAGELINK||p.IMAGE||''}" loading="lazy"
onerror="this.src='https://via.placeholder.com/300x400?text=Sainiwalaa'">
<div class="card-info">
<h3>${p.NAME||''}</h3>
<div class="price">₹${p.PRICE||0}</div>
<a class="buy-btn" href="${p.LINK||'#'}" target="_blank">Buy Now</a>
</div>
</div>`;
});
})
.catch(()=>{
document.getElementById('product-box').innerHTML=
"<p style='grid-column:1/-1;text-align:center;'>Server slow hai, thodi der baad try karein</p>";
});
},200);

/* FULL FOOTER SAME AS INDEX */
fetch(F_API).then(r=>r.json()).then(d=>{
if(!d.footer)return;
d.footer.forEach(i=>{
let box =
i.POSITION==="LEFT"?document.getElementById("f-left"):
i.POSITION==="CENTER"?document.getElementById("f-center"):
i.POSITION==="RIGHT"?document.getElementById("f-right"):
i.POSITION==="BOTTOM"?document.getElementById("sw-bottom"):
document.getElementById("sw-marquee");

if(i.TYPE==="MARQUEE") box.innerHTML=`<span>${i.TEXT}</span>`;
else if(i.TYPE==="TITLE") box.innerHTML+=`<h2>${i.TEXT}</h2>`;
else if(i.TYPE==="TEXT") box.innerHTML+=`<p>${i.TEXT}</p>`;
else if(i.TYPE==="LINK") box.innerHTML+=`<div class="sw-links-container"><a href="${i.LINK}">${i.TEXT}</a></div>`;
else if(i.TYPE==="SOCIAL"){
let sc=box.querySelector('.sw-social-container')||
box.insertAdjacentElement('beforeend',
Object.assign(document.createElement('div'),{className:'sw-social-container'}));
sc.innerHTML+=`<a href="${i.LINK}">${i.TEXT}</a>`;
}
else if(i.TYPE==="BOTTOM") box.innerText=i.TEXT;
});
});
</script>

</body>
</html>
