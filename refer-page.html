<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sainiwalaa – Work From Home Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        :root { 
            --orange: #ff9900; 
            --dark-blue: #0f172a; 
            --light-bg: #f1f5f9;
            --white: #ffffff;
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--light-bg); color: #1e293b; overflow-x: hidden; }

        /* --- Header (Same as Index) --- */
        #main-header { 
            background: #000; color: #fff; display: flex; justify-content: space-between; 
            align-items: center; padding: 12px 20px; position: sticky; top: 0; z-index: 1001; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .logo { font-weight:900; font-size: 22px; color:#febd69; text-decoration:none; letter-spacing:1px; }

        /* --- Hero Section (Compact & Sleek) --- */
        .hero {
            background: linear-gradient(135deg, #000 0%, #1e293b 100%);
            padding: 40px 20px; text-align: center; color: white;
            border-bottom: 5px solid var(--orange);
        }
        .hero h1 { font-size: clamp(22px, 5vw, 36px); font-weight: 800; color: var(--orange); margin-bottom: 8px; }
        .hero p { font-size: 14px; opacity: 0.8; font-weight: 300; letter-spacing: 0.5px; }

        /* --- Main Content Grid --- */
        .container { max-width: 1100px; margin: 30px auto; padding: 0 15px; }
        
        .refer-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); 
            gap: 25px; 
        }

        /* --- Premium Card Design --- */
        .card { 
            background: var(--white); border-radius: 24px; overflow: hidden; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.05); transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            border: 1px solid rgba(0,0,0,0.03); display: flex; flex-direction: column;
        }
        .card:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(255,153,0,0.15); }

        /* Image Box - Fixed Ratio */
        .img-box { 
            width: 100%; position: relative; padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background: #f8fafc; overflow: hidden;
        }
        .img-box iframe, .img-box img { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; border: none; transition: 0.5s;
        }
        .card:hover .img-box img { transform: scale(1.08); }

        .card-content { padding: 20px; flex-grow: 1; text-align: left; }
        .tag { 
            display: inline-block; background: #fff7ed; color: #c2410c; 
            font-size: 10px; font-weight: 800; padding: 4px 12px; 
            border-radius: 50px; text-transform: uppercase; margin-bottom: 12px;
            border: 1px solid #ffedd5;
        }

        .card-content h3 { font-size: 18px; color: var(--dark-blue); margin-bottom: 8px; font-weight: 700; }
        .card-content p { font-size: 13px; color: #64748b; line-height: 1.5; margin-bottom: 20px; }

        /* --- Buttons Design --- */
        .btn-row { display: grid; grid-template-columns: 1fr 1.2fr; gap: 10px; }
        .btn { 
            padding: 12px 5px; border-radius: 12px; text-align: center; 
            text-decoration: none; font-weight: 700; font-size: 13px; transition: 0.3s;
        }
        .btn-details { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
        .btn-details:hover { background: #e2e8f0; }

        .btn-join { 
            background: linear-gradient(180deg, #febd69, #ff9900); color: #000; 
            box-shadow: 0 4px 0 #ca8a04; border: 1px solid #a88734;
        }
        .btn-join:active { transform: translateY(3px); box-shadow: none; }

        /* --- Modal Popup --- */
        .modal { 
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); 
            z-index: 2000; align-items: center; justify-content: center; padding: 20px;
            backdrop-filter: blur(8px);
        }
        .modal-wrap { 
            background: white; width: 100%; max-width: 500px; border-radius: 30px; 
            padding: 30px; position: relative; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .close-icon { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: #cbd5e1; }

        /* --- Footer --- */
        #sw-footer { background: #000; color: #fff; padding: 40px 20px; text-align: center; border-top: 4px solid var(--orange); }

        #loading { text-align: center; padding: 80px 20px; font-weight: bold; color: var(--orange); font-size: 18px; }

        /* --- Mobile Responsiveness --- */
        @media (max-width: 480px) {
            .refer-grid { grid-template-columns: 1fr; gap: 20px; }
            .hero { padding: 30px 15px; }
            .card-content h3 { font-size: 17px; }
            .img-box { padding-top: 50%; } /* Slightly shorter images on mobile */
        }
    </style>
</head>
<body>

<header id="main-header">
    <a href="index.html" class="logo">SAINIWALAA</a>
    <div style="font-size: 10px; border: 1px solid #febd69; padding: 2px 8px; border-radius: 4px; color: #febd69;">OFFICIAL</div>
</header>

<section class="hero">
    <h1 data-aos="fade-down">WORK FROM HOME</h1>
    <p data-aos="fade-up">Trusted Apps & Direct Referral Links by Sainiwalaa</p>
</section>

<div class="container">
    <div id="loading">Connecting to Database...</div>
    <div class="refer-grid" id="refer-root"></div>
</div>

<div class="modal" id="infoModal">
    <div class="modal-wrap">
        <span class="close-icon" onclick="closeModal()">&times;</span>
        <h2 id="modalTitle" style="color: var(--orange); margin-bottom: 12px; font-size: 20px; font-weight: 800;"></h2>
        <div id="modalBody" style="line-height: 1.6; font-size: 14px; color: #475569; max-height: 300px; overflow-y: auto;"></div>
        <button class="btn btn-join" style="width: 100%; margin-top: 20px;" onclick="closeModal()">Got it!</button>
    </div>
</div>

<footer id="sw-footer">
    <div class="logo">SAINIWALAA</div>
    <p style="font-size: 11px; opacity: 0.5; margin-top: 10px;">© 2026 Earning Portal. All Rights Reserved.</p>
</footer>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
    AOS.init();

    const API = "https://script.google.com/macros/s/AKfycbyQ6s-hGiq89aO0a2753HkuDwwEWi2wiSH9p02JJyKd_P-reqX0pVLImP4eSjVwPIbiBw/exec";

    function getYT(url) {
        if (!url) return null;
        let match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
        return (match && match[2].length == 11) ? "https://www.youtube.com/embed/" + match[2] : null;
    }

    async function init() {
        try {
            const res = await fetch(API);
            const data = await res.json();
            document.getElementById('loading').style.display = 'none';
            const root = document.getElementById('refer-root');

            data.forEach((item, i) => {
                let vid = getYT(item.VIDEO_URL);
                let media = vid 
                    ? `<iframe src="${vid}" allowfullscreen></iframe>`
                    : `<img src="${item.IMAGE_URL}" onerror="this.src='https://via.placeholder.com/400x225?text=Sainiwalaa+Image'">`;

                root.innerHTML += `
                    <div class="card" data-aos="fade-up" data-aos-delay="${i * 50}">
                        <div class="img-box">${media}</div>
                        <div class="card-content">
                            <span class="tag">${item.TAG || 'Referral'}</span>
                            <h3>${item.TITLE}</h3>
                            <p>${item.DESCRIPTION}</p>
                            <div class="btn-row">
                                <button class="btn btn-details" onclick="openModal('${item.TITLE}', \`${item.LONG_INFO}\`)">Details</button>
                                <a href="${item.LINK}" target="_blank" class="btn btn-join">Start Now</a>
                            </div>
                        </div>
                    </div>
                `;
            });
        } catch (e) {
            document.getElementById('loading').innerText = "Failed to load data!";
        }
    }

    function openModal(t, b) {
        document.getElementById('modalTitle').innerText = t;
        document.getElementById('modalBody').innerHTML = b.replace(/\n/g, "<br>");
        document.getElementById('infoModal').style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    function closeModal() {
        document.getElementById('infoModal').style.display = 'none';
        document.body.style.overflow = 'auto';
    }

    window.onclick = (e) => { if(e.target == document.getElementById('infoModal')) closeModal(); }

    init();
</script>
</body>
</html>
