<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sainiwalaa - Premium Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --amz-blue: #131921; --amz-orange: #ff9900; --bg: #eaeded; --frame-bg: #1a1a1a; }
        body { font-family: 'Poppins', sans-serif; margin: 0; background: var(--bg); overflow-x: hidden; }

        header { background: var(--amz-blue); padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        #menu a { color: white; text-decoration: none; margin-left: 12px; font-size: 13px; font-weight: 600; }

        /* BANNER FRAME */
        .banner-frame { 
            width: 94%; height: 220px; margin: 15px auto; 
            border: 2px solid var(--amz-orange); border-radius: 12px; 
            overflow: hidden; background: var(--frame-bg); position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        #banner-root { display: flex; height: 100%; transition: transform 0.8s ease-in-out; }
        .slide { min-width: 100%; height: 100%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .slide img { width: 100%; height: 100%; object-fit: contain; }

        /* CATEGORIES */
        .cat-row { display: flex; overflow-x: auto; padding: 15px 10px; gap: 15px; scrollbar-width: none; }
        .cat-row::-webkit-scrollbar { display: none; }
        .cat-item { text-align: center; min-width: 75px; cursor: pointer; }
        .cat-circle { width: 68px; height: 68px; border-radius: 50%; border: 2.5px solid var(--amz-orange); padding: 2px; background: #fff; margin: 0 auto; box-shadow: 0 3px 6px rgba(0,0,0,0.1); }
        .cat-circle img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .cat-item p { font-size: 11px; font-weight: 600; margin-top: 8px; color: #444; }

        /* PRODUCT GRID */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
        .p-card { background: white; border-radius: 10px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); text-align: center; }
        .p-card img { width: 100%; height: 130px; object-fit: contain; }
        .p-price { color: #B12704; font-size: 20px; font-weight: 700; margin: 10px 0; }
        .btn { background: linear-gradient(to bottom, #f7dfa1, #f0c14b); border: 1px solid #a88734; border-radius: 7px; padding: 10px; display: block; text-align: center; text-decoration: none; color: #111; font-size: 13px; font-weight: 600; }

        /* ADVANCED FOOTER (Kurti Page Style) */
        #sw-footer { background: #050b1a; color: #fff; padding: 40px 15px; margin-top: 50px; border-top: 3px solid var(--amz-orange); text-align: center; }
        
        #sw-marquee { overflow: hidden; white-space: nowrap; padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 25px; }
        #sw-marquee span { display: inline-block; animation: scroll 20s linear infinite; color: var(--amz-orange); font-weight: 600; }
        @keyframes scroll { from { transform: translateX(100%) } to { transform: translateX(-100%) } }

        #sw-inner { max-width: 1200px; margin: auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 35px; }
        .sw-links a { display: block; color: #fff; text-decoration: none; margin-bottom: 10px; font-size: 14px; opacity: 0.8; }
        .sw-links a::before { content: "› "; color: var(--amz-orange); }
        
        .sw-social { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; justify-content: center; }
        .sw-social a { padding: 6px 15px; border: 1px solid rgba(255,153,0,0.5); color: var(--amz-orange); text-decoration: none; border-radius: 6px; font-size: 12px; font-weight: 600; background: rgba(255,153,0,0.05); }
        
        #sw-bottom { text-align: center; margin-top: 30px; opacity: 0.5; font-size: 12px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }

        #loader { position: fixed; inset: 0; background: white; z-index: 9999; display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--amz-blue); }
    </style>
</head>
<body>

<div id="loader">SAINIWALAA...</div>

<header>
    <div style="font-size: 22px; font-weight: bold; color: #febd69; letter-spacing: 1px; cursor:pointer;" onclick="location.href='index.html'">SAINIWALAA</div>
    <div id="menu"></div>
</header>

<div class="banner-frame">
    <div id="banner-root"></div>
</div>

<div class="cat-row" id="cat-root"></div>

<div style="padding: 15px 15px 5px; font-weight: bold; font-size: 19px; color: #222;">Special Offers Today 🔥</div>
<div class="grid" id="prod-root"></div>

<footer id="sw-footer">
    <div id="sw-marquee"></div>
    <div id="sw-inner">
        <div id="f-left"></div>
        <div id="f-center"></div>
        <div id="f-right"></div>
    </div>
    <div id="sw-bottom"></div>
</footer>

<script>
const APIs = [
    "https://script.google.com/macros/s/AKfycbxajNF_583kuHsHZuky-oolW6vumnUtdy6t3OU_Rj94C5aYe8RDxO-qPhHR-0hixzjxuA/exec", 
    "https://script.google.com/macros/s/AKfycbwxPgyRuXZPAUgnLBC0vkNx-bCgbOUS2hkrPbQfadwk6pFabK0OOAts_X9fnF9z-z5wLQ/exec", 
    "https://script.google.com/macros/s/AKfycbwjpcQVkdSR_eXf5b9fWusK9JMqKBW9sP3Zz5rds4AxvcILAwICp9k89hMQNZ9rN1L1/exec"
];

async function init() {
    try {
        const [h, home, f] = await Promise.all(APIs.map(url => fetch(url).then(r => r.json())));
        document.getElementById('loader').style.display = 'none';

        // Header
        h.menu.forEach(m => document.getElementById('menu').innerHTML += `<a href="${m.link}">${m.text}</a>`);

        // Banner
        const bRoot = document.getElementById('banner-root');
        let banners = home.filter(i => i.TYPE === "BANNER");
        banners.forEach(item => { bRoot.innerHTML += `<div class="slide"><img src="${item.IMAGE_URL}"></div>`; });
        if(banners.length > 0) bRoot.innerHTML += `<div class="slide"><img src="${banners[0].IMAGE_URL}"></div>`;

        // Categories & Products
        home.forEach(item => {
            if(item.TYPE === "CAT") {
                document.getElementById('cat-root').innerHTML += `<div class="cat-item" onclick="location.href='${item.LINK}'"><div class="cat-circle"><img src="${item.IMAGE_URL}"></div><p>${item.TITLE}</p></div>`;
            } else if(item.TYPE === "PRODUCT") {
                document.getElementById('prod-root').innerHTML += `<div class="p-card"><img src="${item.IMAGE_URL}"><h4>${item.TITLE}</h4><div class="p-price">₹${item.PRICE}</div><a href="${item.LINK}" class="btn">View Offer</a></div>`;
            }
        });

        // Infinite Slider
        let cur = 0; let bLen = banners.length;
        if(bLen > 0) {
            setInterval(() => {
                cur++;
                bRoot.style.transition = "transform 0.8s ease-in-out";
                bRoot.style.transform = `translateX(-${cur * 100}%)`;
                if(cur === bLen) {
                    setTimeout(() => { bRoot.style.transition = "none"; cur = 0; bRoot.style.transform = `translateX(0)`; }, 800);
                }
            }, 5000);
        }

        // Advanced Footer Logic (Merged from Kurti Page)
        if(f.footer) {
            f.footer.forEach(i => {
                let box = i.POSITION === "LEFT" ? document.getElementById("f-left") : 
                          i.POSITION === "CENTER" ? document.getElementById("f-center") : 
                          i.POSITION === "RIGHT" ? document.getElementById("f-right") : 
                          i.POSITION === "BOTTOM" ? document.getElementById("sw-bottom") : 
                          document.getElementById("sw-marquee");

                if(i.TYPE === "MARQUEE") box.innerHTML = `<span>${i.TEXT}</span>`;
                else if(i.TYPE === "TITLE") box.innerHTML += `<h3 style="color:var(--amz-orange);margin-bottom:15px; font-size:18px;">${i.TEXT}</h3>`;
                else if(i.TYPE === "TEXT") box.innerHTML += `<p style="font-size:14px;margin-bottom:8px; opacity:0.8;">${i.TEXT}</p>`;
                else if(i.TYPE === "LINK") box.innerHTML += `<div class="sw-links"><a href="${i.LINK}">${i.TEXT}</a></div>`;
                else if(i.TYPE === "SOCIAL") {
                    let sc = box.querySelector('.sw-social') || box.insertAdjacentElement('beforeend', Object.assign(document.createElement('div'), {className:'sw-social'}));
                    sc.innerHTML += `<a href="${i.LINK}">${i.TEXT}</a>`;
                }
                else if(i.TYPE === "BOTTOM") box.innerText = i.TEXT;
            });
        }

    } catch (e) { console.error(e); }
}
init();
</script>
</body>
</html>
