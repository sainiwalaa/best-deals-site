<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sainiwalaa - Premium Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --amz-blue: #131921; --amz-orange: #ff9900; --bg: #eaeded; }
        body { font-family: 'Poppins', sans-serif; margin: 0; background: var(--bg); color: #333; overflow-x: hidden; }

        /* HEADER */
        header { background: var(--amz-blue); padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        #menu a { color: white; text-decoration: none; margin-left: 12px; font-size: 13px; font-weight: 600; }

        /* BANNER FRAME (Amazon Style) */
        .banner-frame { 
            width: 94%; height: 230px; margin: 12px auto; 
            border: 3px solid white; border-radius: 12px; 
            overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            background: #fff; position: relative;
        }
        #banner-root { display: flex; height: 100%; transition: transform 0.8s cubic-bezier(0.45, 0, 0.55, 1); }
        .slide { min-width: 100%; height: 100%; flex-shrink: 0; }
        .slide img { width: 100%; height: 100%; object-fit: cover; }

        /* CATEGORY SECTION */
        .cat-row { display: flex; overflow-x: auto; padding: 10px; gap: 15px; scrollbar-width: none; background: transparent; }
        .cat-row::-webkit-scrollbar { display: none; }
        .cat-item { text-align: center; min-width: 75px; }
        .cat-circle { width: 68px; height: 68px; border-radius: 50%; border: 2.5px solid var(--amz-orange); padding: 2px; background: #fff; margin: 0 auto; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .cat-circle img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .cat-item p { font-size: 11px; font-weight: 600; margin-top: 6px; }

        /* PRODUCT GRID */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; }
        .p-card { background: white; border-radius: 8px; padding: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .p-card img { width: 100%; height: 130px; object-fit: contain; }
        .p-price { color: #B12704; font-size: 19px; font-weight: 700; margin: 8px 0; }
        .btn { background: #ffd814; border: 1px solid #fcd200; border-radius: 6px; padding: 9px; display: block; text-align: center; text-decoration: none; color: #111; font-size: 12px; font-weight: 600; }

        /* FOOTER FIX (Professional Style) */
        footer { background: #232f3e; color: white; padding: 40px 20px; text-align: center; margin-top: 25px; border-top: 4px solid var(--amz-orange); }
        #f-data h3 { color: #febd69; font-size: 18px; margin-bottom: 20px; }
        .f-link { color: #fff; text-decoration: none; display: block; margin: 12px 0; font-size: 14px; opacity: 0.8; }
        #f-bottom { margin-top: 25px; font-size: 11px; opacity: 0.5; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px; }

        #loader { position: fixed; inset: 0; background: white; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--amz-orange); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loader"><div class="spinner"></div><p>Sainiwalaa Loading...</p></div>

<header>
    <div style="font-size: 22px; font-weight: bold; color: #febd69; letter-spacing: 1px;">SAINIWALAA</div>
    <div id="menu"></div>
</header>

<div class="banner-frame">
    <div id="banner-root"></div>
</div>

<div class="cat-row" id="cat-root"></div>

<div style="padding: 15px 15px 0; font-weight: bold; font-size: 18px; color: #444;">Today's Hot Deals 🔥</div>
<div class="grid" id="prod-root"></div>

<footer id="sw-footer">
    <div id="f-data"></div>
    <div id="f-bottom"></div>
</footer>

<script>
const APIs = [
    "https://script.google.com/macros/s/AKfycbxajNF_583kuHsHZuky-oolW6vumnUtdy6t3OU_Rj94C5aYe8RDxO-qPhHR-0hixzjxuA/exec", 
    "https://script.google.com/macros/s/AKfycbwxPgyRuXZPAUgnLBC0vkNx-bCgbOUS2hkrPbQfadwk6pFabK0OOAts_X9fnF9z-z5wLQ/exec", 
    "https://script.google.com/macros/s/AKfycbwjpcQVkdSR_eXf5b9fWusK9JMqKBW9sP3Zz5rds4AxvcILAwICp9k89hMQNZ9rN1L1/exec"
];

async function init() {
    try {
        const [h, home, f] = await Promise.all(APIs.map(url => fetch(url).then(r => r.json())));
        document.getElementById('loader').style.display = 'none';

        // Header
        h.menu.forEach(m => document.getElementById('menu').innerHTML += `<a href="${m.link}">${m.text}</a>`);

        // Banner Data & Infinite Setup
        const bRoot = document.getElementById('banner-root');
        let banners = home.filter(i => i.TYPE === "BANNER");
        
        // Loop ke liye pehli image ko clone karke aakhri mein lagana
        banners.forEach(item => {
            bRoot.innerHTML += `<div class="slide"><img src="${item.IMAGE_URL}"></div>`;
        });
        if(banners.length > 0) {
            bRoot.innerHTML += `<div class="slide"><img src="${banners[0].IMAGE_URL}"></div>`;
        }

        // Categories & Products
        home.forEach(item => {
            if(item.TYPE === "CAT") {
                document.getElementById('cat-root').innerHTML += `<div class="cat-item" onclick="location.href='${item.LINK}'"><div class="cat-circle"><img src="${item.IMAGE_URL}"></div><p>${item.TITLE}</p></div>`;
            } else if(item.TYPE === "PRODUCT") {
                document.getElementById('prod-root').innerHTML += `<div class="p-card"><img src="${item.IMAGE_URL}"><h4>${item.TITLE}</h4><div class="p-price">₹${item.PRICE}</div><a href="${item.LINK}" class="btn">View Deal</a></div>`;
            }
        });

        // Infinite Slider Logic
        let cur = 0;
        let totalSlides = banners.length;
        if(totalSlides > 0) {
            setInterval(() => {
                cur++;
                bRoot.style.transition = "transform 0.8s ease-in-out";
                bRoot.style.transform = `translateX(-${cur * 100}%)`;

                if(cur === totalSlides) {
                    setTimeout(() => {
                        bRoot.style.transition = "none";
                        cur = 0;
                        bRoot.style.transform = `translateX(0)`;
                    }, 800);
                }
            }, 5000);
        }

        // Footer Fix
        f.footer.forEach(i => {
            if(i.TYPE === "TITLE") document.getElementById("f-data").innerHTML += `<h3>${i.TEXT}</h3>`;
            else if(i.TYPE === "LINK") document.getElementById("f-data").innerHTML += `<a href="${i.LINK}" class="f-link">${i.TEXT}</a>`;
            else if(i.TYPE === "BOTTOM") document.getElementById("f-bottom").innerText = i.TEXT;
        });

    } catch (e) { console.error("Data Error", e); }
}
init();
</script>
</body>
</html>
