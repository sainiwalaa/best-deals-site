<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sainiwalaa | Official Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #000000; --accent: #febd69; --bg: #f4f4f4; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); overflow-x: hidden; }

        /* --- HEADER --- */
        header { background: #000; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 24px; font-weight: 900; color: #fff; }
        #nav-root { display: flex; gap: 15px; }
        #nav-root a { color: #fff; text-decoration: none; font-size: 13px; font-weight: 700; }

        /* --- TOP HERO SLIDER (From SLIDE Rows) --- */
        #hero-section { width: 100%; height: 450px; position: relative; overflow: hidden; background: #131921; }
        .h-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1s ease-in-out; }
        .h-slide.active { opacity: 1; }
        .h-slide img { width: 100%; height: 100%; object-fit: cover; }
        .hero-overlay { position: absolute; bottom: 30px; left: 5%; z-index: 10; background: rgba(0,0,0,0.7); padding: 20px; border-radius: 8px; color: #fff; border-left: 4px solid var(--accent); }

        /* --- HOME BANNER SLIDER (From BANNER Rows) --- */
        .home-banner-wrap { width: 90%; margin: 30px auto; height: 250px; position: relative; overflow: hidden; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .b-slide { position: absolute; inset: 0; opacity: 0; transition: 0.8s; }
        .b-slide.active { opacity: 1; }
        .b-slide img { width: 100%; height: 100%; object-fit: cover; }

        /* --- CATEGORIES & PRODUCTS --- */
        .section-title { padding: 20px 5% 0; font-size: 22px; font-weight: 800; }
        .cat-row { display: flex; overflow-x: auto; gap: 20px; padding: 20px 5%; scrollbar-width: none; }
        .cat-card { min-width: 90px; text-align: center; cursor: pointer; }
        .cat-card img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        .prod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 20px 5%; }
        .p-card { background: #fff; border-radius: 12px; padding: 15px; border: 1px solid #ddd; text-align: center; }
        .p-card img { width: 100%; height: 180px; object-fit: contain; }
        .price { font-size: 20px; font-weight: 800; color: #B12704; margin: 10px 0; }
        .buy-btn { display: block; background: var(--accent); color: #000; text-align: center; padding: 10px; border-radius: 6px; text-decoration: none; font-weight: 700; }

        /* --- FOOTER CSS --- */
        #sw-footer{ width:100%; background:linear-gradient(180deg,#050b1a,#0b1730); padding:50px 20px 25px; color:#ffffff; margin-top:50px; font-family:'Poppins'; }
        #sw-marquee{ overflow:hidden; white-space:nowrap; text-align:center; border-bottom:1px solid rgba(255,255,255,.1); padding-bottom:12px; margin-bottom:30px;}
        #sw-marquee span{ display:inline-block; animation:sw-scroll 28s linear infinite; }
        @keyframes sw-scroll{ from{transform:translateX(100%)} to{transform:translateX(-100%)} }
        #sw-inner{ max-width:1200px; margin:auto; display:grid; grid-template-columns:1fr 1fr 1fr; gap:40px; }
        .sw-col h2{ font-size:32px; margin-bottom:10px; }
        .sw-links a{ display:block; margin:6px 0; color:#fff; text-decoration:none; font-weight:600; }
        .sw-btn{ display:inline-block; margin-top:12px; padding:12px 26px; background:linear-gradient(90deg,#ff9800,#ff5722); color:#000 !important; border-radius:30px; text-decoration:none; font-weight:700; }
        #sw-bottom{ text-align:center; margin-top:30px; opacity:.7; border-top:1px solid rgba(255,255,255,.1); padding-top:14px; }

        @media (max-width: 768px) {
            #hero-section { height: 300px; }
            .home-banner-wrap { height: 150px; width: 95%; }
            .prod-grid { grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
            #sw-inner { grid-template-columns: 1fr; text-align: center; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">SAINIWALAA</div>
    <div id="nav-root"></div>
</header>

<section id="hero-section">
    <div id="hero-slides-root"></div>
    <div class="hero-overlay">
        <h1 id="hero-title">Sainiwalaa Style</h1>
        <p id="hero-notice"></p>
        <div id="hero-tags" style="display:flex; gap:10px; margin-top:10px;"></div>
    </div>
</section>

<div class="home-banner-wrap" id="home-banner-root"></div>

<div class="section-title">Shop Categories</div>
<div class="cat-row" id="cat-root"></div>

<div class="section-title">Trending Now 🔥</div>
<div class="prod-grid" id="prod-root"></div>

<div id="sw-footer">
    <div id="sw-marquee"></div>
    <div id="sw-inner"><div id="sw-left"></div><div id="sw-center"></div><div id="sw-right"></div></div>
    <div id="sw-bottom"></div>
</div>

<script>
const APIs = {
    hero: "https://script.google.com/macros/s/AKfycbxajNF_583kuHsHZuky-oolW6vumnUtdy6t3OU_Rj94C5aYe8RDxO-qPhHR-0hixzjxuA/exec",
    home: "https://script.google.com/macros/s/AKfycbwxPgyRuXZPAUgnLBC0vkNx-bCgbOUS2hkrPbQfadwk6pFabK0OOAts_X9fnF9z-z5wLQ/exec",
    footer: "https://script.google.com/macros/s/AKfycbwjpcQVkdSR_eXf5b9fWusK9JMqKBW9sP3Zz5rds4AxvcILAwICp9k89hMQNZ9rN1L1/exec"
};

async function init() {
    try {
        const [hData, sData, fData] = await Promise.all([
            fetch(APIs.hero).then(r => r.json()),
            fetch(APIs.home).then(r => r.json()),
            fetch(APIs.footer).then(r => r.json())
        ]);

        // 1. Header Navigation
        hData.menu.forEach(m => {
            if(m.SHOW === "YES") document.getElementById('nav-root').innerHTML += `<a href="${m.LINK}">${m.TEXT}</a>`;
        });

        // 2. Hero Section (TYPE: SLIDE)
        let hSlides = [];
        hData.hero.forEach(i => {
            if(i.SHOW === "YES") {
                if(i.TYPE === "TITLE") document.getElementById('hero-title').innerText = i.TEXT;
                if(i.TYPE === "NOTICE") document.getElementById('hero-notice').innerText = i.TEXT;
                if(i.TYPE === "TAG") document.getElementById('hero-tags').innerHTML += `<span style="background:var(--accent); color:#000; padding:4px 8px; border-radius:4px; font-size:11px; font-weight:800;">${i.TEXT}</span>`;
                if(i.TYPE === "SLIDE") hSlides.push(i.IMAGE);
            }
        });
        renderSlider("hero-slides-root", hSlides, "h-slide");

        // 3. Home Banner Slider (TYPE: BANNER)
        let bSlides = [];
        sData.forEach(item => {
            if(item.STATUS === "YES" && item.TYPE === "BANNER") bSlides.push(item.IMAGE_URL);
            if(item.STATUS === "YES" && item.TYPE === "CAT") {
                document.getElementById('cat-root').innerHTML += `<div class="cat-card" onclick="location.href='${item.LINK}'"><img src="${item.IMAGE_URL}"><p style="font-size:11px; font-weight:700;">${item.TITLE}</p></div>`;
            }
            if(item.STATUS === "YES" && item.TYPE === "PRODUCT") {
                document.getElementById('prod-root').innerHTML += `<div class="p-card"><img src="${item.IMAGE_URL}"><h4>${item.TITLE}</h4><div class="price">₹${item.PRICE}</div><a href="${item.LINK}" class="buy-btn">Buy Now</a></div>`;
            }
        });
        renderSlider("home-banner-root", bSlides, "b-slide");

        // 4. Footer Logic
        fData.footer.forEach(i => {
            let box = i.POSITION === "LEFT" ? document.getElementById("sw-left") : i.POSITION === "CENTER" ? document.getElementById("sw-center") : i.POSITION === "RIGHT" ? document.getElementById("sw-right") : i.POSITION === "BOTTOM" ? document.getElementById("sw-bottom") : document.getElementById("sw-marquee");
            if(i.TYPE === "MARQUEE") box.innerHTML = `<span style="color:${i.COLOR}">${i.TEXT}</span>`;
            if(i.TYPE === "TITLE") box.innerHTML += `<h2 style="color:${i.COLOR}">${i.TEXT}</h2>`;
            if(i.TYPE === "TEXT") box.innerHTML += `<p style="color:${i.COLOR}">${i.TEXT}</p>`;
            if(i.TYPE === "LINK") box.innerHTML += `<div class="sw-links"><a href="${i.LINK}" style="color:${i.COLOR}">${i.TEXT}</a></div>`;
            if(i.TYPE === "BUTTON") box.innerHTML += `<a class="sw-btn" href="${i.LINK}">${i.TEXT}</a>`;
            if(i.TYPE === "BOTTOM") box.innerText = i.TEXT;
        });

    } catch (e) { console.error(e); }
}

function renderSlider(id, images, className) {
    const root = document.getElementById(id);
    images.forEach((url, i) => {
        const div = document.createElement('div');
        div.className = `${className} ${i === 0 ? 'active' : ''}`;
        div.innerHTML = `<img src="${url}">`;
        root.appendChild(div);
    });
    if(images.length > 1) {
        let cur = 0;
        setInterval(() => {
            const ss = root.querySelectorAll(`.${className}`);
            ss[cur].classList.remove('active');
            cur = (cur + 1) % ss.length;
            ss[cur].classList.add('active');
        }, 3500);
    }
}
init();
</script>
</body>
</html>
