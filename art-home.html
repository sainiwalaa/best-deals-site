<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">

    <title>Sainiwalaa - Artistic Edition</title>

    <style>
        :root { --amz-blue: #131921; --amz-orange: #ff9900; --accent: #6366f1; }
        
        /* ARTISTIC ANIMATED BACKGROUND */
        body { 
            margin: 0; font-family: 'Poppins', sans-serif;
            background: #f0f2f5;
            position: relative; overflow-x: hidden;
        }

        /* Animated Blobs in Background */
        body::before, body::after {
            content: ""; position: fixed; width: 400px; height: 400px;
            border-radius: 50%; background: linear-gradient(45deg, #ff990033, #6366f133);
            filter: blur(80px); z-index: -1; animation: move 20s infinite alternate;
        }
        body::after { top: 40%; left: 60%; background: linear-gradient(-45deg, #ff990022, #00d4ff22); animation-delay: -5s; }
        @keyframes move { 
            from { transform: translate(-10%, -10%) rotate(0deg); } 
            to { transform: translate(20%, 20%) rotate(360deg); } 
        }

        /* HEADER */
        header { background: rgba(19, 25, 33, 0.95); backdrop-filter: blur(10px); padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        #menu a { color: white; text-decoration: none; margin-left: 12px; font-size: 13px; font-weight: 600; }

        /* HERO SECTION WITH ARTISTIC FRAME */
        .hero-section { padding: 20px 0; perspective: 1000px; }
        .banner-frame { 
            width: 92%; height: 230px; margin: 0 auto; 
            border: 2px solid rgba(255,255,255,0.8); border-radius: 20px; 
            overflow: hidden; background: #000; position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2), 0 0 20px rgba(255,153,0,0.2);
            transform: rotateX(2deg); transition: 0.5s;
        }
        #banner-root { display: flex; height: 100%; transition: transform 0.8s cubic-bezier(0.65, 0, 0.35, 1); }
        .slide { min-width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .slide img { width: 100%; height: 100%; object-fit: contain; }

        /* CATEGORIES - Floating Style */
        .cat-row { display: flex; overflow-x: auto; padding: 20px 10px; gap: 15px; scrollbar-width: none; }
        .cat-item { text-align: center; min-width: 80px; transition: 0.3s; }
        .cat-item:hover { transform: translateY(-5px); }
        .cat-circle { width: 70px; height: 70px; border-radius: 22px; background: #fff; padding: 3px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); border: 2px solid #fff; }
        .cat-circle img { width: 100%; height: 100%; border-radius: 18px; object-fit: cover; }
        .cat-item p { font-size: 11px; font-weight: 700; margin-top: 10px; color: var(--amz-blue); }

        /* PRODUCT GRID - Glass Design */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; }
        .p-card { 
            background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); 
            border: 1px solid rgba(255,255,255,0.5); border-radius: 18px; 
            padding: 15px; text-align: center; transition: 0.3s;
        }
        .p-card img { width: 100%; height: 140px; object-fit: contain; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1)); }
        .p-price { color: #B12704; font-size: 20px; font-weight: 800; margin: 12px 0; }
        .btn { 
            background: linear-gradient(135deg, #ff9900, #ffb84d); color: #fff; 
            border: none; border-radius: 10px; padding: 12px; display: block; 
            text-decoration: none; font-size: 13px; font-weight: 700;
            box-shadow: 0 5px 15px rgba(255,153,0,0.3);
        }
