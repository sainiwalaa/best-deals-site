<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sainiwalaa - Artistic Testing</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --amz-blue: #131921; --amz-orange: #ff9900; }
        
        /* 1. ARTISTIC ANIMATED BACKGROUND */
        body { 
            margin: 0; font-family: 'Poppins', sans-serif; 
            background: #f0f2f5; overflow-x: hidden; position: relative;
        }

        /* Moving Artistic Shapes */
        .art-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; filter: blur(70px); opacity: 0.6;
        }
        .blob {
            position: absolute; border-radius: 50%;
            animation: moveArt 25s infinite alternate ease-in-out;
        }
        .blob-1 { width: 450px; height: 450px; background: rgba(255, 153, 0, 0.2); top: -5%; left: -5%; }
        .blob-2 { width: 550px; height: 550px; background: rgba(99, 102, 241, 0.15); bottom: -10%; right: -5%; animation-delay: -5s; }
        .blob-3 { width: 350px; height: 350px; background: rgba(244, 63, 94, 0.1); top: 30%; left: 20%; animation-delay: -10s; }

        @keyframes moveArt {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            100% { transform: translate(120px, 80px) scale(1.15) rotate(45deg); }
        }

        /* 2. HEADER */
        header { 
            background: rgba(19, 25, 33, 0.9); backdrop-filter: blur(12px); 
            padding: 15px 20px; display: flex; justify-content: space-between; 
            align-items: center; position: sticky; top: 0; z-index: 1000;
        }
        header .logo { font-size: 20px; font-weight: 800; color: #febd69; letter-spacing: 1.5px; }

        /* 3. HERO SECTION (Sainiwalaa + Slider) */
        .hero-title {
            text-align: center; font-size: 36px; font-weight: 800; margin: 30px 0 10px;
            background: linear-gradient(90deg, #131921, #ff9900, #131921);
            background-size: 200% auto; animation: textShine 4s linear infinite;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        @keyframes textShine { to { background-position: 200% center; } }

        .banner-frame { 
            width: 90%; height: 230px; margin: 0 auto 20px; 
            border: 4px solid #fff; border-radius: 25px; 
            overflow: hidden; background: #000; position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15), 0 0 25px rgba(255,153,0,0.2);
        }
        #slider-root { display: flex; height: 100%; transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        .slide { min-width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .slide img { width: 100%; height: 100%; object-fit: contain; }

        /* 4. CONTENT GRID (Glass Look) */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; }
        .p-card { 
            background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(10px); 
            border-radius: 20px; padding: 15px; border: 1px solid rgba(255,255,255,0.8);
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.04);
        }
        .p-card img { width: 100%; height: 130px; object-fit: contain; }
        .btn { 
            background: var(--amz-orange); color: #fff; text-decoration: none; 
            padding: 10px; border-radius: 12px; display: block; font-weight: 700; margin-top: 10px;
        }

        #loader { position: fixed; inset: 0; background: #fff; z-index: 10000; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>

<div id="loader">🎨 PREPARING ARTISTIC VIEW...</div>

<div class="art-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
</div>

<header>
    <div class="logo" onclick="location.href='index.html'">SAINIWALAA</div>
</header>

<div class="hero-title">SAINIWALAA</div>

<div class="banner-frame">
    <div id="slider-root"></div>
</div>

<div style="padding: 10px 20px; font-weight: 800; font-size: 22px;">Handpicked Deals 🔥</div>
<div class="grid" id="prod-root"></div>

<script>
const APIs = {
    head: "https://script.google.com/macros/s/AKfycbxajNF_583kuHsHZuky-oolW6vumnUtdy6t3OU_Rj94C5aYe8RDxO-qPhHR-0hixzjxuA/exec",
    home: "https://script.google.com/macros/s/AKfycbwxPgyRuXZPAUgnLBC0vkNx-bCgbOUS2hkrPbQfadwk6pFabK0OOAts_X9fnF9z-z5wLQ/exec"
};

async function loadTestPage() {
    try {
        const [hData, pData] = await Promise.all([
            fetch(APIs.head).then(r => r.json()),
            fetch(APIs.home).then(r => r.json())
        ]);
        
        document.getElementById('loader').style.display = 'none';

        // Slider Sync
        const sRoot = document.getElementById('slider-root');
        let banners = pData.filter(i => i.TYPE === "BANNER");
        banners.forEach(b => {
            sRoot.innerHTML += `<div class="slide"><img src="${b.IMAGE_URL}"></div>`;
        });
        
        // Products Sync
        pData.filter(i => i.TYPE === "PRODUCT").forEach(p => {
            document.getElementById('prod-root').innerHTML += `
                <div class="p-card">
                    <img src="${p.IMAGE_URL}">
                    <div style="font-weight:600; font-size:13px; margin:8px 0;">${p.TITLE}</div>
                    <div style="color:#B12704; font-weight:800;">₹${p.PRICE}</div>
                    <a href="${p.LINK}" class="btn">View Deal</a>
                </div>`;
        });

        // Simple Slider Logic
        let idx = 0;
        setInterval(() => {
            idx = (idx + 1) % banners.length;
            sRoot.style.transform = `translateX(-${idx * 100}%)`;
        }, 4000);

    } catch (err) { console.log("Error loading art page", err); }
}
loadTestPage();
</script>
</body>
</html>
