<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sainiwalaa | Official Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #000000; --accent: #febd69; --bg: #f3f3f3; --card: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: #333; overflow-x: hidden; }

        /* --- TICKER --- */
        .ticker-wrap { background: #131921; color: var(--accent); padding: 10px 0; overflow: hidden; white-space: nowrap; font-size: 13px; font-weight: 700; }
        .ticker { display: inline-block; animation: ticker 30s linear infinite; }
        .ticker span { margin-right: 50px; }
        @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        /* --- HEADER (BLACK & WHITE) --- */
        header { background: var(--primary); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 15px rgba(0,0,0,0.3); }
        .logo { font-size: 24px; font-weight: 900; color: #fff; letter-spacing: 1px; }
        #nav-root a { color: #fff; margin-left: 20px; text-decoration: none; font-size: 14px; font-weight: 700; transition: 0.3s; }
        #nav-root a:hover { color: var(--accent); }

        /* --- HERO SLIDER (FIXED) --- */
        #hero-section {
            padding: 40px 5%; background: linear-gradient(135deg, #232f3e 0%, #131921 100%);
            display: flex; align-items: center; justify-content: space-between; gap: 30px;
            min-height: 450px; color: #fff;
        }
        .hero-info { flex: 1; }
        .hero-info h1 { font-size: 45px; margin-bottom: 15px; color: var(--accent); }
        .hero-info p { font-size: 18px; opacity: 0.8; margin-bottom: 25px; }
        
        .tag-cloud { display: flex; flex-wrap: wrap; gap: 10px; }
        .tag-cloud span { background: rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 5px; font-size: 12px; border: 1px solid rgba(255,255,255,0.2); }

        .hero-visual { flex: 1; display: flex; justify-content: center; position: relative; height: 380px; }
        .slider-frame { 
            width: 300px; height: 380px; border-radius: 15px; border: 5px solid #fff; 
            overflow: hidden; position: relative; background: #1a222d; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .slider-frame img { 
            width: 100%; height: 100%; object-fit: cover; position: absolute; 
            top: 0; left: 0; opacity: 0; transition: opacity 1s ease-in-out; 
        }
        .slider-frame img.active { opacity: 1; }

        /* --- CATEGORIES & PRODUCTS --- */
        .section-title { padding: 30px 5% 10px; font-size: 22px; font-weight: 800; display: flex; align-items: center; justify-content: space-between; }
        .cat-scroll { display: flex; overflow-x: auto; padding: 20px 5%; gap: 20px; scrollbar-width: none; }
        .cat-box { min-width: 100px; text-align: center; cursor: pointer; }
        .cat-box .img-w { width: 80px; height: 80px; border-radius: 50%; background: #fff; margin: 0 auto 10px; padding: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .cat-box img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; padding: 20px 5%; }
        .p-card { background: #fff; border-radius: 12px; padding: 20px; transition: 0.3s; border: 1px solid #eee; }
        .p-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .p-card img { width: 100%; height: 200px; object-fit: contain; margin-bottom: 15px; }
        .price { font-size: 20px; font-weight: 800; color: #B12704; }
        .buy-now { margin-top: 15px; display: block; background: var(--accent); color: #111; text-align: center; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: 700; }

        footer { background: #131921; color: #fff; padding: 50px 5%; margin-top: 50px; }
        @media (max-width: 768px) {
            #hero-section { flex-direction: column; text-align: center; }
            .slider-frame { width: 260px; height: 340px; }
            .product-grid { grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        }
    </style>
</head>
<body>

<div class="ticker-wrap">
    <div class="ticker" id="ticker-js">
        <span>🔥 NEW ARRIVALS LIVE</span><span>✨ JAIPUR SPECIAL KURTIS</span><span>🚀 FREE SHIPPING ON ORDERS ABOVE ₹999</span>
    </div>
</div>

<header>
    <div class="logo">SAINIWALAA</div>
    <nav id="nav-root"></nav>
</header>

<section id="hero-section">
    <div class="hero-info">
        <h1 id="hero-t">Loading...</h1>
        <p id="hero-n">Fetching latest collection...</p>
        <div class="tag-cloud" id="hero-tg"></div>
    </div>
    <div class="hero-visual">
        <div class="slider-frame" id="hero-slider">
            </div>
    </div>
</section>

<div class="section-title">Shop Categories</div>
<div class="cat-scroll" id="cat-root"></div>

<div class="section-title">Trending Now 🔥</div>
<div class="product-grid" id="prod-root"></div>

<footer id="sw-footer">
    <div id="f-marquee" style="margin-bottom: 30px; color: var(--accent); text-align: center;"></div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 40px;" id="f-inner">
        <div id="f-c1"></div><div id="f-c2"></div><div id="f-c3"></div>
    </div>
    <div id="f-bot" style="text-align: center; margin-top: 40px; opacity: 0.4; font-size: 12px;"></div>
</footer>

<script>
const HERO_API = "https://script.google.com/macros/s/AKfycbxajNF_583kuHsHZuky-oolW6vumnUtdy6t3OU_Rj94C5aYe8RDxO-qPhHR-0hixzjxuA/exec";
const SHOP_API = "https://script.google.com/macros/s/AKfycbwxPgyRuXZPAUgnLBC0vkNx-bCgbOUS2hkrPbQfadwk6pFabK0OOAts_X9fnF9z-z5wLQ/exec";
const FOOTER_API = "https://script.google.com/macros/s/AKfycbwjpcQVkdSR_eXf5b9fWusK9JMqKBW9sP3Zz5rds4AxvcILAwICp9k89hMQNZ9rN1L1/exec";

async function init() {
    try {
        const [hData, sData, fData] = await Promise.all([
            fetch(HERO_API).then(r => r.json()),
            fetch(SHOP_API).then(r => r.json()),
            fetch(FOOTER_API).then(r => r.json())
        ]);

        // 1. Header Navigation
        hData.menu.forEach(m => {
            document.getElementById('nav-root').innerHTML += `<a href="${m.link}">${m.text}</a>`;
        });

        // 2. Hero Section & Slider
        let slideImages = [];
        hData.hero.forEach(item => {
            if(item.type === "TITLE") document.getElementById('hero-t').innerText = item.text;
            if(item.type === "NOTICE") document.getElementById('hero-n').innerText = item.text;
            if(item.type === "TAG") document.getElementById('hero-tg').innerHTML += `<span>${item.text}</span>`;
            if(item.type === "SLIDE") slideImages.push(item.image);
        });

        const sliderContainer = document.getElementById('hero-slider');
        slideImages.forEach((imgUrl, index) => {
            const img = document.createElement('img');
            img.src = imgUrl;
            if(index === 0) img.classList.add('active');
            sliderContainer.appendChild(img);
        });

        let currentSlide = 0;
        const allSlides = sliderContainer.getElementsByTagName('img');
        if(allSlides.length > 1) {
            setInterval(() => {
                allSlides[currentSlide].classList.remove('active');
                currentSlide = (currentSlide + 1) % allSlides.length;
                allSlides[currentSlide].classList.add('active');
            }, 4000);
        }

        // 3. Categories & Products
        sData.forEach(item => {
            if(item.TYPE === "CAT") {
                document.getElementById('cat-root').innerHTML += `
                    <div class="cat-box" onclick="location.href='${item.LINK}'">
                        <div class="img-w"><img src="${item.IMAGE_URL}"></div>
                        <p style="font-size:12px; font-weight:700;">${item.TITLE}</p>
                    </div>`;
            } else if(item.TYPE === "PRODUCT") {
                document.getElementById('prod-root').innerHTML += `
                    <div class="p-card">
                        <img src="${item.IMAGE_URL}">
                        <h4 style="font-size:15px; margin-bottom:10px;">${item.TITLE}</h4>
                        <div class="price">₹${item.PRICE}</div>
                        <a href="${item.LINK}" class="buy-now">View Detail</a>
                    </div>`;
            }
        });

        // 4. Footer Sync
        if(fData.footer) {
            fData.footer.forEach(i => {
                let box = i.POSITION === "LEFT" ? document.getElementById("f-c1") : 
                          i.POSITION === "CENTER" ? document.getElementById("f-c2") : 
                          i.POSITION === "RIGHT" ? document.getElementById("f-c3") : 
                          i.POSITION === "BOTTOM" ? document.getElementById("f-bot") : 
                          document.getElementById("f-marquee");
                
                if(i.TYPE === "MARQUEE") box.innerHTML = `<marquee style="font-weight:700;">${i.TEXT}</marquee>`;
                else if(i.TYPE === "TITLE") box.innerHTML += `<h3 style="margin-bottom:15px; color:var(--accent); font-size:18px;">${i.TEXT}</h3>`;
                else if(i.TYPE === "LINK") box.innerHTML += `<a href="${i.LINK}" style="color:#ccc; text-decoration:none; display:block; margin-bottom:10px; font-size:14px;">${i.TEXT}</a>`;
                else if(i.TYPE === "BOTTOM") box.innerText = i.TEXT;
            });
        }

    } catch (error) {
        console.error("Sheet Sync Error:", error);
    }
}

init();
</script>
</body>
</html>
