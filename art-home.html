<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sainiwalaa - Artistic Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <style>
        :root { --amz-blue: #131921; --amz-orange: #ff9900; --bg: #fdfdfd; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); overflow-x: hidden; }

        header { background: var(--amz-blue); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        #menu a { color: white; text-decoration: none; margin-left: 15px; font-size: 13px; font-weight: 600; }

        /* --- ARTISTIC HERO SECTION --- */
        #hero-sainiwalaa {
            position: relative; padding: 60px 20px;
            background: #4b0f14; /* Maroon Base */
            overflow: hidden; color: #fff; min-height: 500px;
            display: flex; align-items: center; justify-content: center;
        }

        /* ARTISTIC WHEEL DESIGN */
        .art-wheel-container {
            position: absolute; width: 580px; height: 580px;
            right: -80px; top: 50%; transform: translateY(-50%);
            z-index: 1; pointer-events: none;
        }

        /* Drawing the "Paint Style" Ring */
        .paint-ring {
            position: absolute; inset: 0;
            border: 4px solid rgba(255, 153, 0, 0.4);
            border-radius: 48% 52% 50% 50% / 50% 48% 52% 50%; /* Irregular shape for hand-drawn look */
            box-shadow: 0 0 20px rgba(255,153,0,0.1);
            animation: rotateArt 40s linear infinite;
        }

        /* Circular Floating Text */
        .art-text-svg {
            position: absolute; inset: -40px;
            width: calc(100% + 80px); height: calc(100% + 80px);
            animation: rotateArt 50s linear infinite reverse;
        }

        .art-text-svg text {
            fill: #f6d27c; font-family: 'Playfair Display', serif; 
            font-size: 16px; font-style: italic; font-weight: 700;
            letter-spacing: 5px; opacity: 0.9;
        }

        @keyframes rotateArt { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* --- CONTENT WRAP --- */
        .hero-wrap { 
            position: relative; z-index: 10; max-width: 1200px; width: 100%;
            margin: auto; display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 20px; align-items: center; 
        }
        
        .hero-left h1 { font-size: 48px; font-weight: 800; color: #f6d27c; line-height: 1.1; }
        .hero-left p { color: #ffe9b0; margin-top: 12px; font-size: 16px; opacity: 0.8; }
        
        .slider-frame { 
            width: 100%; max-width: 280px; height: 380px; margin: auto; 
            background: rgba(255,255,255,0.05); backdrop-filter: blur(10px);
            padding: 12px; border-radius: 40px 10px 40px 10px; /* Unique Artistic Shape */
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .slider-frame img { width: 100%; height: 100%; object-fit: cover; border-radius: 30px 5px 30px 5px; }

        /* CATEGORY & PRODUCTS */
        .cat-row { display: flex; overflow-x: auto; padding: 30px 15px; gap: 20px; scrollbar-width: none; }
        .cat-circle { width: 85px; height: 85px; border-radius: 50%; border: 1px solid #ddd; padding: 4px; background: #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .cat-circle img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; }
        .p-card { background: white; border-radius: 25px; padding: 15px; text-align: center; border: 1px solid #f0f0f0; box-shadow: 0 10px 25px rgba(0,0,0,0.03); }
        .p-card img { width: 100%; height: 150px; object-fit: contain; }
        .btn { background: var(--amz-blue); color: #fff; text-decoration: none; padding: 12px; border-radius: 15px; display: block; font-weight: 600; font-size: 13px; margin-top: 10px; }

        /* FOOTER */
        footer { background: #0a0e17; color: #fff; padding: 60px 20px; margin-top: 50px; border-radius: 50px 50px 0 0; }

        @media(max-width: 768px) {
            .hero-wrap { grid-template-columns: 1fr; text-align: center; }
            .art-wheel-container { width: 400px; height: 400px; right: -60px; top: 60%; }
            .hero-left h1 { font-size: 34px; }
            .slider-frame { max-width: 220px; height: 300px; }
        }
    </style>
</head>
<body>

<header>
    <div style="font-size: 22px; font-weight: 800; color: #febd69;">SAINIWALAA</div>
    <div id="menu"></div>
</header>

<section id="hero-sainiwalaa">
    <div class="art-wheel-container">
        <div class="paint-ring"></div>
        <svg class="art-text-svg" viewBox="0 0 500 500">
            <path id="artCurve" d="M 250, 250 m -220, 0 a 220,220 0 1,1 440,0 a 220,220 0 1,1 -440,0" fill="none"></path>
            <text>
                <textPath href="#artCurve">
                    WOMEN'S COLLECTION • NEW GADGETS • HOME ESSENTIALS • EXCLUSIVE DEALS • 
                </textPath>
            </text>
        </svg>
    </div>

    <div class="hero-wrap">
        <div class="hero-left">
            <h1 id="heroTitle">Sainiwalaa</h1>
            <p id="heroNotice">Discover Artisanal Deals</p>
            <div id="heroTags" style="margin-top:20px;"></div>
        </div>
        <div class="slider-frame"><img id="heroImg" src=""></div>
    </div>
</section>

<div class="cat-row" id="cat-root"></div>
<div style="padding: 0 20px 20px; font-weight: 700; font-size: 24px; color: #111;">Featured Deals ✨</div>
<div class="grid" id="prod-root"></div>

<footer id="sw-footer">
    <div id="sw-marquee"></div>
    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 30px; text-align: left; max-width: 1100px; margin: auto;">
        <div id="f-left"></div>
        <div id="f-center"></div>
        <div id="f-right"></div>
    </div>
    <div id="sw-bottom" style="text-align:center; margin-top:40px; opacity:0.3; font-size:11px;"></div>
</footer>

<script>
const APIs = [
    "https://script.google.com/macros/s/AKfycbxajNF_583kuHsHZuky-oolW6vumnUtdy6t3OU_Rj94C5aYe8RDxO-qPhHR-0hixzjxuA/exec",
    "https://script.google.com/macros/s/AKfycbwxPgyRuXZPAUgnLBC0vkNx-bCgbOUS2hkrPbQfadwk6pFabK0OOAts_X9fnF9z-z5wLQ/exec",
    "https://script.google.com/macros/s/AKfycbwjpcQVkdSR_eXf5b9fWusK9JMqKBW9sP3Zz5rds4AxvcILAwICp9k89hMQNZ9rN1L1/exec"
];

async function init() {
    try {
        const [h, home, f] = await Promise.all(APIs.map(u => fetch(u).then(r => r.json())));
        h.menu.forEach(m => document.getElementById('menu').innerHTML += `<a href="${m.link}">${m.text}</a>`);
        let s = [];
        h.hero.forEach(i => {
            if(i.type === "TITLE") document.getElementById('heroTitle').innerText = i.text;
            if(i.type === "NOTICE") document.getElementById('heroNotice').innerText = i.text;
            if(i.type === "TAG") document.getElementById('heroTags').innerHTML += `<span style="background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.3); padding:6px 15px; border-radius:30px; margin-right:8px; font-size:11px; color:#f6d27c;">${i.text}</span>`;
            if(i.type === "SLIDE") s.push(i.image);
        });
        if(s.length) {
            let idx = 0; document.getElementById('heroImg').src = s[0];
            setInterval(() => { idx = (idx+1)%s.length; document.getElementById('heroImg').src = s[idx]; }, 3500);
        }
        home.forEach(i => {
            if(i.TYPE === "CAT") document.getElementById('cat-root').innerHTML += `<div onclick="location.href='${i.LINK}'"><div class="cat-circle"><img src="${i.IMAGE_URL}"></div><p style="text-align:center;font-size:11px;font-weight:700;margin-top:8px;">${i.TITLE}</p></div>`;
            else if(i.TYPE === "PRODUCT") document.getElementById('prod-root').innerHTML += `<div class="p-card"><img src="${i.IMAGE_URL}"><h5>${i.TITLE}</h5><div style="color:#B12704; font-weight:800; margin:10px 0;">₹${i.PRICE}</div><a href="${i.LINK}" class="btn">View Deal</a></div>`;
        });
        if(f.footer) {
            f.footer.forEach(i => {
                let box = i.POSITION === "LEFT" ? document.getElementById("f-left") : i.POSITION === "CENTER" ? document.getElementById("f-center") : i.POSITION === "RIGHT" ? document.getElementById("f-right") : i.POSITION === "BOTTOM" ? document.getElementById("sw-bottom") : document.getElementById("sw-marquee");
                if(i.TYPE === "MARQUEE") box.innerHTML = `<div style="color:#ff9900; font-weight:bold; margin-bottom:20px;">${i.TEXT}</div>`;
                else if(i.TYPE === "TITLE") box.innerHTML += `<h4 style="color:#ff9900; margin-bottom:12px;">${i.TEXT}</h4>`;
                else if(i.TYPE === "LINK") box.innerHTML += `<a href="${i.LINK}" style="color:#ccc; text-decoration:none; display:block; font-size:13px; margin-bottom:10px;">${i.TEXT}</a>`;
                else if(i.TYPE === "BOTTOM") box.innerText = i.TEXT;
            });
        }
    } catch (e) { console.log(e); }
}
init();
</script>
</body>
</html>
