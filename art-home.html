<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sainiwalaa | Artistic Gifting</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
    <style>
        :root { --amz-blue: #131921; --gold: #f6d27c; --maroon: #4b0f14; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #fff; overflow-x: hidden; }

        header { background: var(--amz-blue); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 24px; font-weight: 900; color: #ff9900; }

        /* --- HERO SECTION --- */
        #hero-sainiwalaa {
            position: relative; height: 600px;
            background: radial-gradient(circle at center, #5d0f16 0%, #1a0507 100%);
            display: flex; align-items: center; overflow: hidden; color: #fff;
        }

        .hero-container {
            max-width: 1200px; margin: auto; width: 100%; padding: 0 40px;
            display: grid; grid-template-columns: 1fr 1fr; z-index: 10; position: relative;
            align-items: center;
        }

        .hero-text h1 { font-size: 48px; line-height: 1.1; color: var(--gold); margin-bottom: 20px; }
        .hero-text p { font-size: 18px; color: #ffe9b0; opacity: 0.8; }

        /* --- CENTERED WHEEL & IMAGE WRAP --- */
        .display-box {
            position: relative;
            width: 100%; height: 500px;
            display: flex; align-items: center; justify-content: center;
        }

        /* Wheel Exactly Behind Image */
        .back-wheel {
            position: absolute;
            width: 580px; height: 580px;
            z-index: 1;
            display: flex; align-items: center; justify-content: center;
        }

        .rotating-svg {
            width: 100%; height: 100%;
            animation: spin-reverse 25s linear infinite;
        }

        .rotating-svg text { 
            font-family: 'Playfair Display', serif; font-size: 22px; 
            font-weight: 900; letter-spacing: 12px; text-transform: uppercase;
        }

        @keyframes spin-reverse { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }

        /* Sharp Static Image */
        .front-image {
            position: relative;
            z-index: 5;
            width: 280px; height: 380px;
            background: #fff; padding: 10px;
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8);
        }
        .front-image img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }

        /* Body & Grid */
        .cat-row { display: flex; overflow-x: auto; padding: 30px 20px; gap: 20px; scrollbar-width: none; }
        .cat-item { min-width: 100px; text-align: center; }
        .cat-img { width: 80px; height: 80px; border-radius: 50%; border: 2px solid #ff9900; padding: 3px; background: #fff; margin: auto; }
        .cat-img img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

        .prod-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; padding: 30px; max-width: 1200px; margin: auto; }
        .p-card { background: #fff; border: 1px solid #f0f0f0; padding: 20px; border-radius: 20px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.03); }
        .p-card img { width: 100%; height: 180px; object-fit: contain; margin-bottom: 15px; }
        .buy-btn { background: var(--amz-blue); color: #fff; padding: 12px; display: block; text-decoration: none; border-radius: 10px; font-weight: 700; margin-top: 10px; }

        /* MOBILE FIX */
        @media(max-width: 768px) {
            #hero-sainiwalaa { height: auto; padding: 50px 0; flex-direction: column; }
            .hero-container { grid-template-columns: 1fr; text-align: center; padding: 0 20px; }
            .hero-text h1 { font-size: 32px; }
            .display-box { height: 400px; margin-top: 40px; }
            .back-wheel { width: 420px; height: 420px; }
            .front-image { width: 200px; height: 280px; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">SAINIWALAA</div>
    <div id="nav-root"></div>
</header>

<section id="hero-sainiwalaa">
    <div class="hero-container">
        <div class="hero-text">
            <h1 id="hero-t">Artistic Gifting</h1>
            <p id="hero-n">Loading Premium Collection...</p>
            <div id="hero-tg" style="margin-top:20px;"></div>
        </div>

        <div class="display-box">
            <div class="back-wheel">
                <svg class="rotating-svg" viewBox="0 0 500 500">
                    <path id="circlePath" d="M 250, 250 m -210, 0 a 210,210 0 1,1 420,0 a 210,210 0 1,1 -420,0" fill="none"></path>
                    <text>
                        <textPath href="#circlePath">
                            <tspan fill="#00f2fe">• PREMIUM KURTI •</tspan> 
                            <tspan fill="#f6d27c">TRENDING GADGETS •</tspan> 
                            <tspan fill="#7cf68c">HOME DECOR •</tspan> 
                            <tspan fill="#ff0080">EXCLUSIVE •</tspan>
                        </textPath>
                    </text>
                </svg>
            </div>
            <div class="front-image">
                <img id="hero-i" src="">
            </div>
        </div>
    </div>
</section>

<div class="cat-row" id="cat-root"></div>
<div class="prod-grid" id="prod-root"></div>

<footer style="background:#050b1a; color:#fff; padding:60px 20px; border-top:5px solid #ff9900;">
    <div id="f-marquee" style="margin-bottom:30px;"></div>
    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 40px; max-width: 1200px; margin: auto;">
        <div id="f-c1"></div><div id="f-c2"></div><div id="f-c3"></div>
    </div>
    <div id="f-bot" style="text-align:center; margin-top:40px; opacity:0.3; font-size:11px;"></div>
</footer>

<script>
const APIs = [
    "https://script.google.com/macros/s/AKfycbxajNF_583kuHsHZuky-oolW6vumnUtdy6t3OU_Rj94C5aYe8RDxO-qPhHR-0hixzjxuA/exec",
    "https://script.google.com/macros/s/AKfycbwxPgyRuXZPAUgnLBC0vkNx-bCgbOUS2hkrPbQfadwk6pFabK0OOAts_X9fnF9z-z5wLQ/exec",
    "https://script.google.com/macros/s/AKfycbwjpcQVkdSR_eXf5b9fWusK9JMqKBW9sP3Zz5rds4AxvcILAwICp9k89hMQNZ9rN1L1/exec"
];

async function init() {
    try {
        const [h, home, f] = await Promise.all(APIs.map(u => fetch(u).then(r => r.json())));
        
        // Nav
        h.menu.forEach(m => document.getElementById('nav-root').innerHTML += `<a href="${m.link}" style="color:#fff; margin-left:15px; text-decoration:none; font-size:13px; font-weight:700;">${m.text}</a>`);
        
        // Hero
        let imgs = [];
        h.hero.forEach(i => {
            if(i.type === "TITLE") document.getElementById('hero-t').innerText = i.text;
            if(i.type === "NOTICE") document.getElementById('hero-n').innerText = i.text;
            if(i.type === "TAG") document.getElementById('hero-tg').innerHTML += `<span style="border:1px solid #f6d27c; padding:4px 12px; border-radius:20px; margin-right:8px; font-size:11px; color:#f6d27c;">${i.text}</span>`;
            if(i.type === "SLIDE") imgs.push(i.image);
        });
        if(imgs.length) {
            let count = 0; document.getElementById('hero-i').src = imgs[0];
            setInterval(() => { count = (count+1)%imgs.length; document.getElementById('hero-i').src = imgs[count]; }, 3500);
        }

        // Body
        home.forEach(i => {
            if(i.TYPE === "CAT") {
                document.getElementById('cat-root').innerHTML += `<div onclick="location.href='${i.LINK}'"><div class="cat-img"><img src="${i.IMAGE_URL}"></div><p style="font-weight:700; font-size:12px; text-align:center; margin-top:8px;">${i.TITLE}</p></div>`;
            } else if(i.TYPE === "PRODUCT") {
                document.getElementById('prod-root').innerHTML += `<div class="p-card"><img src="${i.IMAGE_URL}"><h4 style="font-size:15px; margin-bottom:10px;">${i.TITLE}</h4><div style="color:#B12704; font-size:20px; font-weight:900;">₹${i.PRICE}</div><a href="${i.LINK}" class="buy-btn">View Offer</a></div>`;
            }
        });

        // Footer
        if(f.footer) {
            f.footer.forEach(i => {
                let box = i.POSITION === "LEFT" ? document.getElementById("f-c1") : i.POSITION === "CENTER" ? document.getElementById("f-c2") : i.POSITION === "RIGHT" ? document.getElementById("f-c3") : i.POSITION === "BOTTOM" ? document.getElementById("f-bot") : document.getElementById("f-marquee");
                if(i.TYPE === "MARQUEE") box.innerHTML = `<marquee style="color:#ff9900; font-weight:700;">${i.TEXT}</marquee>`;
                else if(i.TYPE === "TITLE") box.innerHTML += `<h3 style="color:#ff9900; margin-bottom:12px;">${i.TEXT}</h3>`;
                else if(i.TYPE === "LINK") box.innerHTML += `<a href="${i.LINK}" style="color:#ccc; display:block; margin-bottom:10px; text-decoration:none; font-size:13px;">${i.TEXT}</a>`;
                else if(i.TYPE === "BOTTOM") box.innerText = i.TEXT;
            });
        }
    } catch(e) { console.log(e); }
}
init();
</script>
</body>
</html>
