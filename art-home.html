<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sainiwalaa - Artistic Gifting Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --amz-blue: #131921; --amz-orange: #ff9900; --bg: #f8fafc; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); overflow-x: hidden; }

        header { background: var(--amz-blue); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        #menu a { color: white; text-decoration: none; margin-left: 15px; font-size: 13px; font-weight: 600; }

        /* --- ARTISTIC DYNAMIC HERO SECTION --- */
        #hero-sainiwalaa {
            position: relative; padding: 60px 20px;
            background: linear-gradient(135deg, #4b0f14, #1a0507, #4b0f14);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow: hidden; color: #fff; min-height: 450px; display: flex; align-items: center;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Gifting Wheel Animation Behind Slider */
        .gifting-wheel {
            position: absolute; width: 600px; height: 600px;
            border: 2px dashed rgba(255,153,0,0.3);
            border-radius: 50%; right: -150px; top: -50px;
            animation: rotateWheel 30s linear infinite;
            z-index: 1;
        }
        .gifting-wheel::before {
            content: ''; position: absolute; inset: 20px;
            border: 1px solid rgba(255,255,255,0.1); border-radius: 50%;
        }
        @keyframes rotateWheel { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .hero-wrap { position: relative; z-index: 10; max-width: 1200px; margin: auto; display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 30px; align-items: center; }
        
        .hero-left h1 { 
            font-size: 45px; font-weight: 800; line-height: 1.1; 
            background: linear-gradient(to right, #f6d27c, #fff, #f6d27c);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shine 3s infinite;
        }
        @keyframes shine { to { background-position: 200% center; } }

        .cats { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 25px; }
        .catbox { background: rgba(255,153,0,0.2); backdrop-filter: blur(10px); padding: 8px 16px; border-radius: 30px; font-weight: 700; font-size: 12px; border: 1px solid var(--amz-orange); color: #fff; }

        .slider-frame { 
            width: 100%; max-width: 280px; height: 380px; margin: auto; 
            background: rgba(255,255,255,0.05); backdrop-filter: blur(15px);
            padding: 10px; border-radius: 30px; border: 2px solid rgba(255,255,255,0.2);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .slider-frame img { width: 100%; height: 100%; object-fit: cover; border-radius: 20px; }

        /* --- CONTENT SECTION --- */
        .cat-row { display: flex; overflow-x: auto; padding: 30px 15px; gap: 20px; scrollbar-width: none; }
        .cat-item { text-align: center; min-width: 90px; }
        .cat-circle { width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--amz-orange); padding: 3px; background: #fff; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .cat-circle img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 15px 40px; }
        .p-card { background: white; border-radius: 20px; padding: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.04); text-align: center; border: 1px solid rgba(0,0,0,0.03); }
        .p-card img { width: 100%; height: 160px; object-fit: contain; }
        .btn { background: linear-gradient(135deg, #131921, #232f3e); color: #fff; text-decoration: none; padding: 12px; border-radius: 12px; display: block; font-weight: 700; margin-top: 10px; }

        /* --- FOOTER (Sheet Controlled + Socials) --- */
        footer { background: #050b1a; color: #fff; padding: 60px 20px 30px; margin-top: 50px; border-top: 4px solid var(--amz-orange); border-radius: 40px 40px 0 0; }
        #sw-marquee { overflow: hidden; white-space: nowrap; padding-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 35px; }
        #sw-marquee span { display: inline-block; animation: scrollText 25s linear infinite; color: var(--amz-orange); font-weight: 700; }
        @keyframes scrollText { from { transform: translateX(100%) } to { transform: translateX(-100%) } }
        
        .footer-grid { max-width: 1200px; margin: auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 40px; }
        .footer-col h3 { color: var(--amz-orange); margin-bottom: 20px; font-size: 20px; }
        .footer-col a { display: block; color: #bbb; text-decoration: none; margin-bottom: 12px; font-size: 14px; }
        
        .sw-social { display: flex; gap: 12px; margin-top: 20px; justify-content: flex-start; }
        .sw-social a { background: rgba(255,153,0,0.1); border: 1px solid var(--amz-orange); color: var(--amz-orange); padding: 8px 15px; border-radius: 10px; font-weight: 600; transition: 0.3s; }
        .sw-social a:hover { background: var(--amz-orange); color: #000; }

        @media(max-width: 768px) {
            .hero-wrap { grid-template-columns: 1fr; text-align: center; }
            .cats { justify-content: center; }
            .gifting-wheel { width: 400px; height: 400px; right: -100px; }
        }
    </style>
</head>
<body>

<header>
    <div style="font-size: 24px; font-weight: 800; color: #febd69; cursor:pointer;" onclick="location.href='index.html'">SAINIWALAA</div>
    <div id="menu"></div>
</header>

<section id="hero-sainiwalaa">
    <div class="gifting-wheel"></div>
    <div class="hero-wrap">
        <div class="hero-left">
            <h1 id="heroTitle">Sainiwalaa</h1>
            <p id="heroNotice">Fetching Premium Offers...</p>
            <div class="cats" id="heroTags"></div>
        </div>
        <div class="slider-frame"><img id="heroImg" src=""></div>
    </div>
</section>

<div class="cat-row" id="cat-root"></div>
<div style="padding: 0 20px 20px; font-weight: 800; font-size: 24px;">Deals of the Day ✨</div>
<div class="grid" id="prod-root"></div>

<footer id="sw-footer">
    <div id="sw-marquee"></div>
    <div class="footer-grid">
        <div class="footer-col" id="f-left"></div>
        <div class="footer-col" id="f-center"></div>
        <div class="footer-col" id="f-right"></div>
    </div>
    <div id="sw-bottom" style="text-align:center; margin-top:40px; opacity:0.4; font-size:12px; border-top:1px solid rgba(255,255,255,0.1); padding-top:20px;"></div>
</footer>

<script>
const APIs = [
    "https://script.google.com/macros/s/AKfycbxajNF_583kuHsHZuky-oolW6vumnUtdy6t3OU_Rj94C5aYe8RDxO-qPhHR-0hixzjxuA/exec", 
    "https://script.google.com/macros/s/AKfycbwxPgyRuXZPAUgnLBC0vkNx-bCgbOUS2hkrPbQfadwk6pFabK0OOAts_X9fnF9z-z5wLQ/exec", 
    "https://script.google.com/macros/s/AKfycbwjpcQVkdSR_eXf5b9fWusK9JMqKBW9sP3Zz5rds4AxvcILAwICp9k89hMQNZ9rN1L1/exec"
];

async function init() {
    try {
        const [h, home, f] = await Promise.all(APIs.map(u => fetch(u).then(r => r.json())));

        // Header & Hero
        h.menu.forEach(m => document.getElementById('menu').innerHTML += `<a href="${m.link}">${m.text}</a>`);
        let s = [];
        h.hero.forEach(i => {
            if(i.type === "TITLE") document.getElementById('heroTitle').innerText = i.text;
            if(i.type === "NOTICE") document.getElementById('heroNotice').innerText = i.text;
            if(i.type === "TAG") document.getElementById('heroTags').innerHTML += `<div class="catbox">${i.text}</div>`;
            if(i.type === "SLIDE") s.push(i.image);
        });
        if(s.length) {
            let idx = 0; document.getElementById('heroImg').src = s[0];
            setInterval(() => { idx = (idx+1)%s.length; document.getElementById('heroImg').src = s[idx]; }, 3000);
        }

        // Home
        home.forEach(i => {
            if(i.TYPE === "CAT") {
                document.getElementById('cat-root').innerHTML += `<div class="cat-item" onclick="location.href='${i.LINK}'"><div class="cat-circle"><img src="${i.IMAGE_URL}"></div><p>${i.TITLE}</p></div>`;
            } else if(i.TYPE === "PRODUCT") {
                document.getElementById('prod-root').innerHTML += `<div class="p-card"><img src="${i.IMAGE_URL}"><h4>${i.TITLE}</h4><div class="p-price">₹${i.PRICE}</div><a href="${i.LINK}" class="btn">View Offer</a></div>`;
            }
        });

        // Footer (Sheet Controlled + Socials)
        if(f.footer) {
            f.footer.forEach(i => {
                let box = i.POSITION === "LEFT" ? document.getElementById("f-left") : i.POSITION === "CENTER" ? document.getElementById("f-center") : i.POSITION === "RIGHT" ? document.getElementById("f-right") : i.POSITION === "BOTTOM" ? document.getElementById("sw-bottom") : document.getElementById("sw-marquee");
                if(i.TYPE === "MARQUEE") box.innerHTML = `<span>${i.TEXT}</span>`;
                else if(i.TYPE === "TITLE") box.innerHTML += `<h3>${i.TEXT}</h3>`;
                else if(i.TYPE === "LINK") box.innerHTML += `<a href="${i.LINK}">› ${i.TEXT}</a>`;
                else if(i.TYPE === "SOCIAL") {
                    let sc = box.querySelector('.sw-social') || box.insertAdjacentElement('beforeend', Object.assign(document.createElement('div'), {className:'sw-social'}));
                    sc.innerHTML += `<a href="${i.LINK}" target="_blank">${i.TEXT}</a>`;
                }
                else if(i.TYPE === "BOTTOM") box.innerText = i.TEXT;
            });
        }
    } catch (e) { console.log(e); }
}
init();
</script>
</body>
</html>
