<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sainiwalaa | Luxury Artistic Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #f59e0b; --dark: #020617; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #f8fafc; overflow-x: hidden; }

        /* --- 1. PREMIUM ANIMATED BACKGROUND --- */
        #hero-viewport {
            position: relative;
            height: 600px;
            background: var(--dark);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Floating background shapes for e-com feel */
        .bg-animate {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle at 20% 30%, #1e293b 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, #0f172a 0%, transparent 40%);
            z-index: 1;
        }

        /* Moving Background Images (Subtle) */
        .floating-bg-img {
            position: absolute; width: 200px; height: 200px;
            opacity: 0.15; filter: blur(2px);
            animation: float 15s infinite ease-in-out;
            z-index: 2;
        }
        @keyframes float { 
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-40px) rotate(10deg); }
        }

        /* --- 2. TEXT ANIMATION (GLOWING COLOR) --- */
        .hero-card {
            position: relative; z-index: 10;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 50px; border-radius: 40px;
            max-width: 1100px; width: 90%;
            display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 40px;
            align-items: center;
        }

        .hero-text h1 {
            font-size: 50px; font-weight: 800; line-height: 1.2;
            margin-bottom: 20px;
            /* Animated Color Effect */
            background: linear-gradient(90deg, #ffffff, #f59e0b, #ffffff, #f59e0b);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: colorFlow 6s linear infinite;
        }
        @keyframes colorFlow { to { background-position: 300% center; } }

        .hero-text p { color: #94a3b8; font-size: 18px; margin-bottom: 30px; }

        /* Frame remains same as you liked */
        .hero-frame {
            position: relative; width: 100%; max-width: 300px; height: 420px;
            border-radius: 20px; border: 10px solid rgba(255,255,255,0.05);
            overflow: hidden; box-shadow: 0 40px 80px rgba(0,0,0,0.6);
        }
        .hero-frame img { width: 100%; height: 100%; object-fit: cover; }

        /* --- 3. PRODUCT GRID --- */
        .product-section { padding: 80px 5%; max-width: 1300px; margin: auto; }
        .p-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
        .p-card { background: #fff; padding: 20px; border-radius: 24px; border: 1px solid #f1f5f9; transition: 0.4s ease; }
        .p-card:hover { transform: translateY(-10px); box-shadow: 0 30px 60px rgba(0,0,0,0.05); }
        .p-img-box { width: 100%; height: 250px; background: #f8fafc; border-radius: 15px; overflow: hidden; }
        .p-img-box img { width: 100%; height: 100%; object-fit: contain; }
        
        .p-btn { 
            display: block; background: var(--dark); color: #fff; text-align: center; 
            padding: 14px; border-radius: 12px; text-decoration: none; font-weight: 700; margin-top: 20px;
        }

        @media (max-width: 768px) {
            #hero-viewport { height: auto; padding: 60px 0; }
            .hero-card { grid-template-columns: 1fr; text-align: center; padding: 30px; }
            .hero-text h1 { font-size: 32px; }
            .p-grid { grid-template-columns: 1fr 1fr; gap: 15px; }
        }
    </style>
</head>
<body>

<section id="hero-viewport">
    <div class="bg-animate"></div>
    <div class="floating-bg-img" style="top:10%; left:5%; animation-delay: 0s;" id="bg-f1"></div>
    <div class="floating-bg-img" style="bottom:10%; right:10%; animation-delay: 2s;" id="bg-f2"></div>

    <div class="hero-card">
        <div class="hero-text">
            <h1 id="h-title">Jaipur Handpicked Kurtis & Custom Gifts</h1>
            <p id="h-notice">Experience the art of gifting with our exclusive collection.</p>
            <div id="h-tags" style="display:flex; gap:10px; margin-bottom:20px;"></div>
        </div>
        <div class="hero-frame">
            <img id="h-img" src="">
        </div>
    </div>
</section>

<div class="product-section">
    <h2 style="font-size: 30px; margin-bottom: 40px; font-weight: 800;">Featured Arrivals</h2>
    <div class="p-grid" id="prod-root"></div>
</div>

<script>
const APIs = [
    "https://script.google.com/macros/s/AKfycbxajNF_583kuHsHZuky-oolW6vumnUtdy6t3OU_Rj94C5aYe8RDxO-qPhHR-0hixzjxuA/exec",
    "https://script.google.com/macros/s/AKfycbwxPgyRuXZPAUgnLBC0vkNx-bCgbOUS2hkrPbQfadwk6pFabK0OOAts_X9fnF9z-z5wLQ/exec",
    "https://script.google.com/macros/s/AKfycbwjpcQVkdSR_eXf5b9fWusK9JMqKBW9sP3Zz5rds4AxvcILAwICp9k89hMQNZ9rN1L1/exec"
];

async function init() {
    try {
        const [h, home, f] = await Promise.all(APIs.map(u => fetch(u).then(r => r.json())));
        
        let sliderImgs = [];
        h.hero.forEach(i => {
            if(i.type === "SLIDE") sliderImgs.push(i.image);
            if(i.type === "TITLE") document.getElementById('h-title').innerText = i.text;
            if(i.type === "NOTICE") document.getElementById('h-notice').innerText = i.text;
        });

        // Hero Image Slider
        if(sliderImgs.length) {
            let n = 0;
            const updateHero = () => {
                document.getElementById('h-img').src = sliderImgs[n];
                // Background floating images sync
                document.getElementById('bg-f1').style.backgroundImage = `url('${sliderImgs[(n+1)%sliderImgs.length]}')`;
                document.getElementById('bg-f1').style.backgroundSize = 'cover';
                document.getElementById('bg-f2').style.backgroundImage = `url('${sliderImgs[(n+2)%sliderImgs.length]}')`;
                document.getElementById('bg-f2').style.backgroundSize = 'cover';
                n = (n + 1) % sliderImgs.length;
            };
            updateHero();
            setInterval(updateHero, 4000);
        }

        // Product Rendering
        home.forEach(i => {
            if(i.TYPE === "PRODUCT") {
                document.getElementById('prod-root').innerHTML += `
                    <div class="p-card">
                        <div class="p-img-box"><img src="${i.IMAGE_URL}"></div>
                        <h3 style="font-size:16px; margin:15px 0 10px;">${i.TITLE}</h3>
                        <div style="font-size:20px; font-weight:800; color:#10b981;">₹${i.PRICE}</div>
                        <a href="${i.LINK}" class="p-btn">View Offer</a>
                    </div>`;
            }
        });

    } catch(e) { console.log(e); }
}
init();
</script>
</body>
</html>
