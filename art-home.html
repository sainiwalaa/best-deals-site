<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sainiwalaa - Half Wheel Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
    <style>
        :root { --amz-blue: #131921; --amz-orange: #ff9900; --bg: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); overflow-x: hidden; }

        header { background: var(--amz-blue); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 22px; font-weight: 900; color: var(--amz-orange); }

        /* --- HERO SECTION --- */
        #hero-sainiwalaa {
            position: relative; padding: 40px 20px;
            background: #4b0f14; /* Solid Dark Maroon */
            overflow: hidden; color: #fff; min-height: 450px;
            display: flex; align-items: center; justify-content: center;
        }

        /* HALF WHEEL AT BOTTOM */
        .half-wheel-container {
            position: absolute; 
            width: 800px; height: 800px;
            bottom: -400px; /* Adha niche chupa diya */
            left: 50%; transform: translateX(-50%);
            z-index: 1;
        }

        .rotating-ring {
            position: absolute; inset: 0;
            border: 2px solid rgba(255, 153, 0, 0.3);
            border-radius: 50%;
            animation: rotateText 20s linear infinite;
        }

        .wheel-svg {
            width: 100%; height: 100%;
            animation: rotateText 25s linear infinite;
        }

        .wheel-svg text {
            font-family: 'Playfair Display', serif;
            font-size: 22px; font-weight: 900;
            text-transform: uppercase; letter-spacing: 10px;
        }

        /* Animation: Text niche se upar aate hue ghumega */
        @keyframes rotateText {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Overlay to fade text at top */
        #hero-sainiwalaa::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(to bottom, #4b0f14 10%, transparent 40%, transparent 60%, #4b0f14 90%);
            z-index: 2; pointer-events: none;
        }

        /* --- CONTENT --- */
        .hero-wrap { 
            position: relative; z-index: 10; max-width: 1200px; width: 100%;
            margin: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: center; 
        }
        
        .hero-left h1 { font-size: 40px; font-weight: 900; color: #f6d27c; line-height: 1.1; }
        .hero-left p { color: #ffe9b0; margin-top: 10px; font-size: 16px; font-weight: 500; }
        
        /* NO ANIMATION ON IMAGE */
        .slider-frame { 
            width: 100%; max-width: 260px; height: 350px; margin: auto; 
            background: #fff; padding: 8px; border-radius: 20px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            /* Animation Removed */
        }
        .slider-frame img { width: 100%; height: 100%; object-fit: cover; border-radius: 15px; }

        /* HOME CONTENT */
        .cat-row { display: flex; overflow-x: auto; padding: 25px 15px; gap: 20px; scrollbar-width: none; }
        .cat-circle { width: 80px; height: 80px; border-radius: 50%; border: 2px solid #eee; padding: 3px; background: #fff; }
        .cat-circle img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; }
        .p-card { background: white; border-radius: 15px; padding: 15px; text-align: center; border: 1px solid #eee; }
        .p-card img { width: 100%; height: 140px; object-fit: contain; }
        .btn-buy { background: #131921; color: white; text-decoration: none; padding: 10px; border-radius: 10px; display: block; font-weight: 700; margin-top: 10px; font-size: 13px; }

        @media(max-width: 768px) {
            .hero-wrap { grid-template-columns: 1fr; text-align: center; }
            .half-wheel-container { width: 500px; height: 500px; bottom: -250px; }
            .hero-left h1 { font-size: 30px; }
            .slider-frame { max-width: 200px; height: 280px; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">SAINIWALAA</div>
    <div id="menu"></div>
</header>

<section id="hero-sainiwalaa">
    <div class="half-wheel-container">
        <div class="rotating-ring"></div>
        <svg class="wheel-svg" viewBox="0 0 500 500">
            <path id="wheelPath" d="M 250, 250 m -220, 0 a 220,220 0 1,1 440,0 a 220,220 0 1,1 -440,0" fill="none"></path>
            <text>
                <textPath href="#wheelPath">
                    <tspan fill="#ff9900">WOMEN FASHION •</tspan> 
                    <tspan fill="#00f2fe">GADGETS •</tspan> 
                    <tspan fill="#f093fb">HOME DECOR •</tspan> 
                    <tspan fill="#7cf68c">NEW DEALS •</tspan>
                </textPath>
            </text>
        </svg>
    </div>

    <div class="hero-wrap">
        <div class="hero-left">
            <h1 id="heroTitle">Sainiwalaa</h1>
            <p id="heroNotice">Fetching Deals...</p>
            <div id="heroTags" style="margin-top:15px;"></div>
        </div>
        <div class="slider-frame">
            <img id="heroImg" src="">
        </div>
    </div>
</section>

<div class="cat-row" id="cat-root"></div>
<div class="grid" id="prod-root"></div>

<footer id="sw-footer" style="background:#050b1a; color:#fff; padding:40px 20px; border-top:4px solid #ff9900;">
    <div id="sw-marquee"></div>
    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 30px;" id="f-grid">
        <div id="f-left"></div>
        <div id="f-center"></div>
        <div id="f-right"></div>
    </div>
    <div id="sw-bottom" style="text-align:center; margin-top:30px; opacity:0.3; font-size:11px;"></div>
</footer>

<script>
const APIs = [
    "https://script.google.com/macros/s/AKfycbxajNF_583kuHsHZuky-oolW6vumnUtdy6t3OU_Rj94C5aYe8RDxO-qPhHR-0hixzjxuA/exec",
    "https://script.google.com/macros/s/AKfycbwxPgyRuXZPAUgnLBC0vkNx-bCgbOUS2hkrPbQfadwk6pFabK0OOAts_X9fnF9z-z5wLQ/exec",
    "https://script.google.com/macros/s/AKfycbwjpcQVkdSR_eXf5b9fWusK9JMqKBW9sP3Zz5rds4AxvcILAwICp9k89hMQNZ9rN1L1/exec"
];

async function init() {
    try {
        const [h, home, f] = await Promise.all(APIs.map(u => fetch(u).then(r => r.json())));
        
        h.menu.forEach(m => document.getElementById('menu').innerHTML += `<a href="${m.link}" style="color:#fff; text-decoration:none; margin-left:12px; font-size:12px; font-weight:700;">${m.text}</a>`);
        
        let s = [];
        h.hero.forEach(i => {
            if(i.type === "TITLE") document.getElementById('heroTitle').innerText = i.text;
            if(i.type === "NOTICE") document.getElementById('heroNotice').innerText = i.text;
            if(i.type === "TAG") document.getElementById('heroTags').innerHTML += `<span style="background:rgba(255,255,255,0.1); border:1px solid #ff9900; padding:4px 10px; border-radius:15px; margin-right:8px; font-size:10px; font-weight:700;">${i.text}</span>`;
            if(i.type === "SLIDE") s.push(i.image);
        });
        if(s.length) {
            let idx = 0; document.getElementById('heroImg').src = s[0];
            setInterval(() => { idx = (idx+1)%s.length; document.getElementById('heroImg').src = s[idx]; }, 3000);
        }

        home.forEach(i => {
            if(i.TYPE === "CAT") {
                document.getElementById('cat-root').innerHTML += `<div onclick="location.href='${i.LINK}'"><div class="cat-circle"><img src="${i.IMAGE_URL}"></div><p style="text-align:center;font-size:11px;font-weight:700;margin-top:5px;">${i.TITLE}</p></div>`;
            } else if(i.TYPE === "PRODUCT") {
                document.getElementById('prod-root').innerHTML += `<div class="p-card"><img src="${i.IMAGE_URL}"><h5 style="font-size:14px;">${i.TITLE}</h5><div style="color:#B12704; font-weight:800; margin:5px 0;">₹${i.PRICE}</div><a href="${i.LINK}" class="btn-buy">Buy Now</a></div>`;
            }
        });

        if(f.footer) {
            f.footer.forEach(i => {
                let box = i.POSITION === "LEFT" ? document.getElementById("f-left") : i.POSITION === "CENTER" ? document.getElementById("f-center") : i.POSITION === "RIGHT" ? document.getElementById("f-right") : i.POSITION === "BOTTOM" ? document.getElementById("sw-bottom") : document.getElementById("sw-marquee");
                if(i.TYPE === "MARQUEE") box.innerHTML = `<marquee style="color:#ff9900; font-weight:700;">${i.TEXT}</marquee>`;
                else if(i.TYPE === "TITLE") box.innerHTML += `<h4 style="color:#ff9900; margin-bottom:10px;">${i.TEXT}</h4>`;
                else if(i.TYPE === "LINK") box.innerHTML += `<a href="${i.LINK}" style="color:#ccc; text-decoration:none; display:block; font-size:12px; margin-bottom:8px;">${i.TEXT}</a>`;
                else if(i.TYPE === "BOTTOM") box.innerText = i.TEXT;
            });
        }
    } catch (e) { console.log(e); }
}
init();
</script>
</body>
</html>
