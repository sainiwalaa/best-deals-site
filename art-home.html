<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sainiwalaa | Animated E-com</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --p: #0f172a; --gold: #f59e0b; --bg: #f8fafc; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); overflow-x: hidden; }

        /* --- TICKER --- */
        .ticker { background: #000; color: #fff; padding: 10px 0; overflow: hidden; white-space: nowrap; z-index: 1001; position: relative; }
        .ticker-track { display: inline-block; animation: slide 30s linear infinite; font-size: 13px; font-weight: 700; }
        .ticker-track span { margin-right: 50px; color: var(--gold); }
        @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-50%); } }

        /* --- HERO WITH BACKGROUND SCROLL --- */
        #hero-container {
            position: relative;
            min-height: 500px;
            display: flex;
            align-items: center;
            overflow: hidden;
            color: #fff;
        }

        /* Background Slider Logic */
        .hero-bg-slider {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }
        .bg-slide {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            opacity: 0; transition: opacity 1.5s ease-in-out;
        }
        .bg-slide.active { opacity: 1; }
        /* Overlay for text readability */
        .hero-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to right, rgba(2, 6, 23, 0.9) 30%, rgba(2, 6, 23, 0.3) 100%);
            z-index: 2;
        }

        .hero-content {
            position: relative; z-index: 10;
            max-width: 1200px; margin: auto; width: 100%;
            display: grid; grid-template-columns: 1.2fr 0.8fr;
            padding: 0 5%; gap: 40px; align-items: center;
        }

        /* GLOWING TEXT EFFECT */
        .hero-text h1 {
            font-size: 52px; font-weight: 800; line-height: 1.1; margin-bottom: 20px;
            background: linear-gradient(90deg, #fff, var(--gold), #fff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
        }
        @keyframes shine { to { background-position: 200% center; } }

        .hero-text p { font-size: 18px; color: #cbd5e1; margin-bottom: 25px; }

        .hero-img-frame {
            width: 100%; max-width: 320px; height: 450px;
            border-radius: 25px; border: 8px solid rgba(255,255,255,0.1);
            overflow: hidden; box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }
        .hero-img-frame img { width: 100%; height: 100%; object-fit: cover; }

        /* --- PRODUCT GRID (Same as requested) --- */
        .product-section { padding: 60px 5%; max-width: 1200px; margin: auto; }
        .p-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; }
        .p-card { background: #fff; padding: 15px; border-radius: 20px; border: 1px solid #edf2f7; transition: 0.4s; }
        .p-card:hover { transform: translateY(-10px); box-shadow: 0 15px 30px rgba(0,0,0,0.05); }
        .p-img-w { width: 100%; height: 220px; border-radius: 12px; background: #f1f5f9; overflow: hidden; }
        .p-img-w img { width: 100%; height: 100%; object-fit: contain; }
        .p-btn { display: block; background: #000; color: #fff; text-align: center; padding: 12px; border-radius: 10px; text-decoration: none; font-weight: 700; margin-top: 15px; }

        @media (max-width: 768px) {
            .hero-content { grid-template-columns: 1fr; text-align: center; }
            .hero-text h1 { font-size: 34px; }
            .hero-img-frame { margin: auto; width: 250px; height: 350px; }
            .p-grid { grid-template-columns: 1fr 1fr; gap: 15px; }
        }
    </style>
</head>
<body>

<div class="ticker">
    <div class="ticker-track">
        <span>✨ JAIPUR HANDPICKED KURTIS</span>
        <span>🔥 FREE DELIVERY ON SELECTED ITEMS</span>
        <span>🎁 ARTISTIC GIFTING SOLUTIONS</span>
        <span>✨ JAIPUR HANDPICKED KURTIS</span>
    </div>
</div>

<div id="hero-container">
    <div class="hero-bg-slider" id="bg-slider"></div>
    <div class="hero-overlay"></div>

    <div class="hero-content">
        <div class="hero-text">
            <h1 id="h-title">Jaipur Handpicked Kurtis & Custom Gifts</h1>
            <p id="h-notice">Premium Quality. Artistic Design. Fast Delivery.</p>
            <div id="h-tags"></div>
        </div>
        <div class="hero-img-frame">
            <img id="h-img" src="">
        </div>
    </div>
</div>

<div class="product-section">
    <h2 style="margin-bottom:30px;">Featured Collection 🔥</h2>
    <div class="p-grid" id="prod-root"></div>
</div>

<script>
const APIs = [
    "https://script.google.com/macros/s/AKfycbxajNF_583kuHsHZuky-oolW6vumnUtdy6t3OU_Rj94C5aYe8RDxO-qPhHR-0hixzjxuA/exec",
    "https://script.google.com/macros/s/AKfycbwxPgyRuXZPAUgnLBC0vkNx-bCgbOUS2hkrPbQfadwk6pFabK0OOAts_X9fnF9z-z5wLQ/exec",
    "https://script.google.com/macros/s/AKfycbwjpcQVkdSR_eXf5b9fWusK9JMqKBW9sP3Zz5rds4AxvcILAwICp9k89hMQNZ9rN1L1/exec"
];

async function init() {
    try {
        const [h, home, f] = await Promise.all(APIs.map(u => fetch(u).then(r => r.json())));
        
        // Setup Hero Background Slides & Main Image
        let sliderImgs = [];
        h.hero.forEach(i => {
            if(i.type === "SLIDE") sliderImgs.push(i.image);
            if(i.type === "TITLE") document.getElementById('h-title').innerText = i.text;
            if(i.type === "NOTICE") document.getElementById('h-notice').innerText = i.text;
        });

        const bgContainer = document.getElementById('bg-slider');
        sliderImgs.forEach((url, index) => {
            const div = document.createElement('div');
            div.className = `bg-slide ${index === 0 ? 'active' : ''}`;
            div.style.backgroundImage = `url('${url}')`;
            bgContainer.appendChild(div);
        });

        // Background Rotation Logic
        let currentSlide = 0;
        const slides = document.querySelectorAll('.bg-slide');
        setInterval(() => {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
            // Sync current frame image with background
            document.getElementById('h-img').src = sliderImgs[currentSlide];
        }, 4000);

        document.getElementById('h-img').src = sliderImgs[0];

        // Products
        home.forEach(i => {
            if(i.TYPE === "PRODUCT") {
                document.getElementById('prod-root').innerHTML += `
                    <div class="p-card">
                        <div class="p-img-w"><img src="${i.IMAGE_URL}"></div>
                        <div class="p-title" style="font-weight:700; margin-top:10px;">${i.TITLE}</div>
                        <div class="p-price" style="color:#10b981; font-weight:800; font-size:18px;">₹${i.PRICE}</div>
                        <a href="${i.LINK}" class="p-btn">Buy Now</a>
                    </div>`;
            }
        });

    } catch(e) { console.error(e); }
}
init();
</script>
</body>
</html>
