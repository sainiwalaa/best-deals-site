<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sainiwalaa | Luxury Artistic Gifting</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,800;1,800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #f59e0b; --dark: #020617; --white: #ffffff; --gray: #64748b; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #fdfdfd; color: var(--dark); overflow-x: hidden; scroll-behavior: smooth; }

        /* --- HEADER --- */
        header { 
            background: rgba(255,255,255,0.8); backdrop-filter: blur(15px); 
            padding: 20px 6%; display: flex; justify-content: space-between; align-items: center; 
            position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .logo { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 800; color: var(--dark); letter-spacing: -1px; }
        #nav-root a { text-decoration: none; color: var(--dark); font-weight: 600; font-size: 14px; margin-left: 25px; transition: 0.3s; }
        #nav-root a:hover { color: var(--gold); }

        /* --- CINEMATIC HERO --- */
        #hero {
            position: relative; min-height: 85vh; background: var(--dark);
            display: flex; align-items: center; overflow: hidden; color: var(--white);
            padding: 40px 6%;
        }
        .hero-bg-accent {
            position: absolute; top: -10%; right: -10%; width: 50%; height: 70%;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.15) 0%, transparent 70%);
            z-index: 1; filter: blur(60px); animation: pulse 8s infinite alternate;
        }
        @keyframes pulse { from { opacity: 0.4; transform: scale(1); } to { opacity: 0.8; transform: scale(1.2); } }

        .hero-container {
            position: relative; z-index: 10; width: 100%; max-width: 1400px; margin: auto;
            display: grid; grid-template-columns: 1fr 1fr; gap: 50px; align-items: center;
        }

        .hero-text h1 { 
            font-family: 'Playfair Display', serif; font-size: 64px; line-height: 1.1; margin-bottom: 25px;
            background: linear-gradient(to right, #fff 20%, var(--gold) 50%, #fff 80%);
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shine 5s linear infinite;
        }
        @keyframes shine { to { background-position: 200% center; } }

        .hero-text p { font-size: 18px; color: var(--gray); margin-bottom: 35px; max-width: 500px; line-height: 1.6; }

        .hero-image-wrap { position: relative; display: flex; justify-content: flex-end; }
        .hero-main-frame {
            width: 400px; height: 550px; border-radius: 40px; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 50px 100px -20px rgba(0,0,0,0.7);
            transform: rotate(2deg); transition: 0.5s ease;
        }
        .hero-main-frame:hover { transform: rotate(0deg) scale(1.02); }
        .hero-main-frame img { width: 100%; height: 100%; object-fit: cover; }

        /* --- PRODUCTS GRID --- */
        .section-header { padding: 80px 6% 40px; text-align: center; }
        .section-header h2 { font-size: 36px; font-family: 'Playfair Display', serif; }
        
        .p-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 40px; padding: 0 6% 100px; }
        .p-card { 
            background: var(--white); padding: 20px; border-radius: 30px; 
            transition: 0.4s cubic-bezier(0.2, 1, 0.3, 1); border: 1px solid #f1f5f9;
        }
        .p-card:hover { transform: translateY(-15px); box-shadow: 0 30px 60px rgba(15, 23, 42, 0.1); }
        .p-img-w { width: 100%; height: 320px; border-radius: 20px; overflow: hidden; background: #f8fafc; margin-bottom: 20px; }
        .p-img-w img { width: 100%; height: 100%; object-fit: contain; transition: 0.6s ease; }
        .p-card:hover .p-img-w img { transform: scale(1.1); }
        
        .p-title { font-size: 18px; font-weight: 700; color: var(--dark); margin-bottom: 10px; }
        .p-price { font-size: 22px; font-weight: 400; color: var(--gray); margin-bottom: 20px; }
        .p-btn { 
            display: block; width: 100%; text-align: center; padding: 16px; 
            background: var(--dark); color: #fff; text-decoration: none; 
            border-radius: 15px; font-weight: 600; transition: 0.3s;
        }
        .p-btn:hover { background: var(--gold); color: var(--dark); }

        /* --- FOOTER --- */
        footer { background: var(--dark); color: #fff; padding: 80px 6% 40px; }
        .footer-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 50px; }
        .footer-box h3 { color: var(--gold); margin-bottom: 25px; font-size: 20px; }
        .footer-box a { display: block; color: var(--gray); text-decoration: none; margin-bottom: 12px; font-size: 14px; transition: 0.3s; }
        .footer-box a:hover { color: #fff; padding-left: 5px; }

        @media (max-width: 992px) {
            .hero-container { grid-template-columns: 1fr; text-align: center; }
            .hero-text h1 { font-size: 44px; }
            .hero-text p { margin: 0 auto 30px; }
            .hero-image-wrap { justify-content: center; }
            .hero-main-frame { width: 300px; height: 420px; }
            .p-grid { grid-template-columns: 1fr 1fr; gap: 20px; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">SAINIWALAA</div>
    <nav id="nav-root"></nav>
</header>

<section id="hero">
    <div class="hero-bg-accent"></div>
    <div class="hero-container">
        <div class="hero-text">
            <h1 id="h-title">Jaipur Handpicked Kurtis & Custom Gifts</h1>
            <p id="h-notice">Artisan-crafted elegance delivered to your doorstep. Explore our exclusive collection of traditional wear and bespoke gifts.</p>
            <div id="h-tags"></div>
        </div>
        <div class="hero-image-wrap">
            <div class="hero-main-frame">
                <img id="h-img" src="" alt="Featured Collection">
            </div>
        </div>
    </div>
</section>

<div class="section-header">
    <div id="f-marquee" style="margin-bottom: 20px; font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: 2px;"></div>
    <h2>Trending Masterpieces</h2>
</div>

<div class="p-grid" id="prod-root"></div>

<footer>
    <div class="footer-grid">
        <div id="f-c1" class="footer-box"></div>
        <div id="f-c2" class="footer-box"></div>
        <div id="f-c3" class="footer-box"></div>
    </div>
    <div id="f-bot" style="text-align: center; margin-top: 60px; color: var(--gray); font-size: 12px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 30px;"></div>
</footer>

<script>
const APIs = [
    "https://script.google.com/macros/s/AKfycbxajNF_583kuHsHZuky-oolW6vumnUtdy6t3OU_Rj94C5aYe8RDxO-qPhHR-0hixzjxuA/exec",
    "https://script.google.com/macros/s/AKfycbwxPgyRuXZPAUgnLBC0vkNx-bCgbOUS2hkrPbQfadwk6pFabK0OOAts_X9fnF9z-z5wLQ/exec",
    "https://script.google.com/macros/s/AKfycbwjpcQVkdSR_eXf5b9fWusK9JMqKBW9sP3Zz5rds4AxvcILAwICp9k89hMQNZ9rN1L1/exec"
];

async function init() {
    try {
        const [h, home, f] = await Promise.all(APIs.map(u => fetch(u).then(r => r.json())));
        
        // Header Nav
        h.menu.forEach(m => document.getElementById('nav-root').innerHTML += `<a href="${m.link}">${m.text}</a>`);
        
        // Hero Sync
        let imgs = [];
        h.hero.forEach(i => {
            if(i.type === "TITLE") document.getElementById('h-title').innerText = i.text;
            if(i.type === "NOTICE") document.getElementById('h-notice').innerText = i.text;
            if(i.type === "TAG") document.getElementById('h-tags').innerHTML += `<span style="border: 1px solid rgba(255,255,255,0.2); padding: 8px 18px; border-radius: 30px; font-size: 12px; margin-right: 10px; color: var(--gold);">${i.text}</span>`;
            if(i.type === "SLIDE") imgs.push(i.image);
        });
        if(imgs.length) {
            let n = 0; document.getElementById('h-img').src = imgs[0];
            setInterval(() => { n = (n+1)%imgs.length; document.getElementById('h-img').src = imgs[n]; }, 4000);
        }

        // Home Products
        home.forEach(i => {
            if(i.TYPE === "PRODUCT") {
                document.getElementById('prod-root').innerHTML += `
                    <div class="p-card">
                        <div class="p-img-w"><img src="${i.IMAGE_URL}"></div>
                        <div class="p-title">${i.TITLE}</div>
                        <div class="p-price">₹${i.PRICE}</div>
                        <a href="${i.LINK}" class="p-btn">View Collection</a>
                    </div>`;
            }
        });

        // Footer Sync
        if(f.footer) {
            f.footer.forEach(i => {
                let box = i.POSITION === "LEFT" ? document.getElementById("f-c1") : i.POSITION === "CENTER" ? document.getElementById("f-c2") : i.POSITION === "RIGHT" ? document.getElementById("f-c3") : i.POSITION === "BOTTOM" ? document.getElementById("f-bot") : document.getElementById("f-marquee");
                if(i.TYPE === "MARQUEE") box.innerHTML = `<marquee scrollamount="8">${i.TEXT}</marquee>`;
                else if(i.TYPE === "TITLE") box.innerHTML += `<h3>${i.TEXT}</h3>`;
                else if(i.TYPE === "LINK") box.innerHTML += `<a href="${i.LINK}">${i.TEXT}</a>`;
                else if(i.TYPE === "BOTTOM") box.innerText = i.TEXT;
            });
        }
    } catch(e) { console.error(e); }
}
init();
</script>
</body>
</html>
