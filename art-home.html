<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sainiwalaa | Official Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Poppins:wght@300;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #000000; --accent: #febd69; --bg: #f3f3f3; --dark-blue: #0b1730; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: #333; overflow-x: hidden; }

        /* --- HEADER (BLACK & WHITE) --- */
        header { 
            background: #000; padding: 15px 5%; display: flex; justify-content: space-between; 
            align-items: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 15px rgba(0,0,0,0.3);
        }
        .logo { font-size: 26px; font-weight: 900; color: #fff; letter-spacing: 1px; }
        #nav-root a { color: #fff; margin-left: 18px; text-decoration: none; font-size: 14px; font-weight: 700; transition: 0.3s; }
        #nav-root a:hover { color: var(--accent); }

        /* --- FULL WIDTH HERO SLIDER --- */
        #hero-section {
            width: 100%; height: 500px; position: relative; overflow: hidden; background: #131921;
        }
        .slide-container { width: 100%; height: 100%; }
        .slide {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; transition: opacity 1.2s ease-in-out;
        }
        .slide.active { opacity: 1; }
        .slide img { width: 100%; height: 100%; object-fit: cover; }
        
        .hero-overlay {
            position: absolute; bottom: 50px; left: 5%; z-index: 10;
            background: rgba(0,0,0,0.7); padding: 25px; border-radius: 12px;
            color: #fff; max-width: 550px; border-left: 5px solid var(--accent);
        }
        .hero-overlay h1 { color: var(--accent); font-size: 38px; margin-bottom: 10px; font-weight: 900; }
        .tag-cloud { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        .tag-cloud span { background: var(--accent); color: #000; padding: 6px 14px; border-radius: 4px; font-size: 12px; font-weight: 800; text-transform: uppercase; }

        /* --- CATEGORIES --- */
        .section-title { padding: 40px 5% 10px; font-size: 24px; font-weight: 900; display: flex; justify-content: space-between; align-items: center; }
        .section-title span { font-size: 14px; color: #666; cursor: pointer; }
        .cat-scroll { display: flex; overflow-x: auto; padding: 20px 5%; gap: 25px; scrollbar-width: none; }
        .cat-box { min-width: 100px; text-align: center; cursor: pointer; transition: 0.3s; }
        .cat-box:hover { transform: scale(1.05); }
        .cat-box .img-w { width: 85px; height: 85px; border-radius: 50%; background: #fff; margin: 0 auto 12px; overflow: hidden; border: 3px solid #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .cat-box img { width: 100%; height: 100%; object-fit: cover; }

        /* --- PRODUCTS --- */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 25px; padding: 20px 5%; }
        .p-card { background: #fff; border-radius: 15px; padding: 20px; transition: 0.3s; border: 1px solid #eee; text-align: center; position: relative; }
        .p-card:hover { transform: translateY(-8px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .p-card img { width: 100%; height: 220px; object-fit: contain; margin-bottom: 15px; }
        .price { font-size: 22px; font-weight: 900; color: #B12704; margin: 10px 0; }
        .buy-now { display: block; background: var(--accent); color: #111; text-align: center; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: 700; transition: 0.3s; }
        .buy-now:hover { background: #eeb05d; }

        /* --- SYSTEM FOOTER STYLE --- */
        #sw-footer { width:100%; background:linear-gradient(180deg,#050b1a,#0b1730); padding:60px 5% 30px; color:#ffffff; margin-top: 60px; }
        #sw-marquee { overflow:hidden; white-space:nowrap; text-align:center; margin-bottom:40px; border-bottom:1px solid rgba(255,255,255,.1); padding-bottom:15px; }
        #sw-marquee span { display:inline-block; animation:sw-scroll 25s linear infinite; font-weight:600; font-family: 'Poppins'; }
        @keyframes sw-scroll { from{transform:translateX(100%)} to{transform:translateX(-100%)} }
        #sw-inner { max-width:1200px; margin:auto; display:grid; grid-template-columns:1.5fr 1fr 1fr; gap:50px; }
        .sw-col h2 { margin:0 0 15px; font-size:28px; font-family: 'Poppins'; }
        .sw-col p { line-height: 1.6; opacity:.8; font-size:15px; margin-bottom: 15px; }
        .sw-links a { display:block; margin:8px 0; color:#fff; text-decoration:none; font-weight:500; font-size:15px; transition: 0.2s; }
        .sw-links a:hover { color: var(--accent); padding-left: 5px; }
        .sw-btn { display:inline-block; margin-top:15px; padding:12px 28px; background:linear-gradient(90deg,#ff9800,#ff5722); color:#000 !important; border-radius:30px; text-decoration:none; font-weight:700; }
        .sw-social a { margin-right:15px; text-decoration:none; font-weight:700; display: inline-block; margin-top: 10px; }
        #sw-bottom { text-align:center; margin-top:40px; font-size:13px; opacity:.5; border-top:1px solid rgba(255,255,255,.1); padding-top:20px; }

        /* --- MOBILE OPTIMIZATION --- */
        @media (max-width: 768px) {
            header { padding: 15px 20px; }
            #hero-section { height: 350px; }
            .hero-overlay { bottom: 20px; left: 5%; right: 5%; padding: 15px; }
            .hero-overlay h1 { font-size: 24px; }
            .product-grid { grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
            #sw-inner { grid-template-columns: 1fr; text-align: center; }
            .sw-col h2 { font-size: 24px; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">SAINIWALAA</div>
    <nav id="nav-root"></nav>
</header>

<section id="hero-section">
    <div class="slide-container" id="slider-root"></div>
    <div class="hero-overlay">
        <h1 id="hero-t">Loading Style...</h1>
        <p id="hero-n">Just a moment...</p>
        <div class="tag-cloud" id="hero-tg"></div>
    </div>
</section>

<div class="section-title">Shop by Category <span>View All ›</span></div>
<div class="cat-scroll" id="cat-root"></div>

<div class="section-title">Trending Collection 🔥</div>
<div class="product-grid" id="prod-root"></div>

<div id="sw-footer">
    <div id="sw-marquee"></div>
    <div id="sw-inner">
        <div class="sw-col" id="sw-left"></div>
        <div class="sw-col" id="sw-center"></div>
        <div class="sw-col" id="sw-right"></div>
    </div>
    <div id="sw-bottom"></div>
</div>

<script>
const HERO_API = "https://script.google.com/macros/s/AKfycbxajNF_583kuHsHZuky-oolW6vumnUtdy6t3OU_Rj94C5aYe8RDxO-qPhHR-0hixzjxuA/exec";
const SHOP_API = "https://script.google.com/macros/s/AKfycbwxPgyRuXZPAUgnLBC0vkNx-bCgbOUS2hkrPbQfadwk6pFabK0OOAts_X9fnF9z-z5wLQ/exec";
const FOOTER_API = "https://script.google.com/macros/s/AKfycbwjpcQVkdSR_eXf5b9fWusK9JMqKBW9sP3Zz5rds4AxvcILAwICp9k89hMQNZ9rN1L1/exec";

async function init() {
    try {
        const [hData, sData, fData] = await Promise.all([
            fetch(HERO_API).then(r => r.json()),
            fetch(SHOP_API).then(r => r.json()),
            fetch(FOOTER_API).then(r => r.json())
        ]);

        // 1. Header Navigation
        hData.menu.forEach(m => {
            document.getElementById('nav-root').innerHTML += `<a href="${m.link}">${m.text}</a>`;
        });

        // 2. Full Width Slider Logic
        let slideImgs = [];
        hData.hero.forEach(item => {
            if(item.type === "TITLE") document.getElementById('hero-t').innerText = item.text;
            if(item.type === "NOTICE") document.getElementById('hero-n').innerText = item.text;
            if(item.type === "TAG") document.getElementById('hero-tg').innerHTML += `<span>${item.text}</span>`;
            if(item.type === "SLIDE") slideImgs.push(item.image);
        });

        const sliderRoot = document.getElementById('slider-root');
        slideImgs.forEach((url, i) => {
            const div = document.createElement('div');
            div.className = `slide ${i === 0 ? 'active' : ''}`;
            div.innerHTML = `<img src="${url}" alt="Sainiwalaa Banner">`;
            sliderRoot.appendChild(div);
        });

        if(slideImgs.length > 1) {
            let cur = 0;
            const allS = document.querySelectorAll('.slide');
            setInterval(() => {
                allS[cur].classList.remove('active');
                cur = (cur + 1) % allS.length;
                allS[cur].classList.add('active');
            }, 4500);
        }

        // 3. Shop Content (Categories & Products)
        sData.forEach(item => {
            if(item.TYPE === "CAT") {
                document.getElementById('cat-root').innerHTML += `
                    <div class="cat-box" onclick="location.href='${item.LINK}'">
                        <div class="img-w"><img src="${item.IMAGE_URL}"></div>
                        <p style="font-size:12px; font-weight:700;">${item.TITLE}</p>
                    </div>`;
            } else if(item.TYPE === "PRODUCT") {
                document.getElementById('prod-root').innerHTML += `
                    <div class="p-card">
                        <img src="${item.IMAGE_URL}">
                        <h4 style="font-size:15px; font-weight:700;">${item.TITLE}</h4>
                        <div class="price">₹${item.PRICE}</div>
                        <a href="${item.LINK}" class="buy-now">View Detail</a>
                    </div>`;
            }
        });

        // 4. System Footer Integration
        if(fData.footer) {
            fData.footer.forEach(i => {
                let box = i.POSITION === "LEFT" ? document.getElementById("sw-left") : 
                          i.POSITION === "CENTER" ? document.getElementById("sw-center") : 
                          i.POSITION === "RIGHT" ? document.getElementById("sw-right") : 
                          i.POSITION === "BOTTOM" ? document.getElementById("sw-bottom") : 
                          document.getElementById("sw-marquee");

                if(i.TYPE === "MARQUEE") box.innerHTML = `<span style="color:${i.COLOR}; font-size:${i.SIZE}px">${i.TEXT}</span>`;
                if(i.TYPE === "TITLE") box.innerHTML += `<h2 style="color:${i.COLOR}">${i.TEXT}</h2>`;
                if(i.TYPE === "TEXT") box.innerHTML += `<p style="color:${i.COLOR}; font-size:${i.SIZE}px">${i.TEXT}</p>`;
                if(i.TYPE === "LINK") box.innerHTML += `<div class="sw-links"><a href="${i.LINK}" style="font-size:${i.SIZE}px; color:${i.COLOR}">${i.TEXT}</a></div>`;
                if(i.TYPE === "BUTTON") box.innerHTML += `<a class="sw-btn" href="${i.LINK}">${i.TEXT}</a>`;
                if(i.TYPE === "SOCIAL") box.innerHTML += `<a href="${i.LINK}" style="color:${i.COLOR}; font-size:${i.SIZE}px">${i.TEXT}</a>`;
                if(i.TYPE === "BOTTOM") { box.innerText = i.TEXT; box.style.color = i.COLOR; }
            });
        }

    } catch (e) { console.error("Sync Error:", e); }
}

init();
</script>
</body>
</html>
