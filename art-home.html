<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sainiwalaa - Yellow Line Wheel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --amz-blue: #131921; --amz-orange: #ff9900; --bg: #f4f7f9; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); overflow-x: hidden; }

        header { background: var(--amz-blue); padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        #menu a { color: white; text-decoration: none; margin-left: 12px; font-size: 12px; font-weight: 600; }

        /* --- HERO SECTION --- */
        #hero-sainiwalaa {
            position: relative; padding: 60px 20px;
            background: radial-gradient(circle at center, #5d0f16, #1a0507);
            overflow: hidden; color: #fff; min-height: 520px;
            display: flex; align-items: center; justify-content: center;
        }

        /* --- ASLI YELLOW LINE WHEEL --- */
        .wheel-box {
            position: absolute; width: 550px; height: 550px;
            right: -100px; top: 50%; transform: translateY(-50%);
            z-index: 1; pointer-events: none;
        }

        .spinning-wheel {
            position: relative; width: 100%; height: 100%;
            border: 6px solid #ff9900; /* Yellow/Orange Main Line */
            border-radius: 50%;
            background: rgba(255, 153, 0, 0.05);
            box-shadow: 0 0 30px rgba(255, 153, 0, 0.3), inset 0 0 50px rgba(255, 153, 0, 0.2);
            animation: rotateFull 25s linear infinite;
        }

        /* Dots on the line to make it look like a real wheel */
        .spinning-wheel::before {
            content: ''; position: absolute; inset: -15px;
            border: 2px dotted #ff9900; border-radius: 50%; opacity: 0.5;
        }

        /* Circular Text on the Line */
        .wheel-svg-text {
            position: absolute; inset: -30px; /* Line ke thoda upar text */
            width: calc(100% + 60px); height: calc(100% + 60px);
        }

        .wheel-svg-text text {
            fill: #ff9900; font-size: 16px; font-weight: 800;
            letter-spacing: 6px; text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255,153,0,0.5);
        }

        @keyframes rotateFull {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* --- CONTENT --- */
        .hero-wrap { 
            position: relative; z-index: 10; max-width: 1200px; width: 100%;
            margin: auto; display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 20px; align-items: center; 
        }
        
        .hero-left h1 { font-size: 45px; font-weight: 800; color: #f6d27c; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
        .hero-left p { color: #ffe9b0; margin-top: 10px; font-size: 16px; font-weight: 600; }
        
        .slider-frame { 
            width: 100%; max-width: 280px; height: 380px; margin: auto; 
            background: rgba(255,255,255,0.1); backdrop-filter: blur(15px);
            padding: 10px; border-radius: 30px; border: 3px solid rgba(255,255,255,0.3);
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            animation: floatUI 4s ease-in-out infinite;
        }
        @keyframes floatUI { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        .slider-frame img { width: 100%; height: 100%; object-fit: cover; border-radius: 20px; }

        /* PRODUCT LOOK */
        .cat-row { display: flex; overflow-x: auto; padding: 20px; gap: 15px; scrollbar-width: none; }
        .cat-circle { width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--amz-orange); background: #fff; padding: 3px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .cat-circle img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; }
        .p-card { background: white; border-radius: 20px; padding: 15px; text-align: center; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        .p-card img { width: 100%; height: 160px; object-fit: contain; }

        /* MOBILE OPTIMIZATION */
        @media(max-width: 768px) {
            #hero-sainiwalaa { min-height: 550px; }
            .hero-wrap { grid-template-columns: 1fr; text-align: center; }
            .wheel-box { width: 400px; height: 400px; right: -80px; top: 60%; }
            .hero-left h1 { font-size: 32px; }
            .slider-frame { max-width: 220px; height: 300px; }
        }
    </style>
</head>
<body>

<header>
    <div style="font-size: 22px; font-weight: 800; color: #febd69;">SAINIWALAA</div>
    <div id="menu"></div>
</header>

<section id="hero-sainiwalaa">
    <div class="wheel-box">
        <div class="spinning-wheel">
            <svg class="wheel-svg-text" viewBox="0 0 500 500">
                <path id="curve" d="M 250, 250 m -210, 0 a 210,210 0 1,1 420,0 a 210,210 0 1,1 -420,0" fill="none"></path>
                <text>
                    <textPath href="#curve">
                        • WOMEN FASHION • BEST GADGETS • PREMIUM KURTI • HOME DECOR • CREATOR ZONE • 
                    </textPath>
                </text>
            </svg>
        </div>
    </div>

    <div class="hero-wrap">
        <div class="hero-left">
            <h1 id="heroTitle">Sainiwalaa</h1>
            <p id="heroNotice">Loading Premium Offers...</p>
            <div id="heroTags" style="margin-top:20px;"></div>
        </div>
        <div class="slider-frame">
            <img id="heroImg" src="">
        </div>
    </div>
</section>

<div class="cat-row" id="cat-root"></div>
<div class="grid" id="prod-root"></div>

<footer id="sw-footer" style="background:#050b1a; color:#fff; padding:50px 20px; margin-top:40px; border-radius:40px 40px 0 0; border-top:5px solid #ff9900;">
    <div id="sw-marquee" style="margin-bottom:30px;"></div>
    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 30px; text-align: left; max-width: 1000px; margin: auto;">
        <div id="f-left"></div>
        <div id="f-center"></div>
        <div id="f-right"></div>
    </div>
    <div id="sw-bottom" style="text-align:center; margin-top:30px; opacity:0.4; font-size:11px;"></div>
</footer>

<script>
const APIs = [
    "https://script.google.com/macros/s/AKfycbxajNF_583kuHsHZuky-oolW6vumnUtdy6t3OU_Rj94C5aYe8RDxO-qPhHR-0hixzjxuA/exec",
    "https://script.google.com/macros/s/AKfycbwxPgyRuXZPAUgnLBC0vkNx-bCgbOUS2hkrPbQfadwk6pFabK0OOAts_X9fnF9z-z5wLQ/exec",
    "https://script.google.com/macros/s/AKfycbwjpcQVkdSR_eXf5b9fWusK9JMqKBW9sP3Zz5rds4AxvcILAwICp9k89hMQNZ9rN1L1/exec"
];

async function init() {
    try {
        const [h, home, f] = await Promise.all(APIs.map(u => fetch(u).then(r => r.json())));

        // Header & Hero
        h.menu.forEach(m => document.getElementById('menu').innerHTML += `<a href="${m.link}">${m.text}</a>`);
        let s = [];
        h.hero.forEach(i => {
            if(i.type === "TITLE") document.getElementById('heroTitle').innerText = i.text;
            if(i.type === "NOTICE") document.getElementById('heroNotice').innerText = i.text;
            if(i.type === "TAG") document.getElementById('heroTags').innerHTML += `<span style="background:rgba(255,153,0,0.2); border:1px solid #ff9900; padding:5px 12px; border-radius:20px; margin-right:8px; font-size:11px; font-weight:bold;">${i.text}</span>`;
            if(i.type === "SLIDE") s.push(i.image);
        });
        if(s.length) {
            let idx = 0; document.getElementById('heroImg').src = s[0];
            setInterval(() => { idx = (idx+1)%s.length; document.getElementById('heroImg').src = s[idx]; }, 3000);
        }

        // Content
        home.forEach(i => {
            if(i.TYPE === "CAT") {
                document.getElementById('cat-root').innerHTML += `<div class="cat-item" onclick="location.href='${i.LINK}'" style="text-align:center;"><div class="cat-circle"><img src="${i.IMAGE_URL}"></div><p style="font-size:11px; font-weight:700; margin-top:8px;">${i.TITLE}</p></div>`;
            } else if(i.TYPE === "PRODUCT") {
                document.getElementById('prod-root').innerHTML += `<div class="p-card"><img src="${i.IMAGE_URL}"><h5>${i.TITLE}</h5><div style="color:#B12704; font-weight:800; margin:10px 0;">₹${i.PRICE}</div><a href="${i.LINK}" style="background:#131921; color:#fff; text-decoration:none; padding:10px; border-radius:10px; display:block; font-weight:bold;">View Deal</a></div>`;
            }
        });

        // Footer
        if(f.footer) {
            f.footer.forEach(i => {
                let box = i.POSITION === "LEFT" ? document.getElementById("f-left") : i.POSITION === "CENTER" ? document.getElementById("f-center") : i.POSITION === "RIGHT" ? document.getElementById("f-right") : i.POSITION === "BOTTOM" ? document.getElementById("sw-bottom") : document.getElementById("sw-marquee");
                if(i.TYPE === "MARQUEE") box.innerHTML = `<div style="overflow:hidden; white-space:nowrap; color:#ff9900; font-weight:bold;">${i.TEXT}</div>`;
                else if(i.TYPE === "TITLE") box.innerHTML += `<h4 style="color:#ff9900; margin-bottom:12px;">${i.TEXT}</h4>`;
                else if(i.TYPE === "LINK") box.innerHTML += `<a href="${i.LINK}" style="color:#ccc; text-decoration:none; display:block; font-size:13px; margin-bottom:10px;">› ${i.TEXT}</a>`;
                else if(i.TYPE === "BOTTOM") box.innerText = i.TEXT;
            });
        }
    } catch (e) { console.log(e); }
}
init();
</script>
</body>
</html>
