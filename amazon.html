<!DOCTYPE html>
<html lang="hi">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-44P15THF26"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-44P15THF26');

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Amazon Best Deals – Sainiwalaa</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{ --primary:#0f172a; --secondary:#1e293b; --accent:#ff9900; --bg:#f4f6fb; --card:#ffffff; --text:#222; }
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins}
body{background:var(--bg);color:var(--text); overflow-x: hidden;}

/* HEADER */
#main-header{background:#000;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 22px;position:sticky;top:0;z-index:1000;}
#menu a{color:#fff;margin-left:12px;text-decoration:none;font-weight:600; font-size: 13px;}

/* BANNER */
.deals-banner{background:linear-gradient(135deg, var(--primary), var(--secondary)); color:#fff; padding:30px 15px; text-align:center; font-size:24px; font-weight:700;}

/* CATEGORIES BAR (Scrollable on mobile) */
.categories-bar{ 
    display:flex; overflow-x: auto; gap:10px; padding:15px; 
    background:#fff; margin-bottom:5px; box-shadow:0 2px 5px rgba(0,0,0,0.05); 
    scrollbar-width: none; /* Hide scrollbar Firefox */
}
.categories-bar::-webkit-scrollbar { display: none; } /* Hide scrollbar Chrome */

.cat-btn{ 
    padding:8px 20px; border-radius:25px; border:1.5px solid var(--accent); 
    background:#fff; cursor:pointer; font-weight:600; white-space: nowrap; font-size: 13px;
}
.cat-btn.active{ background:var(--accent); color:#000; }

/* PRODUCTS GRID */
.products-grid{ 
    padding:15px; display:grid; 
    grid-template-columns:repeat(2, 1fr); /* Default 2 columns for mobile */
    gap:12px; max-width:1200px; margin:auto; 
}

.card{ 
    background:var(--card); border-radius:12px; overflow:hidden; 
    box-shadow:0 4px 10px rgba(0,0,0,.06); position:relative; 
    transition:.3s; display: flex; flex-direction: column;
}
.card img{ width:100%; height:160px; object-fit:contain; background:#fff; padding:10px; }
.info{padding:12px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between;}
.title{ font-size:12px; font-weight:600; height:34px; overflow:hidden; line-height: 1.4; }
.discount{ color:#e91e63; font-weight:700; margin:8px 0; font-size: 14px; }
.deal-btn{ 
    display:block; background:var(--accent); color:#000; text-decoration:none; 
    text-align:center; padding:8px; border-radius:6px; font-weight:700; font-size: 13px;
}

/* FOOTER */
#sw-footer{ width:100%; background:#050b1a; padding:40px 15px 25px; color:#ffffff; margin-top:40px; border-top: 3px solid var(--accent); }
#sw-marquee{ overflow:hidden; white-space:nowrap; text-align:center; margin-bottom:30px; border-bottom:1px solid rgba(255,255,255,.1); padding-bottom:12px; }
#sw-marquee span{ display:inline-block; animation:sw-scroll 28s linear infinite; font-weight:600; color: var(--accent); }
@keyframes sw-scroll{ from{transform:translateX(100%)} to{transform:translateX(-100%)} }

#sw-inner{ max-width:1200px; margin:auto; display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:35px; }
.sw-col h2{ margin-bottom:15px; font-size:22px; color:var(--accent); }
.sw-links-container a{ display:block; margin:10px 0; color:#fff; text-decoration:none; font-size: 14px; }
.sw-links-container a::before{ content: "› "; color: var(--accent); }

.sw-social-container{ display:flex; gap:12px; margin-top:20px; flex-wrap: wrap; }
.sw-social-container a{ 
    padding: 6px 14px; border: 1px solid rgba(255,153,0,0.5); border-radius: 6px; 
    text-decoration: none; font-weight: 600; font-size: 12px; background: rgba(255,153,0,0.05);
}
#sw-bottom{ text-align:center; margin-top:30px; padding-top:20px; border-top:1px solid rgba(255,255,255,0.1); font-size:12px; opacity:0.6; }

/* TABLET & DESKTOP ADJUSTMENTS */
@media(min-width:769px){
    .products-grid{ grid-template-columns: repeat(4, 1fr); gap: 20px; }
    .card img{ height: 220px; }
    .title { font-size: 14px; height: 40px; }
    .deals-banner { font-size: 32px; padding: 50px 20px; }
}

@media(max-width:768px){ 
    #sw-inner{ text-align:center; } 
    .sw-social-container{ justify-content:center; } 
    .sw-col h2 { border-bottom: 2px solid var(--accent); display: inline-block; padding-bottom: 5px; }
}
</style>
</head>
<body>

<header id="main-header">
  <div style="font-weight:700; font-size:18px; cursor:pointer;" onclick="location.href='index.html'">SAINIWALAA</div>
  <div id="menu"></div>
</header>

<div class="deals-banner" id="siteTitle">Amazon Best Deals</div>
<div class="categories-bar" id="categories-box"></div>

<div class="products-grid" id="products-grid">
    <p style="grid-column: 1/-1; text-align:center; padding:50px;">Fetching Best Deals...</p>
</div>

<footer id="sw-footer">
  <div id="sw-marquee"></div> 
  <div id="sw-inner">
    <div class="sw-col" id="sw-left"></div>
    <div class="sw-col" id="sw-center"></div>
    <div class="sw-col" id="sw-right"></div>
  </div>
  <div id="sw-bottom"></div>
</footer>

<script>
const API_HEADER = "https://script.google.com/macros/s/AKfycbxajNF_583kuHsHZuky-oolW6vumnUtdy6t3OU_Rj94C5aYe8RDxO-qPhHR-0hixzjxuA/exec";
const API_DEALS = "https://script.google.com/macros/s/AKfycbzLaiWevyBr-34R2VZ7zTnwP4yfOJT7SHhA6XY8k85pfgzeyI9ad1RTzHnKM7qruuz_MA/exec";
const API_FOOTER = "https://script.google.com/macros/s/AKfycbwjpcQVkdSR_eXf5b9fWusK9JMqKBW9sP3Zz5rds4AxvcILAwICp9k89hMQNZ9rN1L1/exec";

// Header Load
fetch(API_HEADER).then(r=>r.json()).then(d=>{
  const menuBox = document.getElementById('menu');
  d.menu.forEach(m=> menuBox.innerHTML+=`<a href="${m.link}">${m.text}</a>`);
});

// Amazon Deals Load
fetch(API_DEALS).then(r=>r.json()).then(data => {
  const s = data.settings;
  const ALL_PRODUCTS = data.products;
  if(s.SITE_TITLE) document.getElementById("siteTitle").innerText = s.SITE_TITLE;
  
  const box = document.getElementById("categories-box");
  const cats = [...new Set(ALL_PRODUCTS.map(p=>p.CATEGORY))];
  box.innerHTML = cats.map((c,i)=> `<button class="cat-btn ${i===0?'active':''}" onclick="filterCat('${c}', this)">${c}</button>`).join('');

  window.filterCat = (cat, btn) => {
    document.querySelectorAll(".cat-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    const filtered = ALL_PRODUCTS.filter(p=>p.CATEGORY===cat);
    document.getElementById("products-grid").innerHTML = filtered.map(x=> `
      <div class="card">
        <img src="${x.IMAGE || 'https://via.placeholder.com/300'}" loading="lazy">
        <div class="info">
          <div class="title">${x.NAME}</div>
          <div class="discount">🔥 ${x.DISCOUNT}% OFF</div>
          <a class="deal-btn" href="${x.LINK}" target="_blank">View Deal</a>
        </div>
      </div>`).join('');
  };
  // Default Load
  if(cats.length) filterCat(cats[0], box.firstChild);
});

// Footer Load
fetch(API_FOOTER).then(r=>r.json()).then(d=>{
  if(!d.footer) return;
  d.footer.forEach(i=>{
    let box = i.POSITION==="LEFT"?document.getElementById("sw-left"):i.POSITION==="CENTER"?document.getElementById("sw-center"):i.POSITION==="RIGHT"?document.getElementById("sw-right"):i.POSITION==="BOTTOM"?document.getElementById("sw-bottom"):document.getElementById("sw-marquee");

    if(i.TYPE==="MARQUEE"){
      box.innerHTML = `<span>${i.TEXT}</span>`;
    }
    else if(i.TYPE==="TITLE") box.innerHTML+=`<h2 style="color:${i.COLOR}; margin-bottom:15px;">${i.TEXT}</h2>`;
    else if(i.TYPE==="TEXT") box.innerHTML+=`<p style="color:${i.COLOR}; font-size:14px; opacity:0.8; margin-bottom:10px;">${i.TEXT}</p>`;
    else if(i.TYPE==="LINK") box.innerHTML+=`<div class="sw-links-container"><a href="${i.LINK}" style="color:${i.COLOR}">${i.TEXT}</a></div>`;
    else if(i.TYPE==="SOCIAL"){
      let sCont = box.querySelector('.sw-social-container') || box.insertAdjacentElement('beforeend', Object.assign(document.createElement('div'), {className:'sw-social-container'}));
      sCont.innerHTML += `<a href="${i.LINK}" style="color:${i.COLOR}; border-color:${i.COLOR}">${i.TEXT}</a>`;
    }
    else if(i.TYPE==="BOTTOM") box.innerText = i.TEXT;
  });
});
</script>
</body>
</html>
