<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sainiwalaa – Trusted Online Shopping & Deals</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins}
body{background:#f8fafc;color:#111}

/* ================= HEADER ================= */
#main-header{
  background:#000;
  color:#fff;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 22px;
}
#menu a{
  color:#fff;
  margin-left:18px;
  text-decoration:none;
  font-weight:600;
}

/* ================= HERO ================= */
#hero-sainiwalaa{
  background:linear-gradient(135deg,#4b0f14,#7a1f26);
  padding:60px 20px;
}
.hero-wrap{
  max-width:1200px;
  margin:auto;
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:40px;
  align-items:center;
}
.hero-left h1{
  color:#f6d27c;
  font-size:42px;
}
.hero-left p{
  color:#ffe9b0;
  margin-top:10px;
}
.cats{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:20px;
}
.catbox{
  background:#fff6e1;
  color:#5a1a1f;
  padding:10px 16px;
  border-radius:20px;
  font-weight:700;
}

/* HERO IMAGE FIX */
.slider-frame{
  max-width:260px;
  height:360px;
  margin-left:auto;
  background:#fff6e1;
  padding:6px;
  border-radius:22px;
  box-shadow:0 14px 30px rgba(0,0,0,.45);
  opacity:0;               /* 🔥 hide initially */
  transition:opacity .6s;
}
.slider-frame.show{opacity:1}
.slider-frame img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:16px;
}

/* ================= HOME PAGE ================= */
.section{padding:20px}
.categories{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:16px;
}
.cat{
  background:#fff;
  border-radius:14px;
  padding:12px;
  text-align:center;
  box-shadow:0 6px 18px rgba(0,0,0,.08);
}
.cat img{
  width:100%;
  height:130px;
  object-fit:cover;
  border-radius:10px;
}

/* MOBILE */
@media(max-width:768px){
  .hero-wrap{grid-template-columns:1fr;text-align:center}
  .slider-frame{margin:30px auto 0}
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->
<div id="main-header">
  <div style="font-weight:700">SAINIWALAA</div>
  <div id="menu"></div>
</div>

<!-- ================= HERO ================= -->
<section id="hero-sainiwalaa">
  <div class="hero-wrap">
    <div class="hero-left">
      <h1 id="heroTitle"></h1>
      <p id="heroNotice"></p>
      <div class="cats" id="heroTags"></div>
    </div>

    <div class="slider-frame" id="heroFrame">
      <img id="heroImg">
    </div>
  </div>
</section>

<!-- ================= HOME PAGE ================= -->
<div class="section">
  <h2>🛍️ Shop by Category</h2>
  <div class="categories" id="categories"></div>
</div>

<!-- ================= FOOTER ================= -->
<div id="footer"></div>

<script>
/* ===== HEADER + HERO API ===== */
fetch("https://script.google.com/macros/s/AKfycbxajNF_583kuHsHZuky-oolW6vumnUtdy6t3OU_Rj94C5aYe8RDxO-qPhHR-0hixzjxuA/exec")
.then(r=>r.json())
.then(d=>{

  /* MENU */
  d.menu.forEach(m=>{
    menu.innerHTML+=`<a href="${m.link}">${m.text}</a>`;
  });

  /* HERO */
  let slides=[];
  d.hero.forEach(h=>{
    if(h.type==="TITLE") heroTitle.innerText=h.text;
    if(h.type==="NOTICE") heroNotice.innerText=h.text;
    if(h.type==="TAG") heroTags.innerHTML+=`<div class="catbox">${h.text}</div>`;
    if(h.type==="SLIDE") slides.push(h.image);
  });

  /* HERO SLIDER FIX */
  let i=0;
  if(slides.length){
    heroImg.src=slides[0];
    heroImg.onload=()=>heroFrame.classList.add("show");
    setInterval(()=>{
      i=(i+1)%slides.length;
      heroImg.src=slides[i];
    },3000);
  }
});

/* ===== FOOTER ===== */
fetch("footer.html")
.then(r=>r.text())
.then(d=>footer.innerHTML=d);
</script>

</body>
</html>
