<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Best Deals – Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f5f5}
    header{background:#111;color:#fff;padding:10px 20px}
    nav a{color:#fff;text-decoration:none;margin-right:15px;font-weight:bold}
    nav a:hover{color:#ffcc00}

    .hero{background:#fff;padding:20px;text-align:center}
    .hero h1{margin:10px 0}
    .tags{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
    .tag{background:#222;color:#fff;padding:6px 12px;border-radius:20px;font-size:14px}

    .slider{display:flex;overflow-x:auto;gap:10px;padding:15px}
    .slider img{height:220px;border-radius:10px}

    .notice{background:#ffeb3b;padding:10px;font-weight:bold;margin:10px}

    footer{background:#111;color:#fff;text-align:center;padding:15px;margin-top:30px}
  </style>
</head>

<body>

<!-- HEADER -->
<header>
  <nav id="menu">
    Loading menu...
  </nav>
</header>

<!-- HERO -->
<section class="hero">
  <h1 id="hero-title">Loading...</h1>

  <div class="tags" id="hero-tags"></div>

  <div class="notice" id="hero-notice" style="display:none"></div>

  <div class="slider" id="hero-slider"></div>
</section>

<!-- FOOTER -->
<div id="footer"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxajNF_583kuHsHZuky-oolW6vumnUtdy6t3OU_Rj94C5aYe8RDxO-qPhHR-0hixzjxuA/exec";

fetch(API_URL)
.then(res => res.json())
.then(data => {

  /* ===== MENU ===== */
  const menuBox = document.getElementById("menu");
  menuBox.innerHTML = "";

  data.menu.forEach(m=>{
    if(m.SHOW === "YES"){
      const a = document.createElement("a");
      a.href = m.LINK;
      a.innerText = m.TEXT;
      menuBox.appendChild(a);
    }
  });

  /* ===== HERO ===== */
  const titleEl  = document.getElementById("hero-title");
  const tagsEl   = document.getElementById("hero-tags");
  const sliderEl = document.getElementById("hero-slider");
  const noticeEl = document.getElementById("hero-notice");

  tagsEl.innerHTML = "";
  sliderEl.innerHTML = "";

  data.hero.forEach(h=>{
    if(h.SHOW !== "YES") return;

    if(h.TYPE === "TITLE"){
      titleEl.innerText = h.TEXT;
    }

    if(h.TYPE === "TAG"){
      const d = document.createElement("div");
      d.className = "tag";
      d.innerText = h.TEXT;
      tagsEl.appendChild(d);
    }

    if(h.TYPE === "SLIDE"){
      const img = document.createElement("img");
      img.src = h.IMAGE;
      sliderEl.appendChild(img);
    }

    if(h.TYPE === "NOTICE"){
      noticeEl.style.display = "block";
      noticeEl.innerText = h.TEXT;
    }
  });

})
.catch(err=>{
  console.error("API Error:", err);
});
</script>

<script>
/* ===== FOOTER (DOM SAFE) ===== */
document.addEventListener("DOMContentLoaded", ()=>{
  const f = document.getElementById("footer");
  f.innerHTML = `
    <footer>
      <p>© 2026 Best Deals Site</p>
      <p>Powered by Google Sheets API</p>
    </footer>
  `;
});
</script>

</body>
</html>
