<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Sainiwalaa</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>

<!-- HEADER + HERO -->
<div id="headerHero"></div>

<script>
fetch("header-hero.html")
.then(r => r.text())
.then(html => {
  document.getElementById("headerHero").innerHTML = html;

  const js = document.createElement("script");
  js.src = "header-hero.js";
  document.body.appendChild(js);
});
</script>

<!-- PAGE CONTENT -->
<div style="padding:40px;text-align:center">
  <h2>Welcome to Sainiwalaa</h2>
  <p>Trusted Shopping & Custom Prints</p>
</div>

<!-- FOOTER -->
<div id="footer"></div>
<script>
fetch("footer.html")
.then(r=>r.text())
.then(d=>document.getElementById("footer").innerHTML=d);
</script>

</body>
</html>
