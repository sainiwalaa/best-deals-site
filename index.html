<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sainiwalaa – Trusted Online Shopping</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --accent:#ff9800;
  --dark:#0b1220;
  --card:#ffffff;
  --bg:#f4f6fb;
}
body{margin:0;font-family:Poppins,sans-serif;background:var(--bg)}
a{text-decoration:none;color:inherit}

/* HEADER */
header{
  background:linear-gradient(90deg,#131921,#232f3e);
  color:#fff;
  padding:16px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
nav a{
  margin:0 10px;
  font-weight:600;
  color:#fff;
}

/* HERO */
#hero{
  position:relative;
  height:260px;
  overflow:hidden;
}
.hero-slide{
  position:absolute;inset:0;display:none;
}
.hero-slide img{
  width:100%;height:100%;object-fit:cover;
}
.hero-text{
  position:absolute;
  bottom:20px;left:20px;right:20px;
  background:rgba(0,0,0,.6);
  color:#fff;
  padding:14px;border-radius:12px;
}

/* SECTION */
.section{padding:20px}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:16px;
}
.card{
  background:#fff;
  border-radius:14px;
  box-shadow:0 6px 18px rgba(0,0,0,.12);
  overflow:hidden;
  text-align:center;
}
.card img{width:100%;height:160px;object-fit:cover}

/* FOOTER */
footer{
  background:#050b1a;
  color:#fff;
  padding:30px 20px;
  text-align:center;
}
</style>
</head>

<body>

<header>
  <div><b>SAINIWALAA</b></div>
  <nav id="menu"></nav>
</header>

<!-- HERO -->
<div id="hero"></div>

<!-- HOME CONTENT -->
<div class="section">
  <h2>🛍️ Shop by Category</h2>
  <div class="grid" id="homeCats"></div>
</div>

<!-- FOOTER -->
<footer id="footerBox">Loading…</footer>

<script>
/* HEADER + HERO API */
const HEADER_API="https://script.google.com/macros/s/AKfycbzbtre2vlUi_moOGrVQ0dsNs3duKbY4B233Tp9KHmbXWffuG8nQ3MBRyvyCyr893NZpBA/exec";
const FOOTER_API="https://script.google.com/macros/s/AKfycbwjpcQVkdSR_eXf5b9fWusK9JMqKBW9sP3Zz5rds4AxvcILAwICp9k89hMQNZ9rN1L1/exec";

/* HEADER + HERO */
fetch(HEADER_API).then(r=>r.json()).then(d=>{
  /* MENU */
  document.getElementById("menu").innerHTML =
    d.menu.filter(x=>x.SHOW==="YES")
    .map(x=>`<a href="${x.LINK}">${x.TEXT}</a>`).join("");

  /* HERO */
  const hero=document.getElementById("hero");
  let i=0;
  d.hero.filter(x=>x.SHOW==="YES").forEach((h,idx)=>{
    hero.innerHTML+=`
      <div class="hero-slide">
        <img src="${h.IMAGE}">
        <div class="hero-text">
          <h2>${h.TEXT||""}</h2>
        </div>
      </div>`;
  });
  const slides=document.querySelectorAll(".hero-slide");
  if(slides.length){
    slides[0].style.display="block";
    setInterval(()=>{
      slides[i].style.display="none";
      i=(i+1)%slides.length;
      slides[i].style.display="block";
    },3500);
  }
});

/* FOOTER */
fetch(FOOTER_API).then(r=>r.json()).then(d=>{
  document.getElementById("footerBox").innerHTML =
    d.footer.map(x=>x.TEXT).join(" • ");
});
</script>

</body>
</html>
