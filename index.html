<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sainiwalaa – Best Deals</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins}
body{background:#f4f6fb;color:#111}

/* HEADER */
#sw-header{
  background:linear-gradient(90deg,#131921,#232f3e);
  color:#fff;
  padding:16px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
#sw-logo{font-size:22px;font-weight:700}
#sw-menu a{
  color:#fff;
  margin-left:18px;
  text-decoration:none;
  font-weight:600;
}

/* HERO */
#sw-hero{
  position:relative;
  height:340px;
  overflow:hidden;
}
.sw-slide{
  position:absolute;
  inset:0;
  display:none;
}
.sw-slide img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.sw-hero-box{
  position:absolute;
  bottom:30px;
  left:30px;
  background:rgba(0,0,0,.6);
  color:#fff;
  padding:22px;
  border-radius:14px;
}
.sw-hero-box h2{margin:0 0 6px}
.sw-hero-box a{
  display:inline-block;
  margin-top:10px;
  background:#ff9900;
  color:#000;
  padding:10px 20px;
  border-radius:8px;
  text-decoration:none;
  font-weight:700;
}

/* CONTENT */
.section{
  max-width:1200px;
  margin:auto;
  padding:30px 20px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}
.card{
  background:#fff;
  border-radius:14px;
  box-shadow:0 6px 18px rgba(0,0,0,.1);
  overflow:hidden;
}
.card img{width:100%;height:200px;object-fit:cover}
.card p{text-align:center;padding:14px;font-weight:600}

/* FOOTER */
#sw-footer{
  background:#0b1730;
  color:#fff;
  padding:40px 20px;
  margin-top:40px;
}
#sw-footer-inner{
  max-width:1200px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:30px;
}
#sw-footer a{color:#ff9800;text-decoration:none}
#sw-bottom{
  text-align:center;
  margin-top:20px;
  opacity:.7;
  font-size:14px;
}
</style>
</head>

<body>

<!-- HEADER -->
<header id="sw-header">
  <div id="sw-logo">SAINIWALAA</div>
  <nav id="sw-menu"></nav>
</header>

<!-- HERO -->
<section id="sw-hero"></section>

<!-- HOME CONTENT -->
<section class="section">
  <h2 style="margin-bottom:16px">Shop by Category</h2>
  <div class="grid">
    <div class="card">
      <img src="https://images.meesho.com/images/products/670916392/qsxhk.jpg">
      <p>Amazon Deals</p>
    </div>
    <div class="card">
      <img src="https://images.meesho.com/images/products/673609531/tyb6c.jpg">
      <p>Jaipur Kurtis</p>
    </div>
    <div class="card">
      <img src="https://images.meesho.com/images/products/646948595/xz1w4.jpg">
      <p>Custom Prints</p>
    </div>
  </div>
</section>

<!-- FOOTER -->
<footer id="sw-footer">
  <div id="sw-footer-inner">
    <div id="sw-left"></div>
    <div id="sw-center"></div>
    <div id="sw-right"></div>
  </div>
  <div id="sw-bottom"></div>
</footer>

<script>
/* HEADER + HERO API */
const HEADER_API="https://script.google.com/macros/s/AKfycbzbtre2vlUi_moOGrVQ0dsNs3duKbY4B233Tp9KHmbXWffuG8nQ3MBRyvyCyr893NZpBA/exec";

fetch(HEADER_API)
.then(r=>r.json())
.then(d=>{
  /* MENU */
  d.menu.forEach(m=>{
    if(m.SHOW==="YES"){
      document.getElementById("sw-menu").innerHTML+=
        `<a href="${m.LINK}">${m.TEXT}</a>`;
    }
  });

  /* HERO */
  const hero=document.getElementById("sw-hero");
  d.hero.forEach(h=>{
    if(h.SHOW==="YES"){
      hero.innerHTML+=`
      <div class="sw-slide">
        <img src="${h.IMAGE}">
        <div class="sw-hero-box">
          <h2>${h.TITLE||""}</h2>
          <p>${h.TAG||""}</p>
        </div>
      </div>`;
    }
  });

  const slides=document.querySelectorAll(".sw-slide");
  let i=0;
  if(slides.length){
    slides[0].style.display="block";
    setInterval(()=>{
      slides[i].style.display="none";
      i=(i+1)%slides.length;
      slides[i].style.display="block";
    },3500);
  }
});

/* FOOTER API */
const FOOTER_API="https://script.google.com/macros/s/AKfycbwjpcQVkdSR_eXf5b9fWusK9JMqKBW9sP3Zz5rds4AxvcILAwICp9k89hMQNZ9rN1L1/exec";

fetch(FOOTER_API)
.then(r=>r.json())
.then(d=>{
  d.footer.forEach(i=>{
    const box =
      i.POSITION==="LEFT"?sw-left:
      i.POSITION==="CENTER"?sw-center:
      i.POSITION==="RIGHT"?sw-right:
      sw-bottom;

    if(i.TYPE==="TITLE") box.innerHTML+=`<h3>${i.TEXT}</h3>`;
    if(i.TYPE==="TEXT") box.innerHTML+=`<p>${i.TEXT}</p>`;
    if(i.TYPE==="LINK") box.innerHTML+=`<p><a href="${i.LINK}">${i.TEXT}</a></p>`;
    if(i.TYPE==="BOTTOM") box.innerText=i.TEXT;
  });
});
</script>

</body>
</html>
