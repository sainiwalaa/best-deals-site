<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sainiwalaa – Best Deals & Jaipur Kurtis</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --accent:#ff9800;
  --bg:#f5f7fb;
  --card:#fff;
  --dark:#0f172a;
}
*{box-sizing:border-box;margin:0;font-family:Poppins}
body{background:var(--bg);color:#111}

/* HEADER */
header{
  background:linear-gradient(90deg,#131921,#232f3e);
  color:#fff;
  padding:14px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
header h1{font-size:22px}

/* MENU */
nav{
  background:#fff;
  display:flex;
  gap:16px;
  padding:12px;
  overflow-x:auto;
}
nav a{
  white-space:nowrap;
  text-decoration:none;
  font-weight:600;
  color:#111;
}

/* HERO */
#hero{
  position:relative;
  height:260px;
  background:#ddd;
  border-radius:16px;
  margin:16px;
  overflow:hidden;
}
.hero-slide{
  position:absolute;
  inset:0;
  opacity:0;
  transition:.5s;
}
.hero-slide.active{opacity:1}
.hero-slide img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.hero-text{
  position:absolute;
  bottom:16px;
  left:16px;
  right:16px;
  background:rgba(0,0,0,.55);
  color:#fff;
  padding:12px;
  border-radius:12px;
}

/* SECTION */
.section{padding:20px}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:14px;
}
.card{
  background:var(--card);
  border-radius:14px;
  padding:10px;
  text-align:center;
  box-shadow:0 6px 14px rgba(0,0,0,.1);
}
.card img{
  width:100%;
  height:140px;
  object-fit:cover;
  border-radius:10px;
  background:#eee;
}

/* FOOTER */
footer{
  background:#0b1220;
  color:#fff;
  padding:30px 16px;
  text-align:center;
  margin-top:30px;
}
footer a{color:#ff9800;text-decoration:none;font-weight:600}
</style>
</head>

<body>

<header>
  <h1>SAINIWALAA</h1>
  <div>🔥 Deals</div>
</header>

<nav id="menu">
  <!-- menu fallback -->
  <a href="index.html">🏠 Home</a>
</nav>

<div id="hero">
  <!-- hero fallback -->
</div>

<div class="section">
  <h2>🛍 Categories</h2>
  <div class="grid" id="categories"></div>
</div>

<footer id="footer">
  © 2026 Sainiwalaa • Trusted Online Store
</footer>

<script>
/* ========= SAFE FETCH ========= */
function safeFetch(url, cb){
  fetch(url).then(r=>r.json()).then(cb).catch(e=>{
    console.warn("API error:",e);
  });
}

/* ========= MENU + HERO ========= */
safeFetch(
"https://script.google.com/macros/s/AKfycbxajNF_583kuHsHZuky-oolW6vumnUtdy6t3OU_Rj94C5aYe8RDxO-qPhHR-0hixzjxuA/exec",
d=>{
  /* MENU */
  if(d.menu){
    const m=document.getElementById("menu");
    m.innerHTML="";
    d.menu.forEach(i=>{
      if(i.SHOW==="YES")
        m.innerHTML+=`<a href="${i.LINK}">${i.TEXT}</a>`;
    });
  }

  /* HERO */
  if(d.hero){
    const h=document.getElementById("hero");
    h.innerHTML="";
    let i=0;
    d.hero.forEach(x=>{
      if(x.SHOW==="YES"){
        h.innerHTML+=`
        <div class="hero-slide ${i==0?'active':''}">
          <img loading="lazy" src="${x.IMAGE}">
          <div class="hero-text">${x.TITLE||""}</div>
        </div>`;
        i++;
      }
    });
    let s=0,slides=document.querySelectorAll(".hero-slide");
    if(slides.length>1){
      setInterval(()=>{
        slides[s].classList.remove("active");
        s=(s+1)%slides.length;
        slides[s].classList.add("active");
      },3000);
    }
  }
});

/* ========= CATEGORIES ========= */
safeFetch(
"https://script.google.com/macros/s/AKfycbw36GYkYHmCWmCooX04kIBbXYoAvyFC-3WkP8zLGCa96ArhalMssxPgd6svBvqy3NFA/exec",
d=>{
  if(!d.categories) return;
  const c=document.getElementById("categories");
  d.categories.forEach(x=>{
    c.innerHTML+=`
    <div class="card" onclick="location.href='${x.PAGE_LINK||"#"}'">
      <img loading="lazy" src="${x.IMAGE}">
      <p>${x.NAME||x.TEXT}</p>
    </div>`;
  });
});

/* ========= FOOTER (ALWAYS LOAD) ========= */
safeFetch(
"https://script.google.com/macros/s/AKfycbwjpcQVkdSR_eXf5b9fWusK9JMqKBW9sP3Zz5rds4AxvcILAwICp9k89hMQNZ9rN1L1/exec",
d=>{
  if(!d.footer) return;
  const f=document.getElementById("footer");
  f.innerHTML="";
  d.footer.forEach(i=>{
    f.innerHTML+=`<div>${i.TEXT}</div>`;
  });
});
</script>

</body>
</html>
