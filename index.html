<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sainiwalaa – Premium Shopping 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet">

    <style>
        :root { 
            --amz-orange: #ff9900; --bg: #eaeded; --accent: #febd69; --dark: #131921;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: #111; overflow-x: hidden; }

        /* --- HEADER --- */
        #main-header { background: #000; color: #fff; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        #logo { font-weight: 900; font-size: 22px; color: var(--accent); text-decoration: none; letter-spacing: 1px; }
        #menu { display: flex; gap: 12px; }
        #menu a { color: #fff; text-decoration: none; font-weight: 600; font-size: 13px; }

        /* --- HERO SECTION --- */
        #hero-sainiwalaa { position: relative; background: #080d17; padding: 40px 20px; overflow: hidden; display: flex; align-items: center; min-height: 400px; }
        .hero-wrap { max-width: 1200px; margin: auto; display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 20px; align-items: center; position: relative; z-index: 10; width: 100%; }
        .hero-left h1 { font-size: clamp(28px, 6vw, 50px); font-weight: 900; line-height: 1.1; color: #fff; margin-bottom: 15px; }
        .hero-left p { color: #ffe9b0; font-size: 15px; border-left: 4px solid var(--amz-orange); padding-left: 15px; margin-bottom: 20px; }
        
        .slider-frame { width: 100%; max-width: 260px; height: 350px; margin: auto; border-radius: 20px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.1); }
        .slider-frame img { width: 100%; height: 100%; object-fit: cover; }

        /* --- BANNER SLIDER (FULL WIDTH & RESPONSIVE) --- */
        .banner-container { width: 100%; padding: 10px 0; background: var(--bg); }
        .banner-frame { width: 95%; max-width: 1200px; height: auto; aspect-ratio: 16/7; margin: auto; border-radius: 15px; overflow: hidden; position: relative; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        #banner-root { display: flex; height: 100%; transition: transform 0.6s ease-in-out; }
        .banner-slide { min-width: 100%; height: 100%; }
        .banner-slide img { width: 100%; height: 100%; object-fit: cover; }

        /* --- CATEGORIES --- */
        .cat-row { display: flex; overflow-x: auto; padding: 20px 10px; gap: 15px; scrollbar-width: none; }
        .cat-row::-webkit-scrollbar { display: none; }
        .cat-item { text-align: center; min-width: 85px; }
        .cat-circle { width: 70px; height: 70px; border-radius: 50%; border: 2.5px solid var(--amz-orange); background: #fff; margin: 0 auto; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .cat-circle img { width: 100%; height: 100%; object-fit: cover; }
        .cat-item p { font-size: 11px; font-weight: 700; margin-top: 8px; color: #333; }

        /* --- PRODUCT GRID --- */
        .section-head { padding: 20px 15px 10px; font-weight: 800; font-size: 20px; color: var(--dark); border-bottom: 2px solid #ddd; margin: 0 15px 15px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 15px 20px; max-width: 1200px; margin: auto; }
        .p-card { background: #fff; border-radius: 12px; padding: 12px; text-align: center; border: 1px solid #eee; transition: 0.3s; }
        .p-card img { width: 100%; height: 140px; object-fit: contain; margin-bottom: 10px; }
        .p-card h4 { font-size: 13px; font-weight: 600; color: #444; height: 38px; overflow: hidden; line-height: 1.3; }
        .p-price { color: #B12704; font-size: 18px; font-weight: 800; margin: 8px 0; }
        .btn { background: linear-gradient(180deg, #f7dfa1, #f0c14b); border: 1px solid #a88734; border-radius: 7px; padding: 8px; display: block; text-decoration: none; color: #111; font-weight: 700; font-size: 13px; }

        /* --- FOOTER --- */
        #sw-footer { background: #050b1a; color: #fff; padding: 40px 20px; margin-top: 30px; border-top: 4px solid var(--amz-orange); }
        #sw-inner { max-width: 1200px; margin: auto; display: grid; grid-template-columns: 1fr; gap: 30px; }
        .sw-col h2 { color: var(--amz-orange); font-size: 18px; margin-bottom: 15px; }
        .sw-links-container a { display: block; margin: 8px 0; color: #bbb; text-decoration: none; font-size: 14px; }
        .sw-social-container { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        .sw-social-container a { padding: 8px 15px; border: 1px solid var(--amz-orange); border-radius: 8px; color: var(--amz-orange) !important; font-size: 12px; text-decoration: none; }
        #sw-bottom { text-align: center; margin-top: 30px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 11px; opacity: 0.6; }

        /* --- MOBILE OPTIMIZATION --- */
        @media(max-width:768px){
            .hero-wrap { grid-template-columns: 1fr; text-align: center; }
            .hero-left p { border-left: none; border-top: 3px solid var(--amz-orange); padding: 10px 0 0; }
            .slider-frame { max-width: 200px; height: 280px; }
            .banner-frame { aspect-ratio: 16/9; }
        }
        #loader { position: fixed; inset: 0; background: #fff; z-index: 9999; display: flex; align-items: center; justify-content: center; font-weight: 900; }
    </style>
</head>
<body>

<div id="loader">SAINIWALAA...</div>

<header id="main-header">
    <a href="index.html" id="logo">SAINIWALAA</a>
    <div id="menu"></div>
</header>

<section id="hero-sainiwalaa">
    <div class="hero-wrap">
        <div class="hero-left">
            <h1 id="heroTitle">Sainiwalaa</h1>
            <p id="heroNotice">Loading Premium Deals...</p>
            <div id="heroTags" style="display:flex; gap:10px; flex-wrap:wrap;"></div>
        </div>
        <div class="slider-frame"><img id="heroImg" alt="Offer"></div>
    </div>
</section>

<div class="banner-container">
    <div class="banner-frame"><div id="banner-root"></div></div>
</div>

<div class="cat-row" id="cat-root"></div>

<div class="section-head">🔥 Best Deals for You</div>
<div class="grid" id="prod-root"></div>

<footer id="sw-footer">
    <div id="sw-inner">
        <div class="sw-col" id="f-left"></div>
        <div class="sw-col" id="f-center"></div>
        <div class="sw-col" id="f-right"></div>
    </div>
    <div id="sw-bottom"></div>
</footer>

<script>
const APIs = {
    HEAD: "https://script.google.com/macros/s/AKfycbxajNF_583kuHsHZuky-oolW6vumnUtdy6t3OU_Rj94C5aYe8RDxO-qPhHR-0hixzjxuA/exec",
    HOME: "https://script.google.com/macros/s/AKfycbwxPgyRuXZPAUgnLBC0vkNx-bCgbOUS2hkrPbQfadwk6pFabK0OOAts_X9fnF9z-z5wLQ/exec",
    FOOTER: "https://script.google.com/macros/s/AKfycbwjpcQVkdSR_eXf5b9fWusK9JMqKBW9sP3Zz5rds4AxvcILAwICp9k89hMQNZ9rN1L1/exec"
};

async function init() {
    try {
        const [h, home, f] = await Promise.all([
            fetch(APIs.HEAD).then(r => r.json()),
            fetch(APIs.HOME).then(r => r.json()),
            fetch(APIs.FOOTER).then(r => r.json())
        ]);
        
        document.getElementById('loader').style.display = 'none';

        // Header
        h.menu.forEach(m => document.getElementById('menu').innerHTML += `<a href="${m.link}">${m.text}</a>`);
        
        // Hero
        let hSlides = [];
        h.hero.forEach(i => {
            if(i.type === "TITLE") document.getElementById('heroTitle').innerText = i.text;
            if(i.type === "NOTICE") document.getElementById('heroNotice').innerText = i.text;
            if(i.type === "SLIDE") hSlides.push(i.image);
        });
        if(hSlides.length) {
            let hi = 0; document.getElementById('heroImg').src = hSlides[0];
            setInterval(() => { hi = (hi + 1) % hSlides.length; document.getElementById('heroImg').src = hSlides[hi]; }, 3000);
        }

        // Banners
        const bRoot = document.getElementById('banner-root');
        let banners = home.filter(i => i.TYPE === "BANNER");
        banners.forEach(b => { bRoot.innerHTML += `<div class="banner-slide"><img src="${b.IMAGE_URL}"></div>`; });
        if(banners.length > 1) {
            let cb = 0; setInterval(() => {
                cb = (cb + 1) % banners.length;
                bRoot.style.transform = `translateX(-${cb * 100}%)`;
            }, 4000);
        }

        // Categories & Products
        home.forEach(item => {
            if(item.TYPE === "CAT") {
                document.getElementById('cat-root').innerHTML += `<div class="cat-item" onclick="location.href='${item.LINK}'"><div class="cat-circle"><img src="${item.IMAGE_URL}"></div><p>${item.TITLE}</p></div>`;
            }
            if(item.TYPE === "PRODUCT") {
                document.getElementById('prod-root').innerHTML += `<div class="p-card"><img src="${item.IMAGE_URL}"><h4>${item.TITLE}</h4><div class="p-price">₹${item.PRICE}</div><a href="${item.LINK}" class="btn">View Deal</a></div>`;
            }
        });

        // Footer
        f.footer.forEach(i => {
            let box = i.POSITION === "LEFT" ? document.getElementById("f-left") : i.POSITION === "CENTER" ? document.getElementById("f-center") : i.POSITION === "RIGHT" ? document.getElementById("f-right") : document.getElementById("sw-bottom");
            if(i.TYPE === "TITLE") box.innerHTML += `<h2>${i.TEXT}</h2>`;
            else if(i.TYPE === "TEXT") box.innerHTML += `<p style="font-size:13px; color:#bbb; line-height:1.5;">${i.TEXT}</p>`;
            else if(i.TYPE === "LINK") box.innerHTML += `<div class="sw-links-container"><a href="${i.LINK}">${i.TEXT}</a></div>`;
            else if(i.TYPE === "SOCIAL") {
                let sc = box.querySelector('.sw-social-container') || box.insertAdjacentElement('beforeend', Object.assign(document.createElement('div'), {className:'sw-social-container'}));
                sc.innerHTML += `<a href="${i.LINK}">${i.TEXT}</a>`;
            }
            else if(i.TYPE === "BOTTOM") box.innerText = i.TEXT;
        });

    } catch (e) { console.log(e); }
}
init();
</script>
</body>
</html>
