<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sainiwalaa – Premium Shopping & Deals 2026</title>
    <!-- Google Fonts & Remix Icons for Modern Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <style>
        :root { 
            --primary-bg: #0d1117;
            --accent-gold: #ffb703;
            --accent-orange: #fb8500;
            --body-bg: #f8f9fa;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --glass-header: rgba(13, 17, 23, 0.85);
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow-subtle: 0 10px 30px -10px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 20px 40px -15px rgba(0, 0, 0, 0.15);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--body-bg); color: var(--text-dark); overflow-x: hidden; width: 100%; -webkit-tap-highlight-color: transparent; }

        /* --- LOADER --- */
        #loader { 
            position: fixed; inset: 0; background: var(--primary-bg); z-index: 9999; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            color: #fff; font-weight: 700; font-size: 1.2rem; gap: 15px;
        }
        .spinner {
            width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%; border-top-color: var(--accent-orange);
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- HEADER & NAVIGATION --- */
        #main-header { 
            background: var(--glass-header); 
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            color: #fff; 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 16px 32px; 
            position: sticky; top: 0; z-index: 1000; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .brand-logo {
            font-weight: 800; font-size: 24px; letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, var(--accent-gold) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            cursor: pointer; display: flex; align-items: center; gap: 8px;
        }

        .menu-toggle {
            display: none; flex-direction: column; gap: 6px; cursor: pointer; z-index: 1002;
            padding: 4px;
        }
        .menu-toggle span {
            width: 26px; height: 2.5px; background: #fff; border-radius: 4px; transition: var(--transition);
        }

        #menu { display: flex; gap: 28px; align-items: center; }
        #menu a { 
            color: rgba(255, 255, 255, 0.85); text-decoration: none; font-weight: 600; 
            font-size: 14px; white-space: nowrap; transition: var(--transition);
            position: relative; padding: 4px 0;
        }
        #menu a:hover { color: var(--accent-gold); }
        #menu a::after {
            content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 2px;
            background: var(--accent-gold); transition: var(--transition); border-radius: 2px;
        }
        #menu a:hover::after { width: 100%; }

        /* --- HERO SECTION --- */
        #hero-sainiwalaa { 
            position: relative; background: radial-gradient(circle at 10% 20%, #1a2332 0%, #0d1117 90%);
            padding: 80px 24px; overflow: hidden; min-height: 440px; display: flex; align-items: center;
        }
        .bg-animated-text { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
        .float-text { 
            position: absolute; font-weight: 900; font-size: 4.5vw; opacity: 0.03; 
            white-space: nowrap; animation: floatingText 25s linear infinite; color: #fff; letter-spacing: 2px;
        }
        @keyframes floatingText { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        .hero-wrap { 
            max-width: 1200px; margin: auto; display: grid; 
            grid-template-columns: 1.2fr 0.8fr; gap: 40px; align-items: center; 
            position: relative; z-index: 10; width: 100%;
        }
        .hero-left h1 { 
            font-size: clamp(34px, 5vw, 56px); font-weight: 800; color: #fff; line-height: 1.15; margin-bottom: 20px;
            background: linear-gradient(135deg, #ffffff 30%, var(--accent-gold) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .hero-left p { 
            color: rgba(255, 255, 255, 0.8); font-size: 1.05rem;
            border-left: 3px solid var(--accent-orange); padding-left: 18px; line-height: 1.6;
        }

        .cats { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
        .catbox { 
            background: rgba(255, 255, 255, 0.06); padding: 8px 16px; border-radius: 30px; 
            color: var(--accent-gold); font-size: 13px; font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(8px);
            transition: var(--transition);
        }
        .catbox:hover { background: rgba(255,255,255,0.15); transform: translateY(-2px); }

        .slider-frame { 
            width: 100%; max-width: 300px; height: 390px; margin: auto; 
            background: rgba(255, 255, 255, 0.05); padding: 10px; border-radius: 24px; 
            border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: var(--transition);
        }
        .slider-frame:hover { transform: translateY(-5px); }
        .slider-frame img { width: 100%; height: 100%; object-fit: cover; border-radius: 16px; }

        /* --- BANNER CAROUSEL --- */
        .banner-frame { 
            width: 92%; max-width: 1200px; height: 260px; margin: 40px auto 20px; 
            border-radius: var(--radius-lg); overflow: hidden; background: #000; position: relative; 
            box-shadow: var(--shadow-subtle);
        }
        #banner-root { display: flex; height: 100%; transition: transform 0.8s cubic-bezier(0.65, 0, 0.35, 1); }
        .banner-slide { min-width: 100%; height: 100%; }
        .banner-slide img { width: 100%; height: 100%; object-fit: cover; }

        /* --- CATEGORIES CIRCLES --- */
        .cat-row { 
            display: flex; overflow-x: auto; padding: 20px 24px; gap: 24px; 
            scrollbar-width: none; max-width: 1200px; margin: 0 auto; 
        }
        .cat-row::-webkit-scrollbar { display: none; }
        .cat-item { text-align: center; min-width: 90px; cursor: pointer; transition: var(--transition); }
        .cat-item:hover { transform: translateY(-4px); }
        .cat-circle { 
            width: 80px; height: 80px; border-radius: 50%; padding: 3px;
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-gold)); 
            margin: 0 auto 10px; box-shadow: 0 8px 16px rgba(251, 133, 0, 0.15);
        }
        .cat-circle img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; background: #fff; }
        .cat-item p { font-size: 13px; font-weight: 600; color: var(--text-dark); }

        /* --- PRODUCTS GRID --- */
        .section-head { 
            max-width: 1200px; margin: 20px auto 0; padding: 0 24px; 
            font-weight: 800; font-size: 22px; letter-spacing: -0.5px; color: var(--text-dark);
            display: flex; align-items: center; gap: 8px;
        }
        .grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            gap: 20px; padding: 20px 24px 50px; max-width: 1200px; margin: auto; 
        }
        .p-card { 
            background: var(--card-bg); border-radius: var(--radius-md); padding: 16px; 
            display: flex; flex-direction: column; justify-content: space-between;
            border: 1px solid rgba(0,0,0,0.05); box-shadow: var(--shadow-subtle); 
            transition: var(--transition); position: relative; overflow: hidden;
        }
        .p-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-hover); }
        .p-card img { width: 100%; height: 180px; object-fit: contain; margin-bottom: 12px; transition: var(--transition); }
        .p-card:hover img { transform: scale(1.05); }
        .p-card h4 { 
            font-size: 14px; font-weight: 600; color: var(--text-dark); line-height: 1.4;
            height: 40px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; 
        }
        .p-price { color: #d90429; font-size: 22px; font-weight: 800; margin: 10px 0; letter-spacing: -0.5px; }
        .btn { 
            background: linear-gradient(135deg, var(--accent-orange), #e85d04); 
            border: none; border-radius: var(--radius-sm); padding: 12px; text-align: center;
            text-decoration: none; color: #fff; font-weight: 700; font-size: 13px; 
            transition: var(--transition); box-shadow: 0 4px 12px rgba(251, 133, 0, 0.25);
        }
        .btn:hover { opacity: 0.95; box-shadow: 0 6px 16px rgba(251, 133, 0, 0.35); }

        /* --- FOOTER --- */
        #sw-footer { background: var(--primary-bg); color: #fff; padding: 60px 24px 30px; margin-top: 60px; border-top: 3px solid var(--accent-orange); }
        #sw-marquee { overflow: hidden; white-space: nowrap; padding-bottom: 24px; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 40px; }
        #sw-marquee span { display: inline-block; animation: scroll-text 22s linear infinite; color: var(--accent-gold); font-weight: 700; letter-spacing: 1px; }
        @keyframes scroll-text { from { transform: translateX(100%) } to { transform: translateX(-100%) } }
        
        #sw-inner { max-width: 1200px; margin: auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 40px; }
        .sw-col h2 { color: var(--accent-gold); font-size: 20px; font-weight: 700; margin-bottom: 20px; letter-spacing: -0.3px; }
        .sw-col p { opacity: 0.8; font-size: 14px; line-height: 1.6; }
        .sw-links-container a { display: block; margin: 12px 0; color: rgba(255,255,255,0.8); text-decoration: none; font-size: 14px; transition: var(--transition); }
        .sw-links-container a:hover { color: var(--accent-gold); transform: translateX(4px); }
        .sw-social-container { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
        .sw-social-container a { 
            border: 1px solid rgba(255,255,255,0.15); padding: 8px 18px; border-radius: 30px; 
            color: #fff !important; text-decoration: none; font-size: 13px; font-weight: 600;
            background: rgba(255,255,255,0.04); transition: var(--transition);
        }
        .sw-social-container a:hover { background: var(--accent-orange); border-color: var(--accent-orange); }
        #sw-bottom { text-align: center; margin-top: 50px; padding-top: 24px; border-top: 1px solid rgba(255,255,255,0.08); color: rgba(255,255,255,0.5); font-size: 13px; }

        /* --- MOBILE RESPONSIVE DRAWER & BREAKPOINTS --- */
        @media (max-width: 768px) {
            #main-header { padding: 14px 20px; }
            .menu-toggle { display: flex; }
            
            #menu {
                position: fixed; top: 0; right: -100%; width: 80%; height: 100vh;
                background: #111827; flex-direction: column; padding: 100px 30px 40px;
                transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
                box-shadow: -10px 0 30px rgba(0,0,0,0.5); gap: 20px; align-items: flex-start;
                z-index: 1001;
            }

            #menu.active { right: 0; }
            #menu a { font-size: 16px; width: 100%; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 12px; }

            #hero-sainiwalaa { padding: 50px 20px; }
            .hero-wrap { grid-template-columns: 1fr; text-align: center; }
            .hero-left p { border-left: none; border-top: 3px solid var(--accent-orange); padding-left: 0; padding-top: 15px; }
            .cats { justify-content: center; }
            
            .banner-frame { height: 170px; width: 92%; margin: 25px auto; }
            .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 12px 16px 40px; }
            .p-card { padding: 12px; }
            .p-card img { height: 130px; }
            .p-price { font-size: 18px; }
            .section-head { font-size: 18px; padding: 0 16px; }
            #sw-inner { text-align: center; }
            .sw-social-container { justify-content: center; }
        }
    </style>
</head>
<body>

<div id="loader">
    <div class="spinner"></div>
    <span>Sainiwalaa Loading...</span>
</div>

<header id="main-header">
    <div class="brand-logo" onclick="location.href='index.html'">SAINIWALAA</div>
    
    <div class="menu-toggle" id="mobile-menu-btn" aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <nav id="menu"></nav>
</header>

<section id="hero-sainiwalaa">
    <div class="bg-animated-text">
        <div class="float-text" style="top:15%; animation-duration:25s;">JAIPURI KURTIS • DESIGNER SUITS • ETHNIC WEAR</div>
        <div class="float-text" style="top:55%; animation-delay:5s;">NEW ARRIVALS • BEST SELLERS • 2026 DEALS</div>
    </div>
    <div class="hero-wrap">
        <div class="hero-left">
            <h1 id="heroTitle">Sainiwalaa</h1>
            <p id="heroNotice">Connecting you to the best deals...</p>
            <div class="cats" id="heroTags"></div>
        </div>
        <div class="slider-frame"><img id="heroImg" alt="Hero Featured Product"></div>
    </div>
</section>

<div class="banner-frame"><div id="banner-root"></div></div>
<div class="cat-row" id="cat-root"></div>
<div class="section-head"><i class="ri-fire-fill" style="color: var(--accent-orange);"></i> Best Deals For You</div>
<div class="grid" id="prod-root"></div>

<footer id="sw-footer">
    <div id="sw-marquee"></div>
    <div id="sw-inner">
        <div class="sw-col" id="f-left"></div>
        <div class="sw-col" id="f-center"></div>
        <div class="sw-col" id="f-right"></div>
    </div>
    <div id="sw-bottom"></div>
</footer>

<script>
// Mobile Hamburger Drawer Logic
const menuBtn = document.getElementById('mobile-menu-btn');
const navMenu = document.getElementById('menu');

menuBtn.addEventListener('click', () => {
    navMenu.classList.toggle('active');
    const spans = menuBtn.querySelectorAll('span');
    if (navMenu.classList.contains('active')) {
        spans[0].style.transform = 'rotate(45deg) translate(6px, 6px)';
        spans[1].style.opacity = '0';
        spans[2].style.transform = 'rotate(-45deg) translate(6px, -6px)';
    } else {
        spans[0].style.transform = 'none';
        spans[1].style.opacity = '1';
        spans[2].style.transform = 'none';
    }
});

// Close menu when clicking outside
document.addEventListener('click', (e) => {
    if(!menuBtn.contains(e.target) && !navMenu.contains(e.target)) {
        navMenu.classList.remove('active');
        const spans = menuBtn.querySelectorAll('span');
        spans[0].style.transform = 'none';
        spans[1].style.opacity = '1';
        spans[2].style.transform = 'none';
    }
});

const APIs = {
    HEAD: "https://script.google.com/macros/s/AKfycbxajNF_583kuHsHZuky-oolW6vumnUtdy6t3OU_Rj94C5aYe8RDxO-qPhHR-0hixzjxuA/exec",
    HOME: "https://script.google.com/macros/s/AKfycbwxPgyRuXZPAUgnLBC0vkNx-bCgbOUS2hkrPbQfadwk6pFabK0OOAts_X9fnF9z-z5wLQ/exec",
    FOOTER: "https://script.google.com/macros/s/AKfycbwjpcQVkdSR_eXf5b9fWusK9JMqKBW9sP3Zz5rds4AxvcILAwICp9k89hMQNZ9rN1L1/exec"
};

async function init() {
    try {
        const [h, home, f] = await Promise.all([
            fetch(APIs.HEAD).then(r => r.json()),
            fetch(APIs.HOME).then(r => r.json()),
            fetch(APIs.FOOTER).then(r => r.json())
        ]);
        document.getElementById('loader').style.display = 'none';

        h.menu.forEach(m => document.getElementById('menu').innerHTML += `<a href="${m.link}">${m.text}</a>`);
        
        let hSlides = [];
        h.hero.forEach(i => {
            if(i.type === "TITLE") document.getElementById('heroTitle').innerText = i.text;
            if(i.type === "NOTICE") document.getElementById('heroNotice').innerText = i.text;
            if(i.type === "TAG") document.getElementById('heroTags').innerHTML += `<div class="catbox">${i.text}</div>`;
            if(i.type === "SLIDE") hSlides.push(i.image);
        });
        if(hSlides.length) {
            let hi = 0; document.getElementById('heroImg').src = hSlides[0];
            setInterval(() => { hi = (hi + 1) % hSlides.length; document.getElementById('heroImg').src = hSlides[hi]; }, 3000);
        }

        const bRoot = document.getElementById('banner-root');
        let banners = home.filter(i => i.TYPE === "BANNER");
        banners.forEach(b => { bRoot.innerHTML += `<div class="banner-slide"><img src="${b.IMAGE_URL}"></div>`; });
        if(banners.length) {
            let cb = 0; setInterval(() => {
                cb = (cb + 1) % banners.length;
                bRoot.style.transform = `translateX(-${cb * 100}%)`;
            }, 4000);
        }

        home.forEach(item => {
            if(item.TYPE === "CAT") document.getElementById('cat-root').innerHTML += `<div class="cat-item" onclick="location.href='${item.LINK}'"><div class="cat-circle"><img src="${item.IMAGE_URL}"></div><p>${item.TITLE}</p></div>`;
            if(item.TYPE === "PRODUCT") document.getElementById('prod-root').innerHTML += `<div class="p-card"><img src="${item.IMAGE_URL}"><h4>${item.TITLE}</h4><div><div class="p-price">₹${item.PRICE}</div><a href="${item.LINK}" class="btn">View Offer</a></div></div>`;
        });

        f.footer.forEach(i => {
            let box = i.POSITION === "LEFT" ? document.getElementById("f-left") : i.POSITION === "CENTER" ? document.getElementById("f-center") : i.POSITION === "RIGHT" ? document.getElementById("f-right") : i.POSITION === "BOTTOM" ? document.getElementById("sw-bottom") : document.getElementById("sw-marquee");
            if(i.TYPE === "MARQUEE") box.innerHTML = `<span>${i.TEXT}</span>`;
            else if(i.TYPE === "TITLE") box.innerHTML += `<h2>${i.TEXT}</h2>`;
            else if(i.TYPE === "TEXT") box.innerHTML += `<p>${i.TEXT}</p>`;
            else if(i.TYPE === "LINK") box.innerHTML += `<div class="sw-links-container"><a href="${i.LINK}">${i.TEXT}</a></div>`;
            else if(i.TYPE === "SOCIAL") {
                let sc = box.querySelector('.sw-social-container') || box.insertAdjacentElement('beforeend', Object.assign(document.createElement('div'), {className:'sw-social-container'}));
                sc.innerHTML += `<a href="${i.LINK}">${i.TEXT}</a>`;
            }
            else if(i.TYPE === "BOTTOM") box.innerText = i.TEXT;
        });
    } catch (e) { console.log(e); }
}
init();
</script>
</body>
</html>
