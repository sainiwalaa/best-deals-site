<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sainiwalaa – Premium Shopping & Deals 2026</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet">

    <style>
        :root { 
            --amz-blue: #131921; --amz-orange: #ff9900; --bg: #eaeded; 
            --card: #ffffff; --frame-bg: #1a1a1a; --accent: #febd69;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: #111; overflow-x: hidden; width: 100%; }

        /* --- HEADER --- */
        #main-header { background: #000; color: #fff; display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; position: sticky; top: 0; z-index: 1000; height: 60px; }
        #logo { font-weight: 900; font-size: 20px; color: var(--accent); text-decoration: none; letter-spacing: 1px; }
        #menu { display: flex; gap: 10px; }
        #menu a { color: #fff; text-decoration: none; font-weight: 600; font-size: 12px; }

        /* --- HERO SECTION --- */
        #hero-sainiwalaa { 
            position: relative; background: #080d17; padding: 40px 15px; 
            overflow: hidden; display: flex; align-items: center; min-height: 350px;
        }
        .bg-animated-text { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
        .float-text { position: absolute; font-weight: 900; font-size: 7vw; opacity: 0.05; white-space: nowrap; animation: floatingText 20s linear infinite; color: #fff; }
        @keyframes floatingText { from { transform: translateX(100%); } to { transform: translateX(-100%); } }

        .hero-wrap { max-width: 1200px; margin: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: center; position: relative; z-index: 10; width: 100%; }
        .hero-left h1 { font-size: clamp(26px, 5vw, 48px); font-weight: 900; line-height: 1.1; background: linear-gradient(to right, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero-left p { color: #ffe9b0; font-size: 14px; margin: 10px 0; border-left: 3px solid var(--amz-orange); padding-left: 10px; }

        .cats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; }
        .catbox { background: rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 10px; color: #fff; font-weight: 600; font-size: 11px; border: 1px solid rgba(255,255,255,0.1); }

        .slider-frame { width: 100%; max-width: 240px; height: 320px; margin: auto; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .slider-frame img { width: 100%; height: 100%; object-fit: cover; border-radius: 15px; }

        /* --- BANNER (Adjusted Size) --- */
        .banner-frame { width: 95%; max-width: 1100px; height: 180px; margin: 20px auto; border-radius: 12px; overflow: hidden; background: #000; position: relative; border: 1px solid var(--amz-orange); }
        #banner-root { display: flex; height: 100%; transition: transform 0.6s ease-in-out; }
        .banner-slide { min-width: 100%; height: 100%; }
        .banner-slide img { width: 100%; height: 100%; object-fit: cover; }

        /* --- CATEGORIES --- */
        .cat-row { display: flex; overflow-x: auto; padding: 15px; gap: 15px; scrollbar-width: none; }
        .cat-row::-webkit-scrollbar { display: none; }
        .cat-item { text-align: center; min-width: 80px; flex-shrink: 0; }
        .cat-circle { width: 65px; height: 65px; border-radius: 50%; border: 2px solid var(--amz-orange); background: #fff; margin: 0 auto; overflow: hidden; }
        .cat-circle img { width: 100%; height: 100%; object-fit: cover; }
        .cat-item p { font-size: 11px; font-weight: 700; margin-top: 8px; }

        /* --- PRODUCTS GRID --- */
        .section-head { padding: 15px 15px 5px; font-weight: 800; font-size: 18px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 12px; max-width: 1200px; margin: auto; }
        .p-card { background: white; border-radius: 12px; padding: 12px; text-align: center; border: 1px solid #eee; display: flex; flex-direction: column; }
        .p-card img { width: 100%; height: 140px; object-fit: contain; margin-bottom: 8px; }
        .p-card h4 { font-size: 13px; font-weight: 600; height: 38px; overflow: hidden; }
        .p-price { color: #B12704; font-size: 18px; font-weight: 800; margin: 8px 0; }
        .btn { background: linear-gradient(to bottom, #f7dfa1, #f0c14b); border: 1px solid #a88734; border-radius: 8px; padding: 8px; text-decoration: none; color: #111; font-weight: 700; font-size: 13px; margin-top: auto; }

        /* --- FOOTER --- */
        #sw-footer { background: #050b1a; color: #fff; padding: 40px 20px; margin-top: 40px; border-top: 4px solid var(--amz-orange); }
        #sw-marquee { overflow: hidden; white-space: nowrap; padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 25px; }
        #sw-marquee span { display: inline-block; animation: scroll-text 15s linear infinite; color: var(--amz-orange); font-weight: 700; }
        @keyframes scroll-text { from { transform: translateX(100%) } to { transform: translateX(-100%) } }

        #sw-inner { display: grid; grid-template-columns: 1fr; gap: 30px; text-align: center; }
        .sw-col h2 { color: var(--amz-orange); font-size: 20px; margin-bottom: 15px; }
        .sw-links-container a { display: block; margin: 8px 0; color: #ccc; text-decoration: none; font-size: 14px; }
        .sw-social-container { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 15px; }
        .sw-social-container a { text-decoration: none; padding: 6px 15px; border: 1px solid var(--amz-orange); border-radius: 8px; color: var(--amz-orange) !important; font-size: 12px; }
        #sw-bottom { text-align: center; margin-top: 30px; font-size: 11px; opacity: .5; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }

        /* --- LOADER --- */
        #loader { position: fixed; inset: 0; background: #fff; z-index: 9999; display: flex; align-items: center; justify-content: center; font-weight: bold; }

        /* --- MOBILE ADJUSTMENTS --- */
        @media(max-width:768px){
            .hero-wrap { grid-template-columns: 1fr; text-align: center; }
            .slider-frame { max-width: 180px; height: 260px; }
            .banner-frame { height: 140px; }
            #sw-inner { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div id="loader">Sainiwalaa Loading...</div>

<header id="main-header">
    <a href="index.html" id="logo">SAINIWALAA</a>
    <div id="menu"></div>
</header>

<section id="hero-sainiwalaa">
    <div class="bg-animated-text">
        <div class="float-text" style="top:15%;">BEST DEALS • SAINIWALAA • 2026</div>
        <div class="float-text" style="top:60%; animation-delay:2s;">SHOP NOW • BIG SAVINGS</div>
    </div>
    <div class="hero-wrap">
        <div class="hero-left">
            <h1 id="heroTitle">Sainiwalaa</h1>
            <p id="heroNotice">Connecting you to premium deals...</p>
            <div class="cats" id="heroTags"></div>
        </div>
        <div class="slider-frame"><img id="heroImg" alt="Main Offer"></div>
    </div>
</section>

<div class="banner-frame"><div id="banner-root"></div></div>
<div class="cat-row" id="cat-root"></div>
<div class="section-head">🔥 Best Offers Today</div>
<div class="grid" id="prod-root"></div>

<footer id="sw-footer">
    <div id="sw-marquee"></div>
    <div id="sw-inner">
        <div class="sw-col" id="f-left"></div>
        <div class="sw-col" id="f-center"></div>
        <div class="sw-col" id="f-right"></div>
    </div>
    <div id="sw-bottom"></div>
</footer>

<script>
const APIs = {
    HEAD: "https://script.google.com/macros/s/AKfycbxajNF_583kuHsHZuky-oolW6vumnUtdy6t3OU_Rj94C5aYe8RDxO-qPhHR-0hixzjxuA/exec",
    HOME: "https://script.google.com/macros/s/AKfycbwxPgyRuXZPAUgnLBC0vkNx-bCgbOUS2hkrPbQfadwk6pFabK0OOAts_X9fnF9z-z5wLQ/exec",
    FOOTER: "https://script.google.com/macros/s/AKfycbwjpcQVkdSR_eXf5b9fWusK9JMqKBW9sP3Zz5rds4AxvcILAwICp9k89hMQNZ9rN1L1/exec"
};

async function init() {
    try {
        const [h, home, f] = await Promise.all([
            fetch(APIs.HEAD).then(r => r.json()),
            fetch(APIs.HOME).then(r => r.json()),
            fetch(APIs.FOOTER).then(r => r.json())
        ]);
        
        document.getElementById('loader').style.display = 'none';

        // Header Menu
        h.menu.forEach(m => document.getElementById('menu').innerHTML += `<a href="${m.link}">${m.text}</a>`);
        
        // Hero Content
        let hSlides = [];
        h.hero.forEach(i => {
            if(i.type === "TITLE") document.getElementById('heroTitle').innerText = i.text;
            if(i.type === "NOTICE") document.getElementById('heroNotice').innerText = i.text;
            if(i.type === "TAG") document.getElementById('heroTags').innerHTML += `<div class="catbox">${i.text}</div>`;
            if(i.type === "SLIDE") hSlides.push(i.image);
        });
        if(hSlides.length) {
            let hi = 0; document.getElementById('heroImg').src = hSlides[0];
            setInterval(() => { hi = (hi + 1) % hSlides.length; document.getElementById('heroImg').src = hSlides[hi]; }, 3500);
        }

        // Banner Slideshow
        const bRoot = document.getElementById('banner-root');
        let banners = home.filter(i => i.TYPE === "BANNER");
        banners.forEach(b => { bRoot.innerHTML += `<div class="banner-slide"><img src="${b.IMAGE_URL}" loading="lazy"></div>`; });
        if(banners.length > 1) {
            let cb = 0; setInterval(() => {
                cb = (cb + 1) % banners.length;
                bRoot.style.transform = `translateX(-${cb * 100}%)`;
            }, 5000);
        }

        // Categories & Products
        home.forEach(item => {
            if(item.TYPE === "CAT") {
                document.getElementById('cat-root').innerHTML += `<div class="cat-item" onclick="location.href='${item.LINK}'"><div class="cat-circle"><img src="${item.IMAGE_URL}" loading="lazy"></div><p>${item.TITLE}</p></div>`;
            }
            if(item.TYPE === "PRODUCT") {
                document.getElementById('prod-root').innerHTML += `<div class="p-card"><img src="${item.IMAGE_URL}" loading="lazy"><h4>${item.TITLE}</h4><div class="p-price">₹${item.PRICE}</div><a href="${item.LINK}" class="btn">View Offer</a></div>`;
            }
        });

        // Footer Content
        f.footer.forEach(i => {
            let box = i.POSITION === "LEFT" ? document.getElementById("f-left") : i.POSITION === "CENTER" ? document.getElementById("f-center") : i.POSITION === "RIGHT" ? document.getElementById("f-right") : i.POSITION === "BOTTOM" ? document.getElementById("sw-bottom") : document.getElementById("sw-marquee");
            if(i.TYPE === "MARQUEE") box.innerHTML = `<span>${i.TEXT}</span>`;
            else if(i.TYPE === "TITLE") box.innerHTML += `<h2>${i.TEXT}</h2>`;
            else if(i.TYPE === "TEXT") box.innerHTML += `<p>${i.TEXT}</p>`;
            else if(i.TYPE === "LINK") box.innerHTML += `<div class="sw-links-container"><a href="${i.LINK}">${i.TEXT}</a></div>`;
            else if(i.TYPE === "SOCIAL") {
                let sc = box.querySelector('.sw-social-container') || box.insertAdjacentElement('beforeend', Object.assign(document.createElement('div'), {className:'sw-social-container'}));
                sc.innerHTML += `<a href="${i.LINK}">${i.TEXT}</a>`;
            }
            else if(i.TYPE === "BOTTOM") box.innerText = i.TEXT;
        });
    } catch (e) { console.log("Error:", e); }
}
init();
</script>
</body>
</html>
