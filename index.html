<!DOCTYPE html>
<html lang="hi">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-44P15THF26"></script>

  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-44P15THF26');

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="google-site-verification" content="T3of_a7SwHge6KHfW1kJ6CXFHrb24va0-HN67ove-WM" />

<title>Sainiwalaa – Trusted Online Shopping & Deals</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{ --primary:#0f172a; --secondary:#1e293b; --accent:#ff9900; --bg:#f8fafc; --card:#ffffff; --text:#111; }
.dark{ --bg:#0b1220; --card:#111827; --text:#f9fafb; }
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins}
body{background:var(--bg);color:var(--text);transition:.3s}

/* HEADER & HERO */
#main-header{background:#000;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 22px;}
#menu a{color:#fff;margin-left:18px;text-decoration:none;font-weight:600;}
#hero-sainiwalaa{background:linear-gradient(135deg,#4b0f14,#7a1f26);padding:60px 20px;}
.hero-wrap{max-width:1200px;margin:auto;display:grid;grid-template-columns:1.2fr 0.8fr;gap:40px;align-items:center;}
.hero-left h1{color:#f6d27c;font-size:42px}
.hero-left p{color:#ffe9b0;margin-top:10px}
.cats{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
.catbox{background:#fff6e1;color:#5a1a1f;padding:10px 16px;border-radius:20px;font-weight:700}
.slider-frame{max-width:260px;height:360px;margin-left:auto;background:#fff6e1;padding:6px;border-radius:22px;}
.slider-frame img{width:100%;height:100%;object-fit:cover;border-radius:16px}

/* HOME CONTENT */
.toggle{background:var(--accent);color:#000;padding:6px 12px;border-radius:20px;cursor:pointer;position:fixed;bottom:20px;right:20px;z-index:100;}
.marquee{background:var(--accent);color:#000;padding:10px;overflow:hidden;white-space:nowrap;font-weight:600}
.marquee span{display:inline-block;animation:scroll 14s linear infinite}
@keyframes scroll{ from{transform:translateX(100%)} to{transform:translateX(-100%)} }
.countdown{text-align:center;padding:12px;font-weight:700;background:var(--card);margin:12px;border-radius:12px}
.slider{position:relative;height:260px;overflow:hidden}
.slide{position:absolute;inset:0;display:none}
.slide img{width:100%;height:100%;object-fit:cover}
.slide-content{position:absolute;bottom:16px;left:16px;right:16px;background:rgba(0,0,0,.55);padding:14px;border-radius:12px;color:#fff}
.slide-content a{display:inline-block;margin-top:8px;background:var(--accent);padding:8px 16px;color:#000;font-weight:700;text-decoration:none}
.section{padding:20px}
.categories{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.cat{background:var(--card);border-radius:14px;padding:12px;text-align:center;cursor:pointer}
.cat img{width:100%;height:130px;object-fit:cover;border-radius:10px}
.banner img{width:100%;border-radius:14px;margin:14px 0}

/* FOOTER CSS */
#sw-footer{ width:100%; background:linear-gradient(180deg,#050b1a,#0b1730); padding:50px 20px 25px; color:#ffffff; margin-top:50px; }
#sw-marquee{ overflow:hidden; white-space:nowrap; text-align:center; margin-bottom:30px; border-bottom:1px solid rgba(255,255,255,.1); padding-bottom:12px; }
#sw-marquee span{ display:inline-block; animation:sw-scroll 28s linear infinite; font-weight:600; }
@keyframes sw-scroll{ from{transform:translateX(100%)} to{transform:translateX(-100%)} }
#sw-inner{ max-width:1200px; margin:auto; display:grid; grid-template-columns:1fr 1fr 1fr; gap:40px; }
.sw-col h2{ margin:0 0 15px; font-size:28px; }
.sw-col p{ margin:6px 0; font-size:15px; opacity:.85; line-height:1.6; }
.sw-links-container a{ display:block; margin:8px 0; color:#ffffff; text-decoration:none; font-weight:500; }
.sw-links-container a::before{ content:"› "; color:#ff9800; }
.sw-btn{ display:inline-block; margin-top:15px; padding:10px 24px; background:linear-gradient(90deg,#ff9800,#ff5722); color:#000 !important; border-radius:30px; text-decoration:none; font-weight:700; }
.sw-social-container { margin-top: 15px; display: flex; flex-wrap: wrap; gap: 15px; }
.sw-social-container a{ text-decoration:none; font-weight:700; padding: 5px 10px; border: 1px solid rgba(255,255,255,0.2); border-radius: 5px; }
#sw-bottom{ text-align:center; margin-top:30px; font-size:13px; opacity:.7; border-top:1px solid rgba(255,255,255,.1); padding-top:14px; }
@media(max-width:768px){ #sw-inner{ grid-template-columns:1fr; text-align:center; } .sw-social-container{ justify-content: center; } }
</style>
</head>

<body>

<div id="main-header">
  <div>SAINIWALAA</div>
  <div id="menu"></div>
</div>

<section id="hero-sainiwalaa">
  <div class="hero-wrap">
    <div class="hero-left">
      <h1 id="heroTitle"></h1>
      <p id="heroNotice"></p>
      <div class="cats" id="heroTags"></div>
    </div>
    <div class="slider-frame"><img id="heroImg"></div>
  </div>
</section>

<div class="toggle" onclick="document.body.classList.toggle('dark')">🌙</div>
<div class="marquee"><span id="marqueeText">Loading...</span></div>
<div class="countdown">⏳ Offer Ends In : <span id="timer"></span></div>
<div class="slider" id="slider"></div>

<div class="section">
  <h2>🛍️ Shop by Category</h2>
  <div class="categories" id="categories"></div>
</div>

<div class="section banner" id="banners"></div>

<div id="sw-footer">
  <div id="sw-marquee"></div>
  <div id="sw-inner">
    <div class="sw-col" id="sw-left"></div>
    <div class="sw-col" id="sw-center"></div>
    <div class="sw-col" id="sw-right"></div>
  </div>
  <div id="sw-bottom"></div>
</div>

<script>
const API_HEAD = "https://script.google.com/macros/s/AKfycbxajNF_583kuHsHZuky-oolW6vumnUtdy6t3OU_Rj94C5aYe8RDxO-qPhHR-0hixzjxuA/exec";
const API_HOME = "https://script.google.com/macros/s/AKfycbw36GYkYHmCWmCooX04kIBbXYoAvyFC-3WkP8zLGCa96ArhalMssxPgd6svBvqy3NFA/exec";
const FOOTER_API = "https://script.google.com/macros/s/AKfycbwjpcQVkdSR_eXf5b9fWusK9JMqKBW9sP3Zz5rds4AxvcILAwICp9k89hMQNZ9rN1L1/exec";

// Header & Hero Logic
fetch(API_HEAD).then(r=>r.json()).then(d=>{
  d.menu.forEach(m=> document.getElementById('menu').innerHTML+=`<a href="${m.link}">${m.text}</a>`);
  let slides=[];
  d.hero.forEach(h=>{
    if(h.type==="TITLE") document.getElementById('heroTitle').innerText=h.text;
    if(h.type==="NOTICE") document.getElementById('heroNotice').innerText=h.text;
    if(h.type==="TAG") document.getElementById('heroTags').innerHTML+=`<div class="catbox">${h.text}</div>`;
    if(h.type==="SLIDE") slides.push(h.image);
  });
  if(slides.length){
    let i=0; document.getElementById('heroImg').src=slides[0];
    setInterval(()=>{i=(i+1)%slides.length;document.getElementById('heroImg').src=slides[i]},3000);
  }
});

// Home Content Logic
fetch(API_HOME).then(r=>r.json()).then(d=>{
  document.getElementById('marqueeText').innerText=d.marquee.map(x=>x.TEXT).join(" | ");
  d.hero.forEach(x=>{
    document.getElementById('slider').innerHTML+=`<div class="slide"><img src="${x.IMAGE_URL}"><div class="slide-content"><h3>${x.TITLE||""}</h3><p>${x.SUB_TITLE||""}</p>${x.BUTTON_TEXT?`<a href="${x.BUTTON_LINK}">${x.BUTTON_TEXT}</a>`:""}</div></div>`;
  });
  let s=document.querySelectorAll(".slide"),j=0;
  if(s.length){s[0].style.display="block"; setInterval(()=>{s[j].style.display="none";j=(j+1)%s.length;s[j].style.display="block"},3500);}
  d.categories.forEach(x=> document.getElementById('categories').innerHTML+=`<div class="cat" onclick="location.href='${x.PAGE_LINK}'"><img src="${x.IMAGE}"><p>${x.NAME}</p></div>`);
  d.banners.forEach(x=> document.getElementById('banners').innerHTML+=`<a href="${x.LINK}"><img src="${x.IMAGE_URL}"></a>`);
});

// Footer Logic
fetch(FOOTER_API).then(r=>r.json()).then(d=>{
  if(!d.footer) return;
  d.footer.forEach(i=>{
    let box = i.POSITION==="LEFT" ? document.getElementById("sw-left") : i.POSITION==="CENTER" ? document.getElementById("sw-center") : i.POSITION==="RIGHT" ? document.getElementById("sw-right") : i.POSITION==="BOTTOM" ? document.getElementById("sw-bottom") : document.getElementById("sw-marquee");
    if(i.TYPE==="MARQUEE") box.innerHTML=`<span style="color:${i.COLOR};font-size:${i.SIZE}px">${i.TEXT}</span>`;
    else if(i.TYPE==="TITLE") box.innerHTML+=`<h2 style="color:${i.COLOR}">${i.TEXT}</h2>`;
    else if(i.TYPE==="TEXT") box.innerHTML+=`<p style="color:${i.COLOR};font-size:${i.SIZE}px">${i.TEXT}</p>`;
    else if(i.TYPE==="LINK") box.innerHTML+=`<div class="sw-links-container"><a href="${i.LINK}" style="font-size:${i.SIZE}px;color:${i.COLOR}">${i.TEXT}</a></div>`;
    else if(i.TYPE==="BUTTON") box.innerHTML+=`<a class="sw-btn" href="${i.LINK}">${i.TEXT}</a>`;
    else if(i.TYPE==="SOCIAL"){
      let socialCont = box.querySelector('.sw-social-container') || box.insertAdjacentElement('beforeend', Object.assign(document.createElement('div'), {className:'sw-social-container'}));
      socialCont.innerHTML+=`<a href="${i.LINK}" style="color:${i.COLOR};font-size:${i.SIZE}px">${i.TEXT}</a>`;
    }
    else if(i.TYPE==="BOTTOM") { box.innerText=i.TEXT; box.style.color=i.COLOR; }
  });
});

// Simple Timer
let t=3600*3;
setInterval(()=>{
  let h=Math.floor(t/3600), m=Math.floor((t%3600)/60), s=t%60;
  document.getElementById('timer').innerText=`${h}h ${m}m ${s}s`;
  t--;
},1000);
</script>
</body>
</html>
