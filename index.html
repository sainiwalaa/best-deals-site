<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sainiwalaa – Trusted Online Shopping & Deals</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#0f172a;
  --secondary:#1e293b;
  --accent:#ff9900;
  --bg:#f8fafc;
  --card:#ffffff;
  --text:#111;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins}

body{
  background:var(--bg);
  color:var(--text);
}

/* ================= HEADER ================= */
header{
  background:linear-gradient(90deg,#131921,#232f3e);
  color:#fff;
  padding:16px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:22px;
  font-weight:700;
}

/* ================= MARQUEE ================= */
.marquee{
  background:var(--accent);
  color:#000;
  padding:10px;
  overflow:hidden;
  white-space:nowrap;
  font-weight:600;
}
.marquee span{
  display:inline-block;
  animation:scroll 14s linear infinite;
}
@keyframes scroll{
  from{transform:translateX(100%)}
  to{transform:translateX(-100%)}
}

/* ================= COUNTDOWN ================= */
.countdown{
  text-align:center;
  padding:12px;
  font-weight:700;
  background:var(--card);
  margin:12px;
  border-radius:12px;
  box-shadow:0 6px 18px rgba(0,0,0,.1);
}
.countdown span{color:var(--accent)}

/* ================= HERO SLIDER ================= */
.slider{
  position:relative;
  height:260px;
  overflow:hidden;
}
.slide{
  position:absolute;
  inset:0;
  display:none;
}
.slide img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.slide-content{
  position:absolute;
  bottom:16px;
  left:16px;
  right:16px;
  background:rgba(0,0,0,.55);
  padding:14px;
  border-radius:12px;
  color:#fff;
}

/* 🔥 FIX: hide slider until image loaded */
.slider.hidden{opacity:0}
.slider.show{opacity:1;transition:opacity .6s ease}

/* ================= SECTIONS ================= */
.section{padding:20px}
.section h2{margin-bottom:14px}

/* ================= CATEGORIES ================= */
.categories{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:16px;
}
.cat{
  background:var(--card);
  border-radius:14px;
  padding:12px;
  text-align:center;
  cursor:pointer;
  box-shadow:0 6px 18px rgba(0,0,0,.08);
}
.cat img{
  width:100%;
  height:130px;
  object-fit:cover;
  border-radius:10px;
}
.cat p{margin-top:10px;font-weight:600}

/* ================= BANNERS ================= */
.banner img{
  width:100%;
  border-radius:14px;
  margin:14px 0;
  box-shadow:0 6px 18px rgba(0,0,0,.08);
}

/* ================= FOOTER ================= */
#footer-main{
  width:100%;
  background:#0b1730;
  padding:40px 20px;
  color:#fff;
  text-align:center;
}
#footer-main a{color:#ff9800;text-decoration:none;font-weight:600}

/* MOBILE */
@media(max-width:600px){
  .slider{height:220px}
}
</style>
</head>

<body>

<header>SAINIWALAA</header>

<div class="marquee">
  <span id="marqueeText">Loading offers...</span>
</div>

<div class="countdown">
  ⏳ Offer Ends In : <span id="timer">Loading...</span>
</div>

<div class="slider hidden" id="slider"></div>

<div class="section">
  <h2>🛍️ Shop by Category</h2>
  <div class="categories" id="categories"></div>
</div>

<div class="section banner" id="banners"></div>

<!-- ================= FOOTER ================= -->
<div id="footer"></div>

<script>
/* ================= COUNTDOWN ================= */
const endDate = new Date("2026-01-26T23:59:59").getTime();
setInterval(()=>{
  const d=endDate-new Date().getTime();
  if(d<0){timer.innerText="Expired";return;}
  timer.innerText=
    Math.floor(d/36e5)+"h "+
    Math.floor(d/6e4%60)+"m "+
    Math.floor(d/1e3%60)+"s";
},1000);

/* ================= HOME PAGE API ================= */
const API="https://script.google.com/macros/s/AKfycbw36GYkYHmCWmCooX04kIBbXYoAvyFC-3WkP8zLGCa96ArhalMssxPgd6svBvqy3NFA/exec";

fetch(API).then(r=>r.json()).then(d=>{

  /* MARQUEE */
  marqueeText.innerText=d.marquee.map(x=>x.TEXT).join(" | ");

  /* SLIDER */
  const slider=document.getElementById("slider");
  d.hero.forEach(x=>{
    slider.innerHTML+=`
      <div class="slide">
        <img src="${x.IMAGE_URL}">
        <div class="slide-content">
          <h3>${x.TITLE||""}</h3>
          <p>${x.SUB_TITLE||""}</p>
        </div>
      </div>`;
  });

  const slides=document.querySelectorAll(".slide");
  let i=0;
  if(slides.length){
    slides[0].style.display="block";
    slides[0].querySelector("img").onload=()=>{
      slider.classList.remove("hidden");
      slider.classList.add("show");
    };
    setInterval(()=>{
      slides[i].style.display="none";
      i=(i+1)%slides.length;
      slides[i].style.display="block";
    },3500);
  }

  /* CATEGORIES */
  categories.innerHTML="";
  d.categories.forEach(x=>{
    categories.innerHTML+=`
      <div class="cat" onclick="location.href='${x.PAGE_LINK||"#"}'">
        <img src="${x.IMAGE}">
        <p>${x.NAME}</p>
      </div>`;
  });

  /* BANNERS */
  banners.innerHTML="";
  d.banners.forEach(x=>{
    banners.innerHTML+=`
      <a href="${x.LINK||"#"}">
        <img src="${x.IMAGE_URL}">
      </a>`;
  });
});

/* ================= FOOTER LOAD ================= */
fetch("footer.html")
.then(r=>r.text())
.then(d=>{
  footer.innerHTML=d;
});
</script>

</body>
</html>
