<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sainiwalaa – Trusted Online Shopping & Deals</title>
<meta name="description" content="Sainiwalaa par mile Amazon deals, kurti collection, custom mug & t-shirt. Trusted, fast & secure shopping.">
<meta name="keywords" content="Sainiwalaa, Amazon Deals, Kurti, Custom Mug, Online Shopping India">
<meta name="robots" content="index, follow">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#0f172a;
  --secondary:#1e293b;
  --accent:#ff9900;
  --bg:#f8fafc;
  --card:#ffffff;
  --text:#111;
}

.dark{
  --bg:#0b1220;
  --card:#111827;
  --text:#f9fafb;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins}
body{background:var(--bg);color:var(--text);transition:.3s}

/* ================= HEADER ================= */
#main-header{
  background:#000;
  color:#fff;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 22px;
  position: sticky;
  top: 0;
  z-index: 1000;
}
#menu a{
  color:#fff;
  margin-left:18px;
  text-decoration:none;
  font-weight:600;
}

/* ================= HERO ================= */
#hero-sainiwalaa{
  background:linear-gradient(135deg,#4b0f14,#7a1f26);
  padding:60px 20px;
}
.hero-wrap{
  max-width:1200px;
  margin:auto;
  display:grid;
  grid-template-columns:1.2fr 0.8fr;
  gap:40px;
  align-items:center;
}
.hero-left h1{color:#f6d27c;font-size:42px}
.hero-left p{color:#ffe9b0;margin-top:10px}
.cats{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
.catbox{
  background:#fff6e1;color:#5a1a1f;
  padding:10px 16px;border-radius:20px;font-weight:700
}
.slider-frame{
  max-width:260px;height:360px;margin-left:auto;
  background:#fff6e1;padding:6px;border-radius:22px;
}
.slider-frame img{
  width:100%;height:100%;object-fit:cover;border-radius:16px
}

/* ================= HOME PAGE ================= */
.toggle{
  position: fixed; bottom: 20px; right: 20px; z-index: 999;
  background:var(--accent);color:#000;
  padding:10px 15px;border-radius:50px;
  cursor:pointer;font-size:18px;font-weight:600;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}
.marquee{
  background:var(--accent);color:#000;
  padding:10px;overflow:hidden;white-space:nowrap;font-weight:600
}
.marquee span{display:inline-block;animation:scroll 14s linear infinite}
@keyframes scroll{
  from{transform:translateX(100%)}
  to{transform:translateX(-100%)}
}
.countdown{
  text-align:center;padding:12px;font-weight:700;
  background:var(--card);margin:12px;border-radius:12px
}
.countdown span{color:var(--accent)}
.slider{position:relative;height:260px;overflow:hidden}
.slide{position:absolute;inset:0;display:none}
.slide img{width:100%;height:100%;object-fit:cover}
.slide-content{
  position:absolute;bottom:16px;left:16px;right:16px;
  background:rgba(0,0,0,.55);padding:14px;border-radius:12px;color:#fff
}
.slide-content a{
  display:inline-block;margin-top:8px;background:var(--accent);
  padding:8px 16px;color:#000;font-weight:700;text-decoration:none
}
.section{padding:20px; max-width: 1200px; margin: auto;}
.categories{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:16px
}
.cat{
  background:var(--card);border-radius:14px;padding:12px;
  text-align:center;cursor:pointer; transition: 0.3s;
}
.cat:hover{transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1);}
.cat img{width:100%;height:130px;object-fit:cover;border-radius:10px}
.banner img{width:100%;border-radius:14px;margin:14px 0}

/* ================= FOOTER ================= */
#footer-main {
  width:100%;
  background:#0b1730;
  padding:40px 20px;
  color:#fff;
  margin-top: 50px;
}
.footer-grid {
  max-width: 1200px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 30px;
  text-align: left;
}
#footer-main a {
  color: #ff9800; 
  text-decoration: none; 
  display: block; 
  margin: 5px 0;
  font-size: 14px;
}
#footer-bottom {
  text-align: center;
  margin-top: 30px;
  padding-top: 20px;
  border-top: 1px solid #1e293b;
  font-size: 13px;
}

/* MOBILE */
@media(max-width:768px){
  .hero-wrap{grid-template-columns:1fr;text-align:center}
  .slider-frame{margin:30px auto 0}
  .footer-grid { text-align: center; }
}
</style>
</head>

<body>

<div id="main-header">
  <div style="font-weight: 700; font-size: 20px;">SAINIWALAA</div>
  <div id="menu"></div>
</div>

<section id="hero-sainiwalaa">
  <div class="hero-wrap">
    <div class="hero-left">
      <h1 id="heroTitle">Loading...</h1>
      <p id="heroNotice"></p>
      <div class="cats" id="heroTags"></div>
    </div>
    <div class="slider-frame">
      <img id="heroImg" src="https://via.placeholder.com/260x360?text=Sainiwalaa">
    </div>
  </div>
</section>

<div class="toggle" onclick="document.body.classList.toggle('dark')">🌓</div>

<div class="marquee"><span id="marqueeText">Sainiwalaa par aapka swagat hai...</span></div>

<div class="countdown">⏳ Offer Ends In : <span id="timer">00:00:00</span></div>

<div class="slider" id="slider"></div>

<div class="section">
  <h2>🛍️ Shop by Category</h2>
  <div class="categories" id="categories"></div>
</div>

<div class="section banner" id="banners"></div>

<footer id="footer-main">
  <div class="footer-grid">
    <div id="footer-left"></div>
    <div id="footer-center"></div>
    <div id="footer-right"></div>
  </div>
  <div id="footer-bottom"></div>
</footer>

<script>
/* Timer Logic (Optional but good to have) */
function startTimer(duration, display) {
    var timer = duration, hours, minutes, seconds;
    setInterval(function () {
        hours = parseInt(timer / 3600, 10);
        minutes = parseInt((timer % 3600) / 60, 10);
        seconds = parseInt(timer % 60, 10);
        display.textContent = hours + "h " + minutes + "m " + seconds + "s";
        if (--timer < 0) timer = duration;
    }, 1000);
}
window.onload = function () { startTimer(3600 * 5, document.querySelector('#timer')); };

/* ===== API 1: HEADER + HERO ===== */
fetch("https://script.google.com/macros/s/AKfycbxajNF_583kuHsHZuky-oolW6vumnUtdy6t3OU_Rj94C5aYe8RDxO-qPhHR-0hixzjxuA/exec")
.then(r=>r.json()).then(d=>{
  const menu = document.getElementById('menu');
  d.menu.forEach(m=>{
    menu.innerHTML+=`<a href="${m.link}">${m.text}</a>`;
  });
  let slides=[];
  d.hero.forEach(h=>{
    if(h.type==="TITLE") document.getElementById('heroTitle').innerText=h.text;
    if(h.type==="NOTICE") document.getElementById('heroNotice').innerText=h.text;
    if(h.type==="TAG") document.getElementById('heroTags').innerHTML+=`<div class="catbox">${h.text}</div>`;
    if(h.type==="SLIDE") slides.push(h.image);
  });
  let i=0;
  if(slides.length){
    document.getElementById('heroImg').src=slides[0];
    setInterval(()=>{i=(i+1)%slides.length; document.getElementById('heroImg').src=slides[i]},3000);
  }
});

/* ===== API 2: HOME CONTENT ===== */
fetch("https://script.google.com/macros/s/AKfycbw36GYkYHmCWmCooX04kIBbXYoAvyFC-3WkP8zLGCa96ArhalMssxPgd6svBvqy3NFA/exec")
.then(r=>r.json()).then(d=>{
  document.getElementById('marqueeText').innerText=d.marquee.map(x=>x.TEXT).join(" | ");
  const slider = document.getElementById('slider');
  d.hero.forEach(x=>{
    slider.innerHTML+=`
    <div class="slide">
      <img src="${x.IMAGE_URL}">
      <div class="slide-content">
        <h3>${x.TITLE||""}</h3>
        <p>${x.SUB_TITLE||""}</p>
        ${x.BUTTON_TEXT?`<a href="${x.BUTTON_LINK}">${x.BUTTON_TEXT}</a>`:""}
      </div>
    </div>`;
  });
  let s=document.querySelectorAll(".slide"),j=0;
  if(s.length){s[0].style.display="block";
    setInterval(()=>{s[j].style.display="none";j=(j+1)%s.length;s[j].style.display="block"},3500);
  }
  d.categories.forEach(x=>{
    document.getElementById('categories').innerHTML+=`
    <div class="cat" onclick="location.href='${x.PAGE_LINK}'">
      <img src="${x.IMAGE}"><p>${x.NAME}</p>
    </div>`;
  });
  d.banners.forEach(x=>{
    document.getElementById('banners').innerHTML+=`<a href="${x.LINK}"><img src="${x.IMAGE_URL}"></a>`;
  });
});

/* ===== API 3: FOOTER (Now Integrated) ===== */
const FOOTER_API="https://script.google.com/macros/s/AKfycbwjpcQVkdSR_eXf5b9fWusK9JMqKBW9sP3Zz5rds4AxvcILAwICp9k89hMQNZ9rN1L1/exec";

fetch(FOOTER_API)
.then(r=>r.json())
.then(d=>{
  if(!d.footer) return;
  d.footer.forEach(i=>{
    let box=
      i.POSITION==="LEFT"?document.getElementById("footer-left"):
      i.POSITION==="CENTER"?document.getElementById("footer-center"):
      i.POSITION==="RIGHT"?document.getElementById("footer-right"):
      document.getElementById("footer-bottom");

    if(i.TYPE==="TEXT"){
      box.innerHTML+=`<p>${i.TEXT}</p>`;
    }
    if(i.TYPE==="LINK"){
      box.innerHTML+=`<a href="${i.LINK}">${i.TEXT}</a>`;
    }
  });
});
</script>

</body>
</html>
