<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sainiwalaa – Premium Experience</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0a0c10;
      --card-bg: rgba(255, 255, 255, 0.04);
      --border-light: rgba(255, 255, 255, 0.08);
      --accent-gold: #ffe082;
      --primary-gradient: linear-gradient(135deg, #180306 0%, #4b0f14 50%, #0a0c10 100%);
      --gold-gradient: linear-gradient(135deg, #ffe082 0%, #ffb300 100%);
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --glass-bg: rgba(10, 12, 16, 0.85);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); overflow-x: hidden; }

    /* HEADER */
    #main-header {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 5%;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid var(--border-light);
    }

    .brand-logo {
      font-family: 'Outfit', sans-serif;
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
      text-transform: uppercase;
    }

    #menu { display: flex; gap: 24px; align-items: center; }
    #menu a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }
    #menu a:hover { color: #ffffff; }

    /* HERO SECTION */
    #hero-sainiwalaa {
      background: var(--primary-gradient);
      position: relative;
      padding: 80px 5% 70px;
      border-bottom: 1px solid var(--border-light);
    }

    .hero-wrap {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 50px;
      align-items: center;
    }

    .notice-wrapper {
      margin-bottom: 20px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 16px;
      border-radius: 30px;
    }
    .notice-tag {
      background: var(--gold-gradient);
      color: #000;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 12px;
      text-transform: uppercase;
    }
    #hero-notice { font-size: 0.9rem; color: var(--text-muted); }

    #hero-title {
      font-family: 'Outfit', sans-serif;
      font-size: 3.2rem;
      font-weight: 900;
      line-height: 1.15;
      margin-bottom: 20px;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #hero-tags { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 25px; }
    .catbox {
      background: var(--card-bg);
      border: 1px solid var(--border-light);
      color: #fff6e1;
      padding: 10px 20px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 0.88rem;
    }

    .slider-frame {
      width: 100%;
      max-width: 300px;
      height: 400px;
      margin-left: auto;
      background: rgba(255, 246, 225, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 10px;
      border-radius: 28px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
    }
    .slider-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 20px;
      display: block;
    }

    @media (max-width: 768px) {
      .hero-wrap { grid-template-columns: 1fr; text-align: center; }
      #hero-title { font-size: 2.2rem; }
      .notice-wrapper, #hero-tags { justify-content: center; }
      .slider-frame { margin: 0 auto; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header id="main-header">
    <div class="brand-logo">SAINIWALAA</div>
    <nav id="menu"></nav>
  </header>

  <!-- HERO SECTION -->
  <section id="hero-sainiwalaa">
    <div class="hero-wrap">
      <div class="hero-left">
        <div class="notice-wrapper">
          <span class="notice-tag">Updates</span>
          <span id="hero-notice">Loading...</span>
        </div>

        <h1 id="hero-title">Sainiwalaa</h1>
        <div id="hero-tags"></div>
      </div>

      <div class="hero-right">
        <div class="slider-frame">
          <img id="sliderImg" src="https://via.placeholder.com/300x400/7a1f26/ffffff?text=Sainiwalaa+Deals" alt="Hero Slide">
        </div>
      </div>
    </div>
  </section>

  <script>
    const API = "https://script.google.com/macros/s/AKfycbxajNF_583kuHsHZuky-oolW6vumnUtdy6t3OU_Rj94C5aYe8RDxO-qPhHR-0hixzjxuA/exec";

    fetch(API)
    .then(res => res.json())
    .then(data => {
      // Header Menu
      const menuBox = document.getElementById("menu");
      if(menuBox && data.menu){
        menuBox.innerHTML = "";
        data.menu.forEach(m => {
          menuBox.innerHTML += `<a href="${m.link}">${m.text}</a>`;
        });
      }

      // Hero Title
      const titleRow = data.hero ? data.hero.find(x => x.type === "TITLE") : null;
      if(titleRow) document.getElementById("hero-title").innerText = titleRow.text;

      // Hero Tags
      const tagBox = document.getElementById("hero-tags");
      if(tagBox && data.hero){
        tagBox.innerHTML = "";
        data.hero.filter(x => x.type === "TAG").forEach(t => {
          tagBox.innerHTML += `<div class="catbox">${t.text}</div>`;
        });
      }

      // Hero Notice
      const noticeRow = data.hero ? data.hero.find(x => x.type === "NOTICE") : null;
      if(noticeRow) document.getElementById("hero-notice").innerText = noticeRow.text;

      // Slider
      if(data.hero) {
        const slides = data.hero.filter(x => x.type === "SLIDE").map(x => x.image);
        let i = 0;
        const img = document.getElementById("sliderImg");
        if(slides.length && img){
          img.src = slides[0];
          setInterval(() => {
            i = (i + 1) % slides.length;
            img.src = slides[i];
          }, 3500);
        }
      }
    })
    .catch(err => {
      console.error("API Fetch Error:", err);
      // FALLBACK MOCK DATA (Gives immediate display if API fails)
      document.getElementById("menu").innerHTML = '<a href="#">Home</a><a href="#">Deals</a><a href="#">About</a>';
      document.getElementById("hero-notice").innerText = "Welcome to Sainiwalaa Official Store!";
      document.getElementById("hero-title").innerText = "Best Tech & Shopping Deals";
      document.getElementById("hero-tags").innerHTML = '<div class="catbox">Electronics</div><div class="catbox">Fashion</div><div class="catbox">Offers</div>';
    });
  </script>
</body>
</html>
