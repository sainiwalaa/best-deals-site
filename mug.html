<!DOCTYPE html>
<html lang="hi">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-44P15THF26"></script>

  function gtag(){dataLayer.push(arguments);}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Personalized Mug Order – Sainiwalaa</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{ --primary:#0f172a; --accent:#e91e63; --bg:#f4f6fb; --card:#ffffff; --text:#222; --footer-bg:#050b1a; }
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins}
body{background:var(--bg);color:var(--text); overflow-x: hidden;}

/* HEADER */
#main-header{background:#000;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 22px;position:sticky;top:0;z-index:1000;}
#menu a{color:#fff;margin-left:12px;text-decoration:none;font-weight:600; font-size: 13px;}

/* PAGE MARQUEE */
.page-marquee{ background:linear-gradient(90deg,#e91e63,#ff5722); color:#fff; padding:10px; font-weight:600; overflow:hidden; font-size: 14px;}
.page-marquee span{ display:inline-block; white-space:nowrap; animation:sw-scroll 22s linear infinite; }
@keyframes sw-scroll{ from{transform:translateX(100%)} to{transform:translateX(-100%)} }

/* MAIN CONTENT WRAPPER */
.wrapper{max-width:1100px;margin:20px auto;padding:0 15px}
.main-grid{display:grid;grid-template-columns:1.1fr 0.9fr;gap:30px}

/* IMAGE GALLERY */
.gallery-main img{ width:100%; border-radius:16px; box-shadow:0 8px 25px rgba(0,0,0,.15); display: block;}
.gallery-thumbs{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:15px; }
.gallery-thumbs img{ width:100%; border-radius:10px; cursor:pointer; opacity:.7; border: 2px solid transparent; transition: 0.3s;}
.gallery-thumbs img:hover{ opacity: 1; border-color: var(--accent); }

/* ORDER FORM */
.order-form{ background:#fff; padding:25px; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,.08); }
.order-form h2{ font-size: 22px; margin-bottom: 5px; text-align: center;}
.price-tag { text-align:center; color:#2e7d32; font-weight:700; margin-bottom: 20px; font-size: 18px; }

label{ display: block; margin-top: 15px; font-size: 13px; font-weight: 600; color: #555; }
input, textarea{ width:100%; padding:12px; border-radius:8px; border:1px solid #ddd; margin-top:5px; font-size: 14px; background: #fafafa; }
input:focus, textarea:focus { border-color: var(--accent); outline: none; background: #fff; }

.order-btn{ width:100%; margin-top:25px; padding:15px; border:none; border-radius:30px; font-weight:700; background:linear-gradient(90deg,#e91e63,#ff5722); color:#fff; cursor:pointer; font-size: 16px; box-shadow: 0 4px 15px rgba(233, 30, 99, 0.3); transition: 0.3s; }
.order-btn:active { transform: scale(0.98); }

/* FOOTER */
#sw-footer{ width:100%; background:var(--footer-bg); padding:50px 20px 25px; color:#ffffff; margin-top:50px; border-top: 3px solid #ff9800;}
#sw-marquee-footer{ overflow:hidden; white-space:nowrap; text-align:center; margin-bottom:30px; border-bottom:1px solid rgba(255,255,255,.1); padding-bottom:12px; }
#sw-marquee-footer span{ display:inline-block; animation:sw-scroll 28s linear infinite; font-weight:600; color: #ff9800; }
#sw-inner{ max-width:1200px; margin:auto; display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:40px; }
.sw-col h2{ margin-bottom:15px; font-size:24px; color:#ff9800; }
.sw-links-container a{ display:block; margin:10px 0; color:#fff; text-decoration:none; font-size:14px; }
.sw-links-container a::before { content: "› "; color: #ff9800; }
.sw-social-container{ display:flex; gap:12px; margin-top:20px; flex-wrap: wrap;}
.sw-social-container a{ padding: 6px 14px; border: 1px solid rgba(255,152,0,0.5); color:#ff9800; border-radius:6px; text-decoration:none; font-weight:bold; font-size:12px; background: rgba(255,152,0,0.05);}
#sw-bottom{ text-align:center; margin-top:30px; padding-top:20px; border-top:1px solid rgba(255,255,255,0.1); font-size:12px; opacity:0.6; }

/* MOBILE RESPONSIVE FIXES */
@media(max-width:768px){
    .main-grid{ grid-template-columns:1fr; gap: 20px; }
    .order-form { padding: 20px; }
    .gallery-main img { border-radius: 12px; }
    #sw-inner { text-align: center; }
    .sw-social-container { justify-content: center; }
    #menu a { margin-left: 8px; font-size: 11px; }
    .order-form h2 { font-size: 20px; }
}
</style>
</head>

<body>

<header id="main-header">
  <div style="font-weight:700; font-size:18px; cursor:pointer;" onclick="location.href='index.html'">SAINIWALAA</div>
  <div id="menu"></div>
</header>

<div class="page-marquee">
  <span>☕ Personalized Photo Mug • Fill All Details Correctly • Valid Mobile & PIN Required • Free Delivery 🚚</span>
</div>

<div class="wrapper">
  <div class="main-grid">
    <div>
      <div class="gallery-main">
        <img id="bigImg" src="https://cdn.shopify.com/s/files/1/0959/2196/3380/files/71uTvmGg7zL._SY879_50bb0859-9870-4e16-8139-f6520c93f5a6.jpg">
      </div>
      <div class="gallery-thumbs">
        <img onclick="document.getElementById('bigImg').src=this.src" src="https://cdn.shopify.com/s/files/1/0959/2196/3380/files/71uTvmGg7zL._SY879_50bb0859-9870-4e16-8139-f6520c93f5a6.jpg">
        <img onclick="document.getElementById('bigImg').src=this.src" src="https://cdn.shopify.com/s/files/1/0959/2196/3380/files/61EmiUve-AL._SX522.jpg">
        <img onclick="document.getElementById('bigImg').src=this.src" src="https://cdn.shopify.com/s/files/1/0959/2196/3380/files/51UBMMrStaL._SX522.jpg">
      </div>
    </div>

    <div class="order-form">
      <h2>Customize Your Mug ☕</h2>
      <p class="price-tag">Only ₹159 • Free Delivery</p>
      
      <label>Full Name</label>
      <input type="text" id="name" placeholder="Enter your name">
      
      <label>Mobile Number</label>
      <input type="tel" id="mobile" maxlength="10" placeholder="10-digit mobile number">
      
      <label>Full Address</label>
      <textarea id="address" rows="2" placeholder="House No, Street, Area..."></textarea>
      
      <label>PIN Code</label>
      <input type="number" id="pin" maxlength="6" placeholder="6-digit area PIN">
      
      <label>Mug Print Text (Optional)</label>
      <textarea id="mugText" rows="2" placeholder="Text you want to print..."></textarea>
      
      <label>Upload Photos (Max 2)</label>
      <input type="file" id="img1" accept="image/*" style="font-size: 12px; margin-bottom: 5px;">
      <input type="file" id="img2" accept="image/*" style="font-size: 12px;">
      
      <button class="order-btn" id="orderBtn" onclick="submitOrder()">Place Order</button>
      
      <div id="error" style="color:red; margin-top:10px; font-size: 13px; text-align: center;"></div>
      <div id="success" style="color:green; margin-top:10px; font-size: 13px; text-align: center;"></div>
    </div>
  </div>
</div>

<footer id="sw-footer">
  <div id="sw-marquee-footer"></div>
  <div id="sw-inner">
    <div class="sw-col" id="sw-left"></div>
    <div class="sw-col" id="sw-center"></div>
    <div class="sw-col" id="sw-right"></div>
  </div>
  <div id="sw-bottom"></div>
</footer>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwbRyMuIB2AnyJhV0f3OW7ZSSlGyT97Tper1N9bOFITFqMCdcoDRCNVuG7nBr28Fe2SJw/exec";
const API_HEADER = "https://script.google.com/macros/s/AKfycbxajNF_583kuHsHZuky-oolW6vumnUtdy6t3OU_Rj94C5aYe8RDxO-qPhHR-0hixzjxuA/exec";
const API_FOOTER = "https://script.google.com/macros/s/AKfycbwjpcQVkdSR_eXf5b9fWusK9JMqKBW9sP3Zz5rds4AxvcILAwICp9k89hMQNZ9rN1L1/exec";

// Header Logic
fetch(API_HEADER).then(r=>r.json()).then(d=>{
  const menuBox = document.getElementById('menu');
  d.menu.forEach(m=> menuBox.innerHTML+=`<a href="${m.link}">${m.text}</a>`);
});

// Footer Logic
fetch(API_FOOTER).then(r=>r.json()).then(d=>{
  if(!d.footer) return;
  d.footer.forEach(i=>{
    let box = i.POSITION==="LEFT"?document.getElementById("sw-left"):i.POSITION==="CENTER"?document.getElementById("sw-center"):i.POSITION==="RIGHT"?document.getElementById("sw-right"):i.POSITION==="BOTTOM"?document.getElementById("sw-bottom"):document.getElementById("sw-marquee-footer");
    
    if(i.TYPE==="MARQUEE") box.innerHTML = `<span>${i.TEXT}</span>`;
    else if(i.TYPE==="TITLE") box.innerHTML += `<h2 style="color:#ff9800; margin-bottom:15px;">${i.TEXT}</h2>`;
    else if(i.TYPE==="TEXT") box.innerHTML += `<p style="font-size:14px; opacity:0.8; margin-bottom:10px;">${i.TEXT}</p>`;
    else if(i.TYPE==="LINK") box.innerHTML += `<div class="sw-links-container"><a href="${i.LINK}">${i.TEXT}</a></div>`;
    else if(i.TYPE==="SOCIAL"){
      let sCont = box.querySelector('.sw-social-container') || box.insertAdjacentElement('beforeend', Object.assign(document.createElement('div'), {className:'sw-social-container'}));
      sCont.innerHTML += `<a href="${i.LINK}">${i.TEXT}</a>`;
    }
    else if(i.TYPE==="BOTTOM") box.innerText = i.TEXT;
  });
});

async function submitOrder(){
  const btn = document.getElementById("orderBtn");
  const err = document.getElementById("error");
  const scs = document.getElementById("success");
  
  // Basic Validation
  if(!document.getElementById("name").value || !document.getElementById("mobile").value){
    err.innerText = "Please fill all required fields!";
    return;
  }

  btn.disabled = true; 
  btn.innerText = "Processing...";
  err.innerText = "";
  
  // Yahan aapka purana script logic kaam karega jo data Google Sheet mein bhejta hai.
  // ... (Submission Logic) ...

  // For Demo:
  setTimeout(() => {
    btn.disabled = false;
    btn.innerText = "Place Order";
    scs.innerText = "Order details submitted successfully!";
  }, 2000);
}
</script>
</body>
</html>
