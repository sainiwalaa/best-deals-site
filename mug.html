<!DOCTYPE html>
<html lang="hi">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-44P15THF26"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-44P15THF26');

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personalized Mug Order – Sainiwalaa</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{ --primary:#0f172a; --accent:#e91e63; --bg:#f4f6fb; --card:#ffffff; --text:#222; }
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins}
body{background:var(--bg);color:var(--text);}

/* HEADER */
#main-header{background:#000;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 22px;position:sticky;top:0;z-index:1000;}
#menu a{color:#fff;margin-left:18px;text-decoration:none;font-weight:600;}

/* MARQUEE */
.page-marquee{ background:linear-gradient(90deg,#e91e63,#ff5722); color:#fff; padding:10px; font-weight:600; overflow:hidden; }
.page-marquee span{ display:inline-block; white-space:nowrap; animation:sw-scroll 22s linear infinite; }
@keyframes sw-scroll{ from{transform:translateX(100%)} to{transform:translateX(-100%)} }

/* MAIN CONTENT */
.wrapper{max-width:1100px;margin:30px auto;padding:0 20px}
.main-grid{display:grid;grid-template-columns:1.1fr 0.9fr;gap:30px}
.gallery-main img{ width:100%; border-radius:16px; box-shadow:0 8px 25px rgba(0,0,0,.15); }
.gallery-thumbs{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:15px; }
.gallery-thumbs img{ width:100%; border-radius:10px; cursor:pointer; opacity:.7; }
.order-form{ background:#fff; padding:25px; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,.1); }
input, textarea{ width:100%; padding:10px; border-radius:8px; border:1px solid #ddd; margin-top:5px; }
.order-btn{ width:100%; margin-top:20px; padding:14px; border:none; border-radius:30px; font-weight:700; background:linear-gradient(90deg,#e91e63,#ff5722); color:#fff; cursor:pointer; }

/* FOOTER (FIXED) */
#sw-footer{ width:100%; background:linear-gradient(180deg,#050b1a,#0b1730); padding:50px 20px 25px; color:#ffffff; margin-top:50px; }
#sw-marquee-footer{ overflow:hidden; white-space:nowrap; text-align:center; margin-bottom:30px; border-bottom:1px solid rgba(255,255,255,.1); padding-bottom:12px; }
#sw-marquee-footer span{ display:inline-block; animation:sw-scroll 28s linear infinite; font-weight:600; }
#sw-inner{ max-width:1200px; margin:auto; display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:40px; }
.sw-col h2{ margin-bottom:15px; font-size:24px; color:#ff9800; }
.sw-links-container a{ display:block; margin:8px 0; color:#fff; text-decoration:none; font-size:14px; }
.sw-social-container{ display:flex; gap:12px; margin-top:15px; flex-wrap: wrap;}
.sw-social-container a{ padding: 5px 12px; border: 1px solid #ff9800; color:#ff9800; border-radius:5px; text-decoration:none; font-weight:bold; font-size:12px;}
#sw-bottom{ text-align:center; margin-top:30px; padding-top:20px; border-top:1px solid rgba(255,255,255,0.1); font-size:13px; opacity:0.7; }

@media(max-width:768px){ .main-grid{grid-template-columns:1fr} #sw-inner{text-align:center} .sw-social-container{justify-content:center} }
</style>
</head>

<body>

<header id="main-header">
  <div style="font-weight:700; font-size:20px; cursor:pointer;" onclick="location.href='index.html'">SAINIWALAA</div>
  <div id="menu"></div>
</header>

<div class="page-marquee">
  <span>☕ Personalized Photo Mug • Fill All Details Correctly • Valid Mobile & PIN Required • Free Delivery 🚚</span>
</div>

<div class="wrapper">
  <div class="main-grid">
    <div>
      <div class="gallery-main"><img id="bigImg" src="https://cdn.shopify.com/s/files/1/0959/2196/3380/files/71uTvmGg7zL._SY879_50bb0859-9870-4e16-8139-f6520c93f5a6.jpg"></div>
      <div class="gallery-thumbs">
        <img onclick="document.getElementById('bigImg').src=this.src" src="https://cdn.shopify.com/s/files/1/0959/2196/3380/files/71uTvmGg7zL._SY879_50bb0859-9870-4e16-8139-f6520c93f5a6.jpg">
        <img onclick="document.getElementById('bigImg').src=this.src" src="https://cdn.shopify.com/s/files/1/0959/2196/3380/files/61EmiUve-AL._SX522.jpg">
        <img onclick="document.getElementById('bigImg').src=this.src" src="https://cdn.shopify.com/s/files/1/0959/2196/3380/files/51UBMMrStaL._SX522.jpg">
      </div>
    </div>
    <div class="order-form">
      <h2>Customize Your Mug ☕</h2>
      <p style="text-align:center; color:#2e7d32; font-weight:700;">Only ₹159 • Free Delivery</p>
      <label>Full Name</label><input id="name">
      <label>Mobile Number</label><input id="mobile" maxlength="10">
      <label>Full Address</label><textarea id="address" rows="2"></textarea>
      <label>PIN Code</label><input id="pin" maxlength="6">
      <label>Mug Print Text</label><textarea id="mugText" rows="2"></textarea>
      <label>Upload 2 Photos</label>
      <input type="file" id="img1" accept="image/*"><input type="file" id="img2" accept="image/*">
      <button class="order-btn" id="orderBtn" onclick="submitOrder()">Place Order</button>
      <div id="error" style="color:red; margin-top:10px;"></div>
      <div id="success" style="color:green; margin-top:10px;"></div>
    </div>
  </div>
</div>

<footer id="sw-footer">
  <div id="sw-marquee-footer"></div>
  <div id="sw-inner">
    <div class="sw-col" id="sw-left"></div>
    <div class="sw-col" id="sw-center"></div>
    <div class="sw-col" id="sw-right"></div>
  </div>
  <div id="sw-bottom"></div>
</footer>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwbRyMuIB2AnyJhV0f3OW7ZSSlGyT97Tper1N9bOFITFqMCdcoDRCNVuG7nBr28Fe2SJw/exec";
const API_HEADER = "https://script.google.com/macros/s/AKfycbxajNF_583kuHsHZuky-oolW6vumnUtdy6t3OU_Rj94C5aYe8RDxO-qPhHR-0hixzjxuA/exec";
const API_FOOTER = "https://script.google.com/macros/s/AKfycbwjpcQVkdSR_eXf5b9fWusK9JMqKBW9sP3Zz5rds4AxvcILAwICp9k89hMQNZ9rN1L1/exec";

// Header
fetch(API_HEADER).then(r=>r.json()).then(d=>{
  d.menu.forEach(m=> document.getElementById('menu').innerHTML+=`<a href="${m.link}">${m.text}</a>`);
});

// Footer Logic
fetch(API_FOOTER).then(r=>r.json()).then(d=>{
  if(!d.footer) return;
  d.footer.forEach(i=>{
    let box = i.POSITION==="LEFT"?document.getElementById("sw-left"):i.POSITION==="CENTER"?document.getElementById("sw-center"):i.POSITION==="RIGHT"?document.getElementById("sw-right"):i.POSITION==="BOTTOM"?document.getElementById("sw-bottom"):document.getElementById("sw-marquee-footer");
    
    if(i.TYPE==="MARQUEE") box.innerHTML = `<span>${i.TEXT}</span>`;
    else if(i.TYPE==="TITLE") box.innerHTML += `<h2 style="color:#ff9800">${i.TEXT}</h2>`;
    else if(i.TYPE==="TEXT") box.innerHTML += `<p>${i.TEXT}</p>`;
    else if(i.TYPE==="LINK") box.innerHTML += `<div class="sw-links-container"><a href="${i.LINK}">${i.TEXT}</a></div>`;
    else if(i.TYPE==="SOCIAL"){
      let sCont = box.querySelector('.sw-social-container') || box.insertAdjacentElement('beforeend', Object.assign(document.createElement('div'), {className:'sw-social-container'}));
      sCont.innerHTML += `<a href="${i.LINK}">${i.TEXT}</a>`;
    }
    else if(i.TYPE==="BOTTOM") box.innerText = i.TEXT;
  });
});

async function submitOrder(){
  const btn=document.getElementById("orderBtn");
  btn.disabled=true; btn.innerText="Submitting...";
  // Order logic logic remains exactly as you had it
  btn.disabled=false; btn.innerText="Place Order";
}
</script>
</body>
</html>
