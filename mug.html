<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personalized Mug Order – Sainiwalaa</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
/* CSS VARIABLES (Sainiwalaa Theme) */
:root{ --primary:#0f172a; --accent:#e91e63; --bg:#f4f6fb; --card:#ffffff; --text:#222; }
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins}
body{background:var(--bg);color:var(--text);}

/* HEADER */
#main-header{background:#000;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 22px;position:sticky;top:0;z-index:1000;}
#menu a{color:#fff;margin-left:18px;text-decoration:none;font-weight:600;}

/* MARQUEE (Page Specific) */
.page-marquee{ background:linear-gradient(90deg,#e91e63,#ff5722); color:#fff; padding:10px; font-weight:600; overflow:hidden; }
.page-marquee span{ display:inline-block; white-space:nowrap; animation:sw-scroll 22s linear infinite; }

/* WRAPPER & MAIN */
.wrapper{max-width:1100px;margin:30px auto;padding:0 20px}
.main-grid{display:grid;grid-template-columns:1.1fr 0.9fr;gap:30px}

/* GALLERY */
.gallery-main img{ width:100%; border-radius:16px; box-shadow:0 8px 25px rgba(0,0,0,.15); }
.gallery-thumbs{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:15px; }
.gallery-thumbs img{ width:100%; border-radius:10px; cursor:pointer; opacity:.7; transition: 0.3s; }
.gallery-thumbs img:hover{ opacity:1; transform: scale(1.05); }

/* ORDER FORM */
.order-form{ background:#fff; padding:25px; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,.1); }
.order-form h2{ text-align:center; color:#e91e63; margin-bottom:5px; }
.price-tag{ text-align:center; color:#2e7d32; font-weight:700; font-size:18px; margin-bottom:20px; }

label{ font-weight:600; font-size:14px; margin-top:12px; display:block; color:#444; }
input, textarea{ width:100%; padding:10px; border-radius:8px; border:1px solid #ddd; margin-top:5px; font-size:14px; }
input:focus{ outline-color: var(--accent); }

.order-btn{ 
    width:100%; margin-top:20px; padding:14px; border:none; border-radius:30px; 
    font-size:16px; font-weight:700; background:linear-gradient(90deg,#e91e63,#ff5722); 
    color:#fff; cursor:pointer; transition: 0.3s;
}
.order-btn:hover{ opacity: 0.9; transform: translateY(-2px); }
.order-btn:disabled{ opacity:.6; cursor:not-allowed; }

#error{color:#d32f2f; margin-top:15px; font-weight:600; text-align:center;}
#success{color:#2e7d32; margin-top:15px; font-weight:600; text-align:center;}

/* FOOTER (Standard) */
#sw-footer{ width:100%; background:#050b1a; padding:50px 20px 25px; color:#ffffff; margin-top:50px; }
#sw-marquee-footer{ overflow:hidden; white-space:nowrap; text-align:center; margin-bottom:30px; border-bottom:1px solid rgba(255,255,255,.1); padding-bottom:12px; }
#sw-marquee-footer span{ display:inline-block; animation:sw-scroll 28s linear infinite; font-weight:600; }
@keyframes sw-scroll{ from{transform:translateX(100%)} to{transform:translateX(-100%)} }
#sw-inner{ max-width:1200px; margin:auto; display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:40px; }
.sw-col h2{ margin-bottom:15px; font-size:22px; color:#ff9800; }
.sw-links a{ display:block; margin:8px 0; color:#fff; text-decoration:none; font-size:14px; }
.sw-social{ display:flex; gap:12px; margin-top:15px; }
.sw-social a{ padding: 5px 12px; border: 1px solid #ff9800; color:#ff9800; border-radius:5px; text-decoration:none; font-size:12px; font-weight:700; }

@media(max-width:768px){ 
    .main-grid{grid-template-columns:1fr} 
    #sw-inner{text-align:center} 
    .sw-social{justify-content:center}
}
</style>
</head>

<body>

<header id="main-header">
  <div style="font-weight:700; font-size:20px; cursor:pointer;" onclick="location.href='index.html'">SAINIWALAA</div>
  <div id="menu"></div>
</header>

<div class="page-marquee">
  <span>☕ Personalized Photo Mug • Use Product Images Below • Fill All Details Correctly • Valid Mobile & PIN Required • Free Delivery 🚚</span>
</div>

<div class="wrapper">
  <div class="main-grid">
    <div>
      <div class="gallery-main">
        <img id="bigImg" src="https://cdn.shopify.com/s/files/1/0959/2196/3380/files/71uTvmGg7zL._SY879_50bb0859-9870-4e16-8139-f6520c93f5a6.jpg">
      </div>
      <div class="gallery-thumbs">
        <img onclick="changeImg(this)" src="https://cdn.shopify.com/s/files/1/0959/2196/3380/files/71uTvmGg7zL._SY879_50bb0859-9870-4e16-8139-f6520c93f5a6.jpg">
        <img onclick="changeImg(this)" src="https://cdn.shopify.com/s/files/1/0959/2196/3380/files/61EmiUve-AL._SX522.jpg">
        <img onclick="changeImg(this)" src="https://cdn.shopify.com/s/files/1/0959/2196/3380/files/51UBMMrStaL._SX522.jpg">
      </div>
    </div>

    <div class="order-form">
      <h2>Customize Your Mug ☕</h2>
      <div class="price-tag">Only ₹159 • Free Delivery</div>

      <label>Full Name</label><input id="name" placeholder="Apna Naam Likhein">
      <label>Mobile Number</label><input id="mobile" maxlength="10" placeholder="10 Digit Number">
      <label>Full Address</label><textarea id="address" rows="2" placeholder="Ghar ka pata, City aur State"></textarea>
      <label>PIN Code</label><input id="pin" maxlength="6" placeholder="Area PIN Code">
      <label>Mug Print Text (Optional)</label><textarea id="mugText" rows="2" placeholder="Jo Mug par likhwana hai"></textarea>

      <label>Upload 2 Photos</label>
      <input type="file" id="img1" accept="image/*">
      <input type="file" id="img2" accept="image/*">

      <button class="order-btn" id="orderBtn" onclick="submitOrder()">Place Your Order</button>

      <div id="error"></div>
      <div id="success"></div>
    </div>
  </div>
</div>

<footer id="sw-footer">
  <div id="sw-marquee-footer"></div>
  <div id="sw-inner">
    <div id="f-left"></div>
    <div id="f-center"></div>
    <div id="f-right"></div>
  </div>
  <div id="sw-bottom" style="text-align:center; margin-top:30px; opacity:0.6; font-size:12px;"></div>
</footer>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwbRyMuIB2AnyJhV0f3OW7ZSSlGyT97Tper1N9bOFITFqMCdcoDRCNVuG7nBr28Fe2SJw/exec";
const API_HEADER = "https://script.google.com/macros/s/AKfycbxajNF_583kuHsHZuky-oolW6vumnUtdy6t3OU_Rj94C5aYe8RDxO-qPhHR-0hixzjxuA/exec";
const API_FOOTER = "https://script.google.com/macros/s/AKfycbwjpcQVkdSR_eXf5b9fWusK9JMqKBW9sP3Zz5rds4AxvcILAwICp9k89hMQNZ9rN1L1/exec";

let submitted=false;

function changeImg(el){ document.getElementById("bigImg").src=el.src; }

// Order Submit Function
async function submitOrder(){
  if(submitted) return;
  const btn=document.getElementById("orderBtn");
  const error=document.getElementById("error");
  const success=document.getElementById("success");
  error.innerText=""; success.innerText="";

  const name=document.getElementById("name").value.trim();
  const mobile=document.getElementById("mobile").value.trim();
  const address=document.getElementById("address").value.trim();
  const pin=document.getElementById("pin").value.trim();
  const mugText=document.getElementById("mugText").value.trim();
  const img1=document.getElementById("img1").files[0];
  const img2=document.getElementById("img2").files[0];

  if(!name||!mobile||!address||!pin||!img1||!img2){
    error.innerText="❌ Sabhi jankari bharna zaroori hai."; return;
  }
  if(!/^[6-9]\d{9}$/.test(mobile)){ error.innerText="❌ Sahi Mobile Number dalein."; return; }

  submitted=true; btn.disabled=true; btn.innerText="Submitting Order...";

  const toBase64=f=>new Promise(r=>{
    const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(f);
  });

  const payload={ name, mobile, address, pin, mugText, image1:await toBase64(img1), image2:await toBase64(img2) };

  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify(payload)});
    const data=await res.json();
    if(data.status==="success"){
      success.innerHTML=`✅ Order Sahi se Ho Gaya!<br>Order ID: <b>${data.orderId}</b>`;
      btn.innerText
