<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Creator Zone - Jaipur Kurti | Sainiwalaa</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #ff0050; --blue: #0095f6; --bg: #ffffff; --text: #262626; }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: var(--text); overflow-x: hidden; }

        /* --- HEADER (Matching your site) --- */
        #main-header { background:#000; color:#fff; display:flex; justify-content:space-between; align-items:center; padding:14px 22px; position:sticky; top:0; z-index:1000; }
        #main-header a { color: #fff; text-decoration: none; font-weight: 700; }

        /* --- CREATOR PROFILE --- */
        .banner { width: 100%; height: 160px; background: #222 url('https://images.unsplash.com/photo-1520006403993-4740f0adbc95?q=80&w=1000') center/cover; }
        
        .profile-section { max-width: 600px; margin: auto; padding: 0 15px; position: relative; }
        .pfp-wrap { position: absolute; top: -50px; left: 15px; }
        .pfp-img { width: 100px; height: 100px; border-radius: 50%; border: 4px solid #fff; background: #eee; object-fit: cover; }
        
        .user-info { margin-top: 55px; }
        .user-info h1 { font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 5px; }
        .blue-tick { width: 18px; height: 18px; background: var(--blue); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; }

        .bio { font-size: 14px; margin: 10px 0; color: #444; line-height: 1.5; }
        .stats { display: flex; gap: 20px; margin: 15px 0; border-top: 1px solid #efefef; border-bottom: 1px solid #efefef; padding: 12px 0; }
        .stats div { text-align: center; flex: 1; font-size: 13px; }
        .stats b { display: block; font-size: 16px; color: #000; }

        /* --- ACTION BUTTONS --- */
        .action-btns { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn { flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-size: 14px; transition: 0.3s; }
        .btn-follow { background: var(--blue); color: #fff; }
        .btn-follow:active { transform: scale(0.95); opacity: 0.8; }
        .btn-msg { background: #efefef; color: #000; }

        /* --- POST CREATION (FOR TEST) --- */
        .create-post { background: #fdf2f5; padding: 15px; border-radius: 12px; border: 1px dashed var(--accent); margin-bottom: 25px; }
        .create-post h4 { font-size: 14px; margin-bottom: 10px; color: var(--accent); }
        .file-input { font-size: 12px; margin-bottom: 10px; width: 100%; }
        .post-btn { width: 100%; padding: 10px; background: var(--accent); color: #fff; border: none; border-radius: 6px; font-weight: 600; }

        /* --- FEED GRID --- */
        .feed-tabs { display: flex; justify-content: space-around; border-bottom: 1px solid #efefef; margin-bottom: 10px; }
        .tab { padding: 10px; font-weight: 600; font-size: 14px; color: #888; cursor: pointer; border-bottom: 2px solid transparent; }
        .tab.active { color: #000; border-color: #000; }

        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
        .grid-item { aspect-ratio: 1/1; background: #eee; overflow: hidden; position: relative; }
        .grid-item img { width: 100%; height: 100%; object-fit: cover; }
        .vid-badge { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.5); color: #fff; font-size: 10px; padding: 2px 5px; border-radius: 4px; }

        /* --- FOOTER --- */
        #sw-footer { background: #050b1a; color: #fff; padding: 40px 20px; text-align: center; margin-top: 50px; }
    </style>
</head>
<body>

<header id="main-header">
    <a href="index.html">SAINIWALAA</a>
    <div style="font-size: 12px; font-weight: 600;">CREATOR ZONE</div>
</header>

<div class="banner"></div>

<div class="profile-section">
    <div class="pfp-wrap">
        <img src="https://i.pravatar.cc/150?u=jaipur" class="pfp-img">
    </div>

    <div class="user-info">
        <h1>jaipur_kurti_hub <span class="blue-tick">✔</span></h1>
        <div class="bio">
            🌸 Authentic Jaipur Collection <br>
            👗 Manufacturing & Retail <br>
            ✨ 90s Reels | Lifestyle | Fashion <br>
            📍 Mansarovar, Jaipur
        </div>
    </div>

    <div class="stats">
        <div><b>85</b> Posts</div>
        <div><b>12.8K</b> Followers</div>
        <div><b>450</b> Following</div>
    </div>

    <div class="action-btns">
        <button class="btn btn-follow" onclick="this.innerText='Following'">Follow</button>
        <button class="btn btn-msg">Message</button>
    </div>

    <div class="create-post">
        <h4>Create New Post (Test Mode)</h4>
        <input type="file" id="mediaInput" class="file-input" multiple accept="image/*,video/*">
        <textarea id="caption" style="width:100%; padding:8px; border-radius:6px; border:1px solid #ddd; font-size:13px;" placeholder="Caption likhein..."></textarea>
        <button class="post-btn" onclick="addPost()">Post to Feed</button>
    </div>

    <div class="feed-tabs">
        <div class="tab active">POSTS</div>
        <div class="tab">REELS</div>
        <div class="tab">TAGGED</div>
    </div>

    <div class="grid" id="feedGrid">
        <div class="grid-item"><img src="https://picsum.photos/400/400?1"></div>
        <div class="grid-item"><img src="https://picsum.photos/400/400?2"><div class="vid-badge">90s</div></div>
        <div class="grid-item"><img src="https://picsum.photos/400/400?3"></div>
        <div class="grid-item"><img src="https://picsum.photos/400/400?4"></div>
        <div class="grid-item"><img src="https://picsum.photos/400/400?5"></div>
        <div class="grid-item"><img src="https://picsum.photos/400/400?6"></div>
    </div>
</div>

<footer id="sw-footer">
    <p style="font-size: 14px; font-weight: 600; color: #ff9800;">SAINIWALAA</p>
    <p style="font-size: 11px; opacity: 0.6; margin-top: 10px;">© 2026 Social Creator Zone</p>
</footer>

<script>
    function addPost() {
        const fileInput = document.getElementById('mediaInput');
        const grid = document.getElementById('feedGrid');
        
        if (fileInput.files.length === 0) {
            alert("Kripya ek photo select karein!");
            return;
        }

        // Preview Logic for Test
        const file = fileInput.files[0];
        const reader = new FileReader();

        reader.onload = function(e) {
            const newItem = document.createElement('div');
            newItem.className = 'grid-item';
            newItem.innerHTML = `<img src="${e.target.result}">`;
            grid.prepend(newItem); // Naya post sabse upar dikhega
            alert("Post Uploaded (Local Preview)!");
        }

        reader.readAsDataURL(file);
    }
</script>

</body>
</html>
